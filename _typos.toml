[files]
# Vendored three.js modules (minified upstream code; not ours to spell-check)
extend-exclude = ["**/console-3d/vendor/"]

[default.extend-words]
# Domain-specific terms that aren't typos
# three.js MeshStandardMaterial property (console-3d world renderer)
metalness = "metalness"
ccxi = "ccxi"
ccxseg = "ccxseg"
# Projections snapshot companion. Was `ccxs`, renamed so that `ccx<lane>` stays
# the CoreCrux segment-companion namespace (a snapshot is not a lane).
ccxsnap = "ccxsnap"
CSNP = "CSNP"
corecrux = "corecrux"
corecruxd = "corecruxd"
corecruxctl = "corecruxctl"
fpr = "fpr"
pfordelta = "pfordelta"
FPR = "FPR"
# COSE — CBOR Object Signing and Encryption (RFC 8152 / RFC 9360),
# used in the C2PA X.509 envelope (`x5chain` header) wiring.
COSE = "COSE"
Cose = "Cose"
# NLP tokenizer: stemming test data (intentional substrings)
ment = "ment"
ful = "ful"
runn = "runn"
# Canvas/rings level-of-detail acronym (console v2 + rings prototype)
LOD = "LOD"
lod = "lod"
# Threshold variable shorthand in the rings prototype (G_THR / const thr)
thr = "thr"
THR = "THR"
# Hyphenated "mis-rendering" (console v2 comment)
mis = "mis"
numer = "numer"
RTO = "RTO"
ba = "ba"
Nd = "Nd"
als = "als"
mch = "mch"
# console graph-navigator local var: pn = parent node (artefact render loop)
pn = "pn"
# Hetzner Helsinki datacentre code in the bare-metal runner hostname runner-hel1
hel = "hel"
# in-toto attestation format — SLSA provenance files are *.intoto.jsonl
intoto = "intoto"

[default.extend-identifiers]
# Acceptable variant spelling (used in struct fields and function names)
unparseable = "unparseable"
unparseable_segment_files = "unparseable_segment_files"
verify_with_unparseable_sig_cbor = "verify_with_unparseable_sig_cbor"
compare_dependent_keys_unparseable_engine_timestamp_no_drift_warn = "compare_dependent_keys_unparseable_engine_timestamp_no_drift_warn"
build_trace_summary_unparseable_body = "build_trace_summary_unparseable_body"
build_subject_links_unparseable_body = "build_subject_links_unparseable_body"
build_lineage_unparseable_body = "build_lineage_unparseable_body"
