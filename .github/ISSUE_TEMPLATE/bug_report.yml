name: Bug Report
description: Report a bug in Crux Daemon
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please fill in the details below."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g., 0.1.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - macOS ARM64
        - macOS x86_64
        - Docker
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
