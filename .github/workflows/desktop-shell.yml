# Desktop shell (Tauri v2) — build gates for `shells/desktop/**`.
#
# The desktop app pulls the webkit2gtk / GTK stack and cannot build on the
# headless CueCrux CI *self-hosted* runners or the WSL dev box, so the Linux
# jobs here run on GitHub-hosted `ubuntu-latest` and install the Tauri v2 Linux
# prerequisites themselves. No release/deploy steps.
#
# One job is the exception: `desktop GUI smoke (windows, interactive session)`
# runs on a self-hosted Windows runner that executes inside a real logged-on
# desktop (labels `self-hosted, windows-gui`). It exists because compiling and
# bundling cannot answer "does the app actually start" — a Tauri/WebView2 window
# cannot be created in a headless or Session 0 context at all, so launch,
# sidecar spawn, and installer behaviour are only observable on a box with a
# desktop. See `docs/self-hosted-runner.md` for how that runner is provisioned.
#
# `desktop app compile gate (linux)` is a REQUIRED status check. To be requirable
# without deadlocking the merge queue, the workflow must ALWAYS trigger (so the
# check reports on every PR and on the `merge_group` speculative ref) and skip the
# heavy build via a job-level `if:` when nothing under `shells/desktop/**` changed.
# A path filter on the trigger cannot do this: a workflow that never runs never
# reports, and the queue hangs on the missing check. A job SKIPPED by `if:`,
# by contrast, reports as skipped — which GitHub counts as a passing required
# check (same pattern `ci.yml` uses for its docs-only skips).
name: desktop-shell

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) Detect whether this change touches the desktop shell. The heavy jobs skip
  #    (and report skipped = pass) when it does not, so the required compile gate
  #    always reports without running a ~10-minute webkit build on unrelated PRs.
  changes:
    name: Detect desktop change scope
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
            if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
              files=$(git diff --name-only "$base".."$head")
            else
              files=""
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$(git merge-base "$base" HEAD)"..HEAD)
          else
            files=""
          fi
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # Empty diff (couldn't classify) is the safe default: run the gate.
          # Herestring, not `echo | grep`: under pipefail a SIGPIPE'd echo
          # would misclassify a desktop change as skippable (see ci.yml).
          if [ -z "$files" ] || grep -qE '^shells/desktop/|^\.github/workflows/desktop-shell\.yml$' <<< "$files"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "no desktop-shell changes — heavy jobs will skip (report skipped = pass)"
          fi

  # 1) The std-only lifecycle crate: fully unit-tested (also green on the dev box).
  lifecycle:
    name: lifecycle crate (std-only unit tests)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (lifecycle)
        run: cargo test --manifest-path shells/desktop/lifecycle/Cargo.toml --locked

  # 2) Compile gate for the Tauri app on Linux. Builds the sidecar first and
  #    stages it into the externalBin slot, then compiles the app crate.
  app-compile:
    name: desktop app compile gate (linux)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev pkg-config

      - name: install tauri-cli v2
        run: cargo install tauri-cli --version "^2.0" --locked

      # Icons are generated, not committed (see shells/desktop/README.md). The
      # compile gate runs `tauri::generate_context!()`, which opens the icon set
      # at build time, so the icons must exist before `cargo build` — mirror the
      # bundle job's generation step here or the proc macro panics on a missing
      # icons/32x32.png.
      - name: generate icon set from the CueCrux arc-loop art
        run: |
          cargo tauri icon crates/corecruxd/console/assets/CueCrux-Arc-Loop.png \
            --output shells/desktop/app/icons

      - name: build corecruxd sidecar (release, CPU-only)
        run: cargo build --locked --release --bin corecruxd

      - name: stage sidecar into the externalBin slot
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p shells/desktop/app/binaries
          cp target/release/corecruxd "shells/desktop/app/binaries/corecruxd-${triple}"
          ls -l shells/desktop/app/binaries

      - name: compile gate — cargo build (desktop app)
        run: cargo build --locked --release --manifest-path shells/desktop/app/Cargo.toml

  # 3) Full bundle (installer artifacts). Follow-up only: non-blocking while the
  #    icon pipeline and per-platform bundlers are finalised.
  app-bundle:
    name: desktop bundle (follow-up, non-blocking)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev pkg-config

      - name: install tauri-cli v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: generate icon set from the CueCrux arc-loop art
        run: |
          cargo tauri icon crates/corecruxd/console/assets/CueCrux-Arc-Loop.png \
            --output shells/desktop/app/icons

      - name: build corecruxd sidecar (release, CPU-only)
        run: cargo build --locked --release --bin corecruxd

      - name: stage sidecar into the externalBin slot
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p shells/desktop/app/binaries
          cp target/release/corecruxd "shells/desktop/app/binaries/corecruxd-${triple}"

      - name: bundle (cargo tauri build)
        working-directory: shells/desktop/app
        run: cargo tauri build

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crux-desktop-shell-linux
          path: |
            shells/desktop/app/target/release/bundle/**
          if-no-files-found: warn

  # 4) Windows GUI smoke: bundle the MSI, install it, launch the installed app,
  #    and assert the things only a real desktop can show. Runs on the
  #    operator-owned interactive runner (`self-hosted, windows-gui`).
  #
  #    Non-blocking on purpose. It depends on one VM, so an offline or busy box
  #    must not gate the merge queue — but unlike the Linux jobs it can catch a
  #    Windows-only regression (dbb3897 fixed three that no Linux runner could
  #    see, and noted there was no Windows job to catch the next one).
  #    KEEP EVERY `run:` BLOCK BELOW PURE ASCII. `shell: powershell` is Windows
  #    PowerShell 5.1, which reads a BOM-less script as ANSI, not UTF-8. An em
  #    dash (U+2014, `e2 80 94`) then decodes under CP1252 as `a-hat`, `euro`,
  #    U+201D — and U+201D is a right *smart quote*, which PowerShell honours as
  #    a string delimiter. One em dash inside a message string opens a string
  #    that never closes: `TerminatorExpectedAtEndOfString`, before a single line
  #    executes. YAML comments and step names are fine; only `run:` bodies parse.
  windows-gui-smoke:
    name: desktop GUI smoke (windows, interactive session)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: [self-hosted, windows-gui]
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      # Fail loudly in 5 seconds rather than 40 minutes later at app launch.
      # Session 0 is the failure this whole runner exists to avoid: a runner
      # installed as a Windows service, or registered with
      # `Register-ScheduledTask -User/-Password` (which forces
      # LogonType=Password), runs where there is no desktop and WebView2 cannot
      # create a window.
      - name: preflight — interactive desktop + Windows build toolchain
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\windows-gui-evidence" | Out-Null
          $fail = @()

          $sid = (Get-Process -Id $PID).SessionId
          Write-Host "runner session id : $sid"
          if ($sid -eq 0) {
            $fail += 'runner is in Session 0 (no desktop). It must run as a scheduled task with LogonType=Interactive under an autologon user, not as a Windows service.'
          }
          $explorer = Get-Process explorer -ErrorAction SilentlyContinue
          Write-Host "explorer.exe      : $(if ($explorer) { 'session ' + $explorer[0].SessionId } else { 'NOT RUNNING' })"
          if (-not $explorer) {
            $fail += 'explorer.exe is not running: this is a Server Core image, or no user is logged on. Server Core cannot be converted to Desktop Experience.'
          }

          Add-Type -AssemblyName System.Windows.Forms
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "virtual screen    : $($vs.Width)x$($vs.Height)"
          if ($vs.Width -le 0 -or $vs.Height -le 0) { $fail += 'no display surface available' }

          foreach ($t in 'cargo', 'rustc', 'git') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            Write-Host "$($t.PadRight(18)): $(if ($c) { $c.Source } else { 'MISSING' })"
            if (-not $c) { $fail += "$t is not on PATH" }
          }
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            $fail += 'cargo-tauri is not on PATH (cargo install tauri-cli --version "^2.0" --locked)'
          }
          $link = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "MSVC link.exe     : $(if ($link) { $link.FullName } else { 'MISSING' })"
          if (-not $link) { $fail += 'MSVC link.exe not found -- install Visual Studio Build Tools 2022 with the VCTools workload' }

          $wvKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $wv = $null
          foreach ($k in $wvKeys) { if (-not $wv) { $wv = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv } }
          Write-Host "WebView2 runtime  : $(if ($wv) { $wv } else { 'NOT INSTALLED' })"
          if (-not $wv) { $fail += 'the WebView2 Evergreen runtime is not installed' }

          if ($fail.Count) {
            foreach ($f in $fail) { Write-Host "::error::$f" }
            Write-Host "::error::Provision this runner with scripts/provision-windows-gui-runner.ps1 -- see docs/self-hosted-runner.md."
            exit 1
          }
          Write-Host 'preflight OK: interactive desktop with a full Windows build toolchain'

      # Icons are generated, not committed — see the app-compile job for why the
      # proc macro needs them present before any cargo build.
      - name: generate icon set from the CueCrux arc-loop art
        run: cargo tauri icon crates/corecruxd/console/assets/CueCrux-Arc-Loop.png --output shells/desktop/app/icons

      - name: build corecruxd sidecar (release, CPU-only)
        run: cargo build --locked --release --bin corecruxd

      # Tauri resolves the sidecar as `corecruxd.exe` beside the app binary
      # (resolve_sidecar_binary in shells/desktop/app/src/main.rs), and strips
      # the target triple at bundle time. The staged name must carry both the
      # triple and the .exe suffix or the bundler will not find it.
      - name: stage sidecar into the externalBin slot
        run: |
          $triple = ((rustc -vV) | Select-String '^host:').ToString().Split(' ')[1]
          Write-Host "host triple: $triple"
          New-Item -ItemType Directory -Force -Path 'shells\desktop\app\binaries' | Out-Null
          Copy-Item 'target\release\corecruxd.exe' "shells\desktop\app\binaries\corecruxd-$triple.exe" -Force
          Get-ChildItem 'shells\desktop\app\binaries' | Format-Table Name, Length -AutoSize

      - name: bundle (cargo tauri build)
        working-directory: shells/desktop/app
        run: cargo tauri build

      - name: install the MSI (per-machine, silent)
        run: |
          $ev  = "$env:GITHUB_WORKSPACE\windows-gui-evidence"
          $msi = Get-ChildItem 'shells\desktop\app\target\release\bundle\msi\*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            Write-Host '::error::cargo tauri build produced no .msi under target/release/bundle/msi'
            exit 1
          }
          Write-Host "installing $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"
          $log = "$ev\msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          # 0 = installed, 3010 = installed, reboot queued
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Write-Host "::error::MSI install failed with exit $($p.ExitCode) -- see the msi-install.log artifact"
            exit 1
          }
          # `productName` names the product, the install dir, and the Start Menu
          # entry -- it is NOT the executable name. tauri.conf.json sets
          # productName "Crux" but no mainBinaryName, so the shipped binary keeps
          # the cargo bin name (crux-desktop-shell.exe). Read the product from
          # config and the layout from the installer; hardcoding either is how
          # this step failed the first time it ran for real.
          $product = (Get-Content 'shells\desktop\app\tauri.conf.json' -Raw | ConvertFrom-Json).productName
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -eq $product } | Select-Object -First 1
          if (-not $entry) {
            Write-Host "::error::msiexec reported success but registered no uninstall entry named '$product'"
            exit 1
          }

          # Record teardown facts BEFORE any assertion below can exit, or the
          # cleanup step has nothing to act on and the box stays dirty for the
          # next run. Uninstall by ProductCode rather than .msi path, so teardown
          # does not depend on the build tree still being there.
          (Split-Path $entry.PSPath -Leaf) | Out-File "$ev\product-code.txt" -Encoding ascii
          $product | Out-File "$ev\product-name.txt" -Encoding ascii

          $dir = if ($entry.InstallLocation) { $entry.InstallLocation.TrimEnd('\') } else { Join-Path $env:ProgramFiles $product }
          Write-Host "product     : $product"
          Write-Host "install dir : $dir"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize

          $app = Get-ChildItem (Join-Path $dir '*.exe') -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -ne 'corecruxd.exe' } | Select-Object -First 1
          if (-not $app) {
            Write-Host "::error::no application .exe found in $dir"
            exit 1
          }
          Write-Host "app binary  : $($app.Name)"
          $app.FullName | Out-File "$ev\app-exe.txt" -Encoding ascii

          # The bundled sidecar must ship beside the app, de-tripled by the bundler.
          if (-not (Test-Path (Join-Path $dir 'corecruxd.exe'))) {
            Write-Host '::error::corecruxd.exe is missing from the install dir -- the externalBin sidecar was not bundled'
            exit 1
          }
          Write-Host 'MSI OK: installed per-machine, sidecar present beside the app'

      # The actual GUI assertions. Evidence (screenshot + process table) is
      # written before any assertion can fail, so a red run still uploads the
      # picture of what happened.
      - name: launch the installed app and observe the desktop
        run: |
          $ev  = "$env:GITHUB_WORKSPACE\windows-gui-evidence"
          $exe = (Get-Content "$ev\app-exe.txt" -Raw).Trim()
          Write-Host "launching $exe"
          $app = Start-Process $exe -PassThru

          $window = $null; $webview = @(); $sidecar = @()
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 3
            $p = Get-Process -Id $app.Id -ErrorAction SilentlyContinue
            if (-not $p) { break }
            $p.Refresh()
            if (-not $window -and $p.MainWindowHandle -ne 0) { $window = $p.MainWindowTitle }
            $webview = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
            $sidecar = @(Get-Process corecruxd -ErrorAction SilentlyContinue)
            if ($window -and $webview.Count -and $sidecar.Count) { break }
          }

          # --- evidence first ---
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $vs  = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($vs.Location, [System.Drawing.Point]::Empty, $vs.Size)
          $bmp.Save("$ev\desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Get-Process | Where-Object { $_.Name -match 'Crux|corecruxd|msedgewebview2' } |
            Select-Object Name, Id, SessionId, MainWindowTitle |
            Format-Table -AutoSize | Out-File "$ev\processes.txt" -Encoding utf8
          Get-Content "$ev\processes.txt"

          # --- assertions ---
          $alive = [bool](Get-Process -Id $app.Id -ErrorAction SilentlyContinue)
          $fail = @()
          Write-Host "app process alive     : $alive"
          if (-not $alive) { $fail += 'the app exited on its own after launch' }
          Write-Host "main window title     : $(if ($window) { $window } else { 'NONE' })"
          if (-not $window) { $fail += 'no top-level window appeared (setup_shell builds the main window with visible:true)' }
          Write-Host "msedgewebview2 procs  : $($webview.Count)"
          if (-not $webview.Count) { $fail += 'no msedgewebview2 process -- the WebView2 host never started, so nothing rendered' }
          Write-Host "corecruxd sidecar     : $($sidecar.Count)"
          if (-not $sidecar.Count) { $fail += 'the bundled corecruxd sidecar was never spawned (default profile is bundled on a fresh box)' }

          if ($fail.Count) {
            foreach ($f in $fail) { Write-Host "::error::$f" }
            exit 1
          }
          Write-Host 'GUI smoke OK: window created, WebView2 rendering, bundled sidecar running'

      # The lifecycle claim: a graceful close must reap the shell-owned sidecar
      # (on_window_event -> shutdown_owned_resources). Killing the process would
      # legitimately orphan it, so only assert the reap when the close was clean.
      - name: graceful close reaps the bundled sidecar
        run: |
          $ev   = "$env:GITHUB_WORKSPACE\windows-gui-evidence"
          $name = [IO.Path]::GetFileNameWithoutExtension((Get-Content "$ev\app-exe.txt" -Raw).Trim())
          $proc = Get-Process $name -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) {
            Write-Host '::warning::the app was already gone; nothing to close'
            exit 0
          }
          $closed = $proc.CloseMainWindow()
          Write-Host "CloseMainWindow sent: $closed"
          $gone = $proc.WaitForExit(30000)
          Write-Host "app exited cleanly  : $gone"
          if (-not $gone) {
            Write-Host '::warning::the app did not exit within 30s of WM_CLOSE; killing it, so the sidecar reap is not asserted'
            $proc.Kill()
            exit 0
          }
          Start-Sleep -Seconds 5
          $orphans = @(Get-Process corecruxd -ErrorAction SilentlyContinue)
          Write-Host "corecruxd after exit: $($orphans.Count)"
          if ($orphans.Count) {
            Write-Host '::error::the bundled corecruxd survived a graceful app exit -- the lifecycle supervisor leaked a sidecar'
            exit 1
          }
          Write-Host 'lifecycle OK: graceful close reaped the bundled sidecar'

      - name: uninstall and clean up
        if: always()
        run: |
          $ev = "$env:GITHUB_WORKSPACE\windows-gui-evidence"
          if (Test-Path "$ev\app-exe.txt") {
            $name = [IO.Path]::GetFileNameWithoutExtension((Get-Content "$ev\app-exe.txt" -Raw).Trim())
            Get-Process $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Process corecruxd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if (Test-Path "$ev\product-code.txt") {
            $code = (Get-Content "$ev\product-code.txt" -Raw).Trim()
            $p = Start-Process msiexec.exe -ArgumentList '/x', $code, '/qn', '/norestart' -Wait -PassThru
            Write-Host "uninstall $code exit: $($p.ExitCode)"
          } else {
            Write-Host '::warning::no product-code.txt recorded, so nothing was uninstalled'
          }

          if (Test-Path "$ev\product-name.txt") {
            $leftover = Join-Path $env:ProgramFiles (Get-Content "$ev\product-name.txt" -Raw).Trim()
            if (Test-Path $leftover) { Write-Host "::warning::$leftover still exists after uninstall" }
          }

      - name: upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crux-desktop-windows-gui-smoke
          path: |
            windows-gui-evidence/**
            shells/desktop/app/target/release/bundle/**
          if-no-files-found: warn
