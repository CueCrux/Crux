name: Coverage Attestation

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-attestation:
    name: Coverage attestation
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo-${{ github.job }}-${{ github.run_id }}
      # Keep in lock-step with ci.yml's COVERAGE_IGNORE_REGEX (see the rationale
      # there). Excluded = binary entry points (main.rs for corecruxd/corecruxctl/
      # crux-claude-hooks/crux-config-wizard + crux_llm_shim), the interactive
      # config wizard, and the dataplane layer which is an unconstructable
      # typecheck stub in CE (pool.rs `DataPlanePool` is never built / methods are
      # `unreachable!()`; dataplane_store.rs; http/dataplane.rs). Critical
      # data-plane / receipts / projections / admin /
      # audit-pack surfaces are in scope and gated (2026-04-05 audit HIGH #9).
      COVERAGE_IGNORE_REGEX: '(.*/corecruxd/src/pool\.rs|.*/corecruxd/src/dataplane_store\.rs|.*/corecruxd/src/http/dataplane\.rs|.*/corecruxd/src/main\.rs|.*/corecruxctl/src/main\.rs|.*/crux-claude-hooks/src/main\.rs|.*/crux-claude-hooks/src/bin/crux_llm_shim\.rs|.*/crux-config-wizard/src/main\.rs|.*/crux-config-wizard/src/interactive\.rs)$'
      CORECRUX_COVERAGE_ATTEST_SIGNING_KEY_B64: ${{ secrets.CORECRUX_COVERAGE_ATTEST_SIGNING_KEY_B64 }}
      CORECRUX_COVERAGE_ATTEST_KEY_ID: ${{ vars.CORECRUX_COVERAGE_ATTEST_KEY_ID || 'coverage-attest' }}
    steps:
      - name: Seed per-job CARGO_HOME from shared toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          for tool in /home/gha-runner/.cargo/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Preflight self-hosted runner
        run: |
          set +e
          MISSING=""
          if ! command -v cc >/dev/null 2>&1; then MISSING="$MISSING cc"; fi
          if ! sudo -n true 2>/dev/null; then MISSING="$MISSING passwordless-sudo"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tooling:$MISSING"
            echo "::error::Run scripts/provision-self-hosted-runner.sh on the runner host (or add ci:fallback label)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Generate coverage reports
        run: |
          set -euo pipefail
          bash scripts/ci-cargo-with-fallback.sh llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --lcov --output-path lcov.info 2>&1 | tee llvm-cov-run.log
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only | tee coverage-summary.txt

      - name: Guard README coverage/test-count claims against drift
        run: |
          set -euo pipefail
          # Cheap measured test count: sum "test result: ok. N passed" lines from
          # the coverage run above (no extra test invocation).
          MEASURED_TESTS="$(awk '/test result: ok\./ { for (i = 1; i <= NF; i++) if ($i == "passed;") s += $(i - 1) } END { print s + 0 }' llvm-cov-run.log)"
          bash scripts/coverage-readme-drift.sh coverage-summary.txt "$MEASURED_TESTS"

      - name: Build coverage attestation
        run: bash scripts/coverage-attest-ci.sh

      - name: Upload coverage attestation
        uses: actions/upload-artifact@v7
        with:
          name: coverage-attestation-${{ github.run_id }}
          path: |
            coverage-summary.txt
            lcov.info
            coverage-attestation/

      - name: Reclaim per-job CARGO_HOME
        if: always()
        # Same disk-leak mitigation as every other per-run CARGO_HOME job
        # (incident 2026-06-15); this workflow was the one place missing it.
        run: rm -rf "$CARGO_HOME"
