name: Python SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: [self-hosted, ci]
    # PyPI Trusted Publishing (OIDC) — no PYPI_TOKEN secret. Requires a
    # (pending) trusted publisher on pypi.org for project `corecrux-client`:
    # owner CueCrux, repository Crux, workflow sdk-python.yml.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install build
        working-directory: sdks/python
      - run: python -m build
        working-directory: sdks/python
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@v1.14.0 # immutable version tag (Docker action: image is published per version tag, NOT per commit SHA → SHA-pin gives manifest-unknown)
        with:
          packages-dir: sdks/python/dist
