#
# Keeps the agent-facing doc set (AGENTS.md, docs/agent/*) provably current: every
# symbol, test, crate, and fuzz target it references must still exist in the tree.
# Runs on every PR (incl. docs-only — deliberately NOT gated on the code-scope filter).
#
# `Verify agent-doc references resolve` is a REQUIRED status check. The
# `merge_group:` trigger is mandatory for that: the merge queue evaluates required
# checks on the `gh-readonly-queue/...` speculative ref, so without it the queue
# would hang waiting on a check that never runs there. No path filter — it must
# report on every PR and every queue entry.
name: Agent docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify agent-doc references resolve
    runs-on: [self-hosted, ci, Linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-${{ github.job }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check agent docs
        # --exec also runs the cheap documented commands (cargo fmt --check);
        # heavyweight build/test/clippy stay in ci.yml.
        run: bash scripts/check-agent-docs.sh --exec
