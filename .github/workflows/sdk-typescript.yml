name: TypeScript SDK

on:
  push:
    tags:
      - 'v*'
      - 'sdk-typescript-v*'
  pull_request:
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/sdk-typescript.yml'
  workflow_dispatch:

# Build/test runs never receive registry-write OIDC permission. Only an
# explicit sdk-typescript-vX.Y.Z tag can start the publish job below.
permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require SDK tag to match package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-typescript-v')
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#sdk-typescript-v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::SDK tag version $tag_version does not match package.json version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Unit tests (wire shape, against a local stub server)
        run: node --test test/*.test.mjs
      - name: Pack exact publish artifact
        run: |
          rm -rf package
          mkdir package
          npm pack --pack-destination package
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk-${{ github.sha }}
          path: sdks/typescript/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-typescript-v')
    needs: build
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The package version
    # remains immutable: duplicate uploads fail closed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install OIDC-capable npm
        run: npm install -g npm@11.6.2
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: typescript-sdk-${{ github.sha }}
          path: package
      - name: Publish exact package with provenance
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(package/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one tarball in package/, found ${#tarballs[@]}"
            exit 1
          fi
          # The leading ./ is load-bearing. Without it npm reads `package/foo.tgz`
          # as a GitHub `owner/repo` shorthand and tries to git-clone it:
          #   npm error command git ls-remote ssh://git@github.com/package/....tgz.git
          #   npm error git@github.com: Permission denied (publickey).
          # Publishing has never succeeded on this workflow, which is why 0.2.0
          # (tagged July) never reached npm either.
          npm publish "./${tarballs[0]}" --access public --provenance
