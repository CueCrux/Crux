name: TypeScript SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: [self-hosted, ci]
    # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. Requires the
    # @cuecrux/client package to exist on npmjs.com with a trusted publisher
    # configured (owner CueCrux, repository Crux, workflow sdk-typescript.yml).
    # First-ever publish is manual from an operator login; CI is tokenless after.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # npm OIDC trusted publishing needs npm >= 11.5
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm publish --access public
