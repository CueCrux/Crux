name: TypeScript SDK

on:
  push:
    tags:
      - 'v*'
      - 'sdk-typescript-v*'
  pull_request:
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/sdk-typescript.yml'
  workflow_dispatch:

# Build/test runs never receive registry-write OIDC permission. Only an
# explicit sdk-typescript-vX.Y.Z tag can start the publish job below.
permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Require SDK tag to match package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-typescript-v')
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#sdk-typescript-v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::SDK tag version $tag_version does not match package.json version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack exact publish artifact
        run: |
          rm -rf package
          mkdir package
          npm pack --pack-destination package
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-sdk-${{ github.sha }}
          path: sdks/typescript/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-typescript-v')
    needs: build
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The package version
    # remains immutable: duplicate uploads fail closed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install OIDC-capable npm
        run: npm install -g npm@11.6.2
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typescript-sdk-${{ github.sha }}
          path: package
      - name: Publish exact package with provenance
        run: npm publish package/*.tgz --access public --provenance
