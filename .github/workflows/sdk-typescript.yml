name: TypeScript SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: [self-hosted, ci]
    # Publishes @cuecrux SDK packages using the NPM_TOKEN granular-access
    # secret (scope @cuecrux, read+write). The token creates the package on
    # first publish, so no manual workstation publish is needed.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
