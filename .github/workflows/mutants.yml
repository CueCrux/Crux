#
# Mutation testing for the tamper-evidence trust core.
#
# Region coverage proves a line executed; it does NOT prove a test would catch
# a regression. `cargo-mutants` mutates the code and checks that some test
# fails — surviving mutants are assertion gaps.
#
# Design (ExecPlan crux-mutation-testing-first-class-2026-07-19; audit in
# .agent/notes/mutation-testing-audit-2026-07-19.md):
#
# * SHARDED 8 ways so each job finishes in well under an hour. The previous
#   single 3-6h job was OOM-killed mid-run on ~29 of 31 nights (confirmed
#   `cargo-mutants invoked oom-killer` in runner-hel1's journal): the shared
#   62G host hits daily memory pressure in the ~09:20-10:30 UTC window when
#   the morning eval jobs land, and the long-running mutants job was the
#   process with the highest OOM score. It uploaded no report and still
#   showed green.
# * HONEST STATUS: cargo-mutants exit 2 ("missed mutants found") is expected
#   and reported; any other non-zero exit (baseline failure, internal error,
#   cancellation) fails the shard. The merge job fails when any shard died.
# * RATCHET, not gate: survivors are compared against the checked-in
#   .github/mutants-baseline.txt (normalised "path: description", a count
#   ratchet per normalised bucket). NEW survivors turn the nightly red;
#   no-longer-missed ones are listed (with their disposition) so the baseline
#   can be ratcheted down. Not a required check on main (and must not become one
#   without a merge_group trigger — see merge-queue rule).
# * Cron at 02:30 UTC and max-parallel: 3 so the whole run clears the fleet
#   kill window with margin while bounding concurrent build load on the
#   shared runner host (OOM incident 2026-06-22 — hence CARGO_BUILD_JOBS=4).
#
# PR-time incremental mutation testing lives in mutants-diff.yml.
name: Mutation (trust core)

on:
  schedule:
    - cron: "30 2 * * *" # nightly 02:30 UTC; must clear the host's morning memory-pressure window (~09:20 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Namespaced by event so a manual dispatch does not cancel (and discard)
  # an in-flight nightly's reports.
  group: mutants-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  MUTANTS_SHARDS: "8"

jobs:
  mutants:
    name: shard ${{ matrix.shard }}
    # Pinned, not widened — see the `test` job in ci.yml. This job runs the
    # workspace test suite, which fails on the vukgpu02 container pool.
    runs-on: [self-hosted, hel1]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Bound concurrent cargo builds on the shared runner host.
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-mutants-${{ matrix.shard }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # Pinned: cargo-mutants documents that its mutants.out format may
          # change between versions; scripts/mutants-report.py parses it.
          tool: cargo-mutants@27.1.0
      - name: Run cargo-mutants shard on the trust-core crates
        run: |
          set -uo pipefail
          # GitHub's default bash shell injects -e, so the exit code MUST be
          # captured with `|| rc=$?` — a bare `cmd; rc=$?` dies at the cmd
          # line before rc is read (first nightly, run 29720177941: all 8
          # shards "failed" with normal survivor exit codes).
          rc=0
          cargo mutants --no-shuffle --timeout 120 \
            --shard "${{ matrix.shard }}/${MUTANTS_SHARDS}" \
            -p corecrux-receipts -p corecrux-segment -p corecrux-storage || rc=$?
          # 0 = all caught; 2 = missed mutants; 3 = some mutants timed out.
          # All three are RESULTS — the merge job ratchets missed+timeout.
          # Anything else is an infra/baseline failure and must fail the
          # shard — silent death hid this job's results for a month.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then
            echo "::error::cargo-mutants exited $rc (4=baseline failed, other=infra — see log)"
            exit "$rc"
          fi
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 30
      - name: Reclaim per-job CARGO_HOME
        if: always()
        run: rm -rf "$CARGO_HOME"

  merge:
    name: merge + ratchet
    needs: mutants
    if: always()
    # Pinned, not widened — see the `test` job in ci.yml. This job runs the
    # workspace test suite, which fails on the vukgpu02 container pool.
    runs-on: [self-hosted, hel1]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutants-shard-*
          path: shard-reports
      - name: Merge, score, and ratchet against baseline
        run: |
          set -uo pipefail
          shopt -s nullglob
          dirs=(shard-reports/mutants-shard-*)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::no shard reports downloaded — every shard died before upload"
            exit 1
          fi
          rc=0
          python3 scripts/mutants-report.py \
            --outs "${dirs[@]}" \
            --baseline .github/mutants-baseline.txt \
            --summary "$GITHUB_STEP_SUMMARY" \
            --expect-min-viable 1200 || rc=$?  # -e-safe capture (see shard step)
          if [ "$rc" -eq 2 ]; then
            echo "::error::new mutation survivors vs .github/mutants-baseline.txt (see job summary)"
          fi
          if [ "${#dirs[@]}" -ne "${MUTANTS_SHARDS}" ]; then
            echo "::error::only ${#dirs[@]}/${MUTANTS_SHARDS} shard reports present — results are partial"
            rc=1
          fi
          if [ "${{ needs.mutants.result }}" != "success" ]; then
            echo "::error::one or more mutant shards failed or was cancelled"
            rc=1
          fi
          exit "$rc"
