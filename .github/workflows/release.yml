name: Release

on:
  push:
    tags: ["v*"]

# Job-scoped permissions only (ExecPlan crux-supply-chain-attestation-2026-06-11):
# id-token: write is confined to the jobs that actually sign (build) or
# attest (provenance); only the release job can write contents.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_SBOM_VERSION: "0.10.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # cosign keyless signing (OIDC identity token).
      id-token: write
    outputs:
      hashes-linux-amd64: ${{ steps.hashes.outputs.hashes-linux-amd64 }}
      hashes-darwin-arm64: ${{ steps.hashes.outputs.hashes-darwin-arm64 }}
      hashes-darwin-amd64: ${{ steps.hashes.outputs.hashes-darwin-amd64 }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: darwin-arm64
          - target: x86_64-apple-darwin
            # macos-13 is retired — jobs targeting it queue forever (stranded the
            # v0.4.7/v0.5.0/v0.5.1 release runs). macos-15-intel is GitHub's
            # supported Intel image; probed green on run 27429963193.
            os: macos-15-intel
            suffix: darwin-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          # Authenticate the action's GitHub API lookup — anonymous calls share
          # the hosted-runner IP rate limit and flaked v0.4.9 twice (10:40Z, 10:50Z).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          bash scripts/assert-daemon-release-boundary.sh
          bash scripts/assert-hosted-bridge-contract.sh
          cargo test --locked --workspace

      - name: Build release
        run: cargo build --locked --release

      # --- Trust-surface release gates (roadmap Phase 1.3; production-cutover) ---
      # The "reason people install this" checks, now release-blocking:
      #   * assert-no-phone-home.sh boots corecruxd under strace (linux-only)
      #     and fails the release if any non-loopback egress is attempted.
      #   * demo-receipt-tamper.sh proves CROWN verify-store catches an on-disk
      #     byte flip (pure offline; needs only corecruxctl + jq).
      #   * assert-context-custody.sh self-runs the exit test — exports a
      #     passport-signed custody bundle, verifies it offline (positive), then
      #     proves the offline verifier rejects a one-byte tamper (negative).
      #     Pure offline; needs only corecruxctl + jq.
      # Linux leg only: strace network tracing is linux-specific; ubuntu-latest
      # ships strace + jq. See the script headers for the CI-wiring rationale.
      - name: Trust-surface gates (no phone-home + receipt tamper + custody exit test)
        if: matrix.suffix == 'linux-amd64'
        run: |
          bash scripts/assert-no-phone-home.sh target/release/corecruxd
          CORECRUXCTL=target/release/corecruxctl bash scripts/demo-receipt-tamper.sh
          CORECRUXCTL=target/release/corecruxctl bash scripts/assert-context-custody.sh

      # --- SBOM + keyless signing (ExecPlan crux-supply-chain-attestation-2026-06-11, M3) ---
      # SBOM is generated into dist/ BEFORE packaging so the packaging
      # script's RELEASE-MANIFEST sha256 list covers it.
      - name: Generate SBOM (CycloneDX 1.6)
        run: |
          cargo install cargo-sbom --locked --version "$CARGO_SBOM_VERSION"
          mkdir -p dist
          cargo sbom --output-format cyclone_dx_json_1_6 \
            > "dist/crux-daemon-${{ matrix.suffix }}.cdx.json"

      - name: Package binaries
        run: bash scripts/package-daemon-release.sh ${{ matrix.suffix }} dist

      # --- Debian package + installer (daemon-distribution-packaging-2026-06-11,
      #     GATE-PACKAGE: installers built but never attached to releases) ---
      # Both live only on the linux-amd64 leg: the .deb bundles the amd64 binaries
      # that package-daemon-release.sh just staged (dist/crux-linux-amd64,
      # dist/corecruxctl-linux-amd64), and install.sh is platform-agnostic so one
      # copy suffices. Staged into dist/ so the leg's upload + the release job's
      # dist/* glob carry them to the release with no upload-list change.
      - name: Build Debian package + stage installer
        if: matrix.suffix == 'linux-amd64'
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          CRUX_VERSION="${GITHUB_REF_NAME#v}" bash packaging/deb/build-deb.sh
          cp packaging/install.sh dist/install.sh

      - name: Install cosign
        # sigstore/cosign-installer v4.1.2 (pinned SHA — floating tags are a T.5 vector)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # Pin cosign 2.x: v3.0 `sign-blob` writes a Sigstore bundle by default
          # and the legacy --output-signature/--output-certificate-only call
          # below leaves the bundle path empty → "create bundle file: open :
          # no such file or directory" (v0.4.8 release-signing failure). 2.4.x
          # keeps the .sig/.pem contract the dist/* upload + SLSA subjects expect.
          cosign-release: 'v2.4.3'

      - name: Sign artifacts (cosign keyless)
        # Sign the per-suffix files only: the three binaries, the SBOM, and
        # RELEASE-MANIFEST-<suffix>.txt (whose sha256 list covers the shared
        # licence/docs files transitively). Shared files are NOT signed
        # per-leg — their .sig names would collide across the matrix when
        # artifacts are merged.
        run: |
          set -euo pipefail
          for f in \
            "dist/corecruxd-${{ matrix.suffix }}" \
            "dist/crux-${{ matrix.suffix }}" \
            "dist/corecruxctl-${{ matrix.suffix }}" \
            "dist/crux-daemon-${{ matrix.suffix }}.cdx.json" \
            "dist/RELEASE-MANIFEST-${{ matrix.suffix }}.txt"; do
            test -f "$f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      # Sign the .deb + installer with the same keyless flow. linux-amd64 only —
      # these are single (non-per-suffix) artifacts, so signing them once here
      # avoids the cross-matrix .sig name collision the shared-file note above
      # describes. The .deb version is embedded in its filename by build-deb.sh.
      - name: Sign Debian package + installer (cosign keyless)
        if: matrix.suffix == 'linux-amd64'
        run: |
          set -euo pipefail
          for f in \
            "dist/crux-daemon_${GITHUB_REF_NAME#v}_amd64.deb" \
            "dist/install.sh"; do
            test -f "$f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Compute provenance subjects
        id: hashes
        # Subjects for the SLSA generator: the same per-suffix file set that
        # was signed above. base64 -w0 is GNU-only; macOS base64 wraps off
        # by default, so use openssl for portability across the matrix.
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            SHA256="sha256sum"
          else
            SHA256="shasum -a 256"   # macOS runners
          fi
          subjects="$($SHA256 \
            "corecruxd-${{ matrix.suffix }}" \
            "crux-${{ matrix.suffix }}" \
            "corecruxctl-${{ matrix.suffix }}" \
            "crux-daemon-${{ matrix.suffix }}.cdx.json" \
            "RELEASE-MANIFEST-${{ matrix.suffix }}.txt" \
            | openssl base64 -A)"
          echo "hashes-${{ matrix.suffix }}=${subjects}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            dist/content/*
            dist/docs/*
          generate_release_notes: true

  # --- SLSA provenance (ExecPlan crux-supply-chain-attestation-2026-06-11, M4) ---
  # The three matrix legs export per-suffix base64(sha256sum) subject blocks;
  # this job concatenates them into the single base64-subjects input the
  # generator expects.
  combine-hashes:
    name: Combine provenance subjects
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - name: Combine per-target subject lists
        id: combine
        env:
          H_LINUX_AMD64: ${{ needs.build.outputs.hashes-linux-amd64 }}
          H_DARWIN_ARM64: ${{ needs.build.outputs.hashes-darwin-arm64 }}
          H_DARWIN_AMD64: ${{ needs.build.outputs.hashes-darwin-amd64 }}
        run: |
          set -euo pipefail
          for v in H_LINUX_AMD64 H_DARWIN_ARM64 H_DARWIN_AMD64; do
            test -n "${!v}" || { echo "::error::missing subjects from $v leg"; exit 1; }
          done
          combined="$(
            {
              echo "$H_LINUX_AMD64" | base64 -d
              echo "$H_DARWIN_ARM64" | base64 -d
              echo "$H_DARWIN_AMD64" | base64 -d
            } | base64 -w0
          )"
          echo "hashes=${combined}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    # needs release so upload-assets attaches to the already-created release
    # instead of racing softprops/action-gh-release.
    needs: [combine-hashes, release]
    permissions:
      actions: read # read the workflow run to record the builder identity
      id-token: write # sign the provenance (Sigstore keyless)
      contents: write # upload provenance to the release
    # NOTE: referenced by TAG, not commit SHA — the slsa-github-generator
    # explicitly requires tag refs for its reusable workflows (it verifies
    # its own release integrity internally; SHA refs are unsupported).
    # Documented exception to the pinned-SHA rule — see ExecPlan decision log.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.combine-hashes.outputs.hashes }}
      upload-assets: true
