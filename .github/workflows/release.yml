name: Release

on:
  push:
    tags: ["v*"]

# Job-scoped permissions only (ExecPlan crux-supply-chain-attestation-2026-06-11):
# id-token: write is confined to the jobs that actually sign (build) or
# attest (provenance); only the release job can write contents.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_SBOM_VERSION: "0.10.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # cosign keyless signing (OIDC identity token).
      id-token: write
    outputs:
      hashes-linux-amd64: ${{ steps.hashes.outputs.hashes-linux-amd64 }}
      hashes-darwin-arm64: ${{ steps.hashes.outputs.hashes-darwin-arm64 }}
      hashes-darwin-amd64: ${{ steps.hashes.outputs.hashes-darwin-amd64 }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: darwin-arm64
          - target: x86_64-apple-darwin
            # macos-13 is retired — jobs targeting it queue forever (stranded the
            # v0.4.7/v0.5.0/v0.5.1 release runs). macos-15-intel is GitHub's
            # supported Intel image; probed green on run 27429963193.
            os: macos-15-intel
            suffix: darwin-amd64
          # --- Linux cross legs (daemon-distribution-packaging M?, GATE-PACKAGE) ---
          # Both cross-compile on the x86_64 ubuntu runner using a native cross
          # toolchain (no Docker/qemu): build.rs uses vendored protoc + the cc
          # crate auto-selects the target C compiler, so only linking targets the
          # foreign arch. `cross: true` gates the build-only path below (tests
          # already run on the three native-arch legs; running the workspace
          # suite under emulation adds hours for no new coverage).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-musl-amd64
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cross legs need the target's std pre-installed; a no-op for the three
          # native legs whose target already matches the host toolchain.
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          # Authenticate the action's GitHub API lookup — anonymous calls share
          # the hosted-runner IP rate limit and flaked v0.4.9 twice (10:40Z, 10:50Z).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Native cross toolchain for the linux cross legs (musl + aarch64-gnu).
      # cc-crate builds pick these up automatically from the target triple; no
      # Docker/qemu involved (build-only, see the matrix comment).
      - name: Install cross toolchain
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          # rust-toolchain.toml pins the build toolchain (1.88.0), so the
          # Install Rust step's `targets:` lands on `stable`, not the pin —
          # v0.5.45 run 29626417383 failed with E0463 (target std missing).
          # Add the target against the toolchain cargo actually resolves here.
          rustup target add ${{ matrix.target }}

      - name: Run tests
        # Native legs only: cross legs are build-only (the three native-arch legs
        # already run the full suite; emulation here adds no coverage).
        if: ${{ !matrix.cross }}
        run: |
          bash scripts/assert-daemon-release-boundary.sh
          bash scripts/assert-hosted-bridge-contract.sh
          cargo test --locked --workspace

      - name: Build release
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release

      - name: Build release (cross)
        if: ${{ matrix.cross }}
        # Build just the three shipped bins for the target, then normalise the
        # output into target/release/ so package-daemon-release.sh (which reads
        # target/release/) works unchanged across native and cross legs.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --locked --release --target ${{ matrix.target }} \
            --bin corecruxd --bin corecruxctl --bin crux-hook
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/corecruxd" target/release/corecruxd
          cp "target/${{ matrix.target }}/release/corecruxctl" target/release/corecruxctl
          cp "target/${{ matrix.target }}/release/crux-hook" target/release/crux-hook

      # --- Trust-surface release gates (roadmap Phase 1.3; production-cutover) ---
      # The "reason people install this" checks, now release-blocking:
      #   * assert-no-phone-home.sh boots corecruxd under strace (linux-only)
      #     and fails the release if any non-loopback egress is attempted.
      #   * demo-receipt-tamper.sh proves CROWN verify-store catches an on-disk
      #     byte flip (pure offline; needs only corecruxctl + jq).
      #   * assert-context-custody.sh self-runs the exit test — exports a
      #     passport-signed custody bundle, verifies it offline (positive), then
      #     proves the offline verifier rejects a one-byte tamper (negative).
      #     Pure offline; needs only corecruxctl + jq.
      # Linux leg only: strace network tracing is linux-specific; ubuntu-latest
      # ships strace + jq. See the script headers for the CI-wiring rationale.
      - name: Trust-surface gates (no phone-home + receipt tamper + custody exit test)
        if: matrix.suffix == 'linux-amd64'
        run: |
          bash scripts/assert-no-phone-home.sh target/release/corecruxd
          CORECRUXCTL=target/release/corecruxctl bash scripts/demo-receipt-tamper.sh
          CORECRUXCTL=target/release/corecruxctl bash scripts/assert-context-custody.sh

      # --- SBOM + keyless signing (ExecPlan crux-supply-chain-attestation-2026-06-11, M3) ---
      # SBOM is generated into dist/ BEFORE packaging so the packaging
      # script's RELEASE-MANIFEST sha256 list covers it.
      - name: Generate SBOM (CycloneDX 1.6)
        run: |
          cargo install cargo-sbom --locked --version "$CARGO_SBOM_VERSION"
          mkdir -p dist
          cargo sbom --output-format cyclone_dx_json_1_6 \
            > "dist/crux-daemon-${{ matrix.suffix }}.cdx.json"

      - name: Package binaries
        run: bash scripts/package-daemon-release.sh ${{ matrix.suffix }} dist

      # --- Debian package (daemon-distribution-packaging-2026-06-11,
      #     GATE-PACKAGE: installers built but never attached to releases) ---
      # The linux-amd64 leg builds the .deb from the binaries staged above.
      # package-daemon-release.sh has already staged install.sh before generating
      # RELEASE-MANIFEST-linux-amd64.txt, so the installer is both manifest-covered
      # and directly signed below.
      - name: Build Debian package
        if: matrix.suffix == 'linux-amd64'
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          CRUX_VERSION="${GITHUB_REF_NAME#v}" bash packaging/deb/build-deb.sh

      - name: Install cosign
        # sigstore/cosign-installer v4.1.2 (pinned SHA — floating tags are a T.5 vector)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # Pin the patched 2.x line while legacy .sig/.pem consumers remain.
          # 2.6.2 fixes GHSA-whqx-f9j3-ch6m; v3 needs a separately tested
          # bundle-only migration.
          cosign-release: 'v2.6.2'

      - name: Sign artifacts (cosign keyless)
        # Sign the per-suffix files only: the four binaries, the SBOM, and
        # RELEASE-MANIFEST-<suffix>.txt (whose sha256 list covers the shared
        # licence/docs files transitively). Shared files are NOT signed
        # per-leg — their .sig names would collide across the matrix when
        # artifacts are merged.
        run: |
          set -euo pipefail
          for f in \
            "dist/corecruxd-${{ matrix.suffix }}" \
            "dist/crux-${{ matrix.suffix }}" \
            "dist/corecruxctl-${{ matrix.suffix }}" \
            "dist/crux-hook-${{ matrix.suffix }}" \
            "dist/crux-daemon-${{ matrix.suffix }}.cdx.json" \
            "dist/RELEASE-MANIFEST-${{ matrix.suffix }}.txt"; do
            test -f "$f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      # Sign the .deb + installer with the same keyless flow. linux-amd64 only —
      # these are single (non-per-suffix) artifacts, so signing them once here
      # avoids the cross-matrix .sig name collision the shared-file note above
      # describes. The .deb version is embedded in its filename by build-deb.sh.
      - name: Sign Debian package + installer (cosign keyless)
        if: matrix.suffix == 'linux-amd64'
        run: |
          set -euo pipefail
          for f in \
            "dist/crux-daemon_${GITHUB_REF_NAME#v}_amd64.deb" \
            "dist/install.sh"; do
            test -f "$f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Compute provenance subjects
        id: hashes
        # Subjects for the SLSA generator: the same per-suffix file set that
        # was signed above. base64 -w0 is GNU-only; macOS base64 wraps off
        # by default, so use openssl for portability across the matrix.
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            SHA256="sha256sum"
          else
            SHA256="shasum -a 256"   # macOS runners
          fi
          subjects="$($SHA256 \
            "corecruxd-${{ matrix.suffix }}" \
            "crux-${{ matrix.suffix }}" \
            "corecruxctl-${{ matrix.suffix }}" \
            "crux-hook-${{ matrix.suffix }}" \
            "crux-daemon-${{ matrix.suffix }}.cdx.json" \
            "RELEASE-MANIFEST-${{ matrix.suffix }}.txt" \
            | openssl base64 -A)"
          echo "hashes-${{ matrix.suffix }}=${subjects}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Assert unique release asset basenames
        run: bash scripts/assert-release-asset-basenames.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            dist/content/*
            dist/docs/*
          generate_release_notes: true

  # --- SLSA provenance (ExecPlan crux-supply-chain-attestation-2026-06-11, M4) ---
  # The three native matrix legs export per-suffix base64(sha256sum) subject
  # blocks; this job concatenates them into the single base64-subjects input the
  # generator expects.
  #
  # The linux cross legs (musl / aarch64-gnu) are cosign-signed per-artifact like
  # every other file but are intentionally NOT wired into these SLSA subjects
  # yet: combine-hashes hard-fails if any leg's block is empty, so coupling the
  # newer, build-only cross legs in would let one cross-leg flake break
  # provenance for the whole release. Fold them in once the cross legs prove
  # stable (add job outputs + two more base64 -d lines below).
  combine-hashes:
    name: Combine provenance subjects
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - name: Combine per-target subject lists
        id: combine
        env:
          H_LINUX_AMD64: ${{ needs.build.outputs.hashes-linux-amd64 }}
          H_DARWIN_ARM64: ${{ needs.build.outputs.hashes-darwin-arm64 }}
          H_DARWIN_AMD64: ${{ needs.build.outputs.hashes-darwin-amd64 }}
        run: |
          set -euo pipefail
          for v in H_LINUX_AMD64 H_DARWIN_ARM64 H_DARWIN_AMD64; do
            test -n "${!v}" || { echo "::error::missing subjects from $v leg"; exit 1; }
          done
          combined="$(
            {
              echo "$H_LINUX_AMD64" | base64 -d
              echo "$H_DARWIN_ARM64" | base64 -d
              echo "$H_DARWIN_AMD64" | base64 -d
            } | base64 -w0
          )"
          echo "hashes=${combined}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    # needs release so upload-assets attaches to the already-created release
    # instead of racing softprops/action-gh-release.
    needs: [combine-hashes, release]
    permissions:
      actions: read # read the workflow run to record the builder identity
      id-token: write # sign the provenance (Sigstore keyless)
      contents: write # upload provenance to the release
    # NOTE: referenced by TAG, not commit SHA — the slsa-github-generator
    # explicitly requires tag refs for its reusable workflows (it verifies
    # its own release integrity internally; SHA refs are unsupported).
    # Documented exception to the pinned-SHA rule — see ExecPlan decision log.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.combine-hashes.outputs.hashes }}
      upload-assets: true

  # --- Update manifest (ExecPlan daemon-distribution-packaging-2026-06-11) ---
  # After the release exists, generate update-manifest.json from the already
  # published, cosign-verified RELEASE-MANIFEST files (the script verifies each
  # before trusting its sha256 pins), sign it like every other artifact, and
  # attach all three. This is what `crux self update` and the binary-install
  # check path fetch from releases/latest/download/update-manifest.json.
  update-manifest:
    name: Update manifest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the manifest to the release
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # 2.6.2 is the patched 2.x release for GHSA-whqx-f9j3-ch6m.
          cosign-release: 'v2.6.2'

      - name: Generate + sign update manifest
        run: |
          set -euo pipefail
          bash scripts/generate-update-manifest.sh "${GITHUB_REF_NAME}" > update-manifest.json
          cosign sign-blob --yes \
            --bundle update-manifest.json.sigstore.json \
            --new-bundle-format=true \
            --output-signature update-manifest.json.sig \
            --output-certificate update-manifest.json.pem \
            update-manifest.json
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle update-manifest.json.sigstore.json \
            --certificate-identity "https://github.com/CueCrux/Crux/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            update-manifest.json

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            update-manifest.json
            update-manifest.json.sig
            update-manifest.json.pem
            update-manifest.json.sigstore.json
