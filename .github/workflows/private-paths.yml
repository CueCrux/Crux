name: Private Paths Guard

# Runs on every push and PR, including .md-only changes (the main ci.yml
# skips those, but private-path leaks land most often in docs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-paths:
    name: No private-monorepo refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run guard
        run: bash scripts/check-no-private-paths.sh
