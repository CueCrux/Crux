name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: "Build rustdoc" is a required check, so it must report on the
  # speculative queue ref. The Pages deploy job stays push+main-gated and is
  # correctly skipped for merge_group events. No-op until a queue is enabled.
  merge_group:

permissions:
  contents: read

# Scope the concurrency group per-ref so PRs don't cancel each other's
# rustdoc builds. The deploy job is push-to-main only, so the actual Pages
# slot is only ever contended by one ref at a time (main). On PRs we still
# want cancel-in-progress (a force-push supersedes the earlier run) but it
# must be scoped to that PR's ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: bash scripts/ci-cargo-with-fallback.sh doc --workspace --no-deps

      - name: Prepare Pages artifact
        run: |
          # Generate a root index that links to all workspace crates.
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>CoreCrux Docs</title></head><body>'
            echo '<h1>CoreCrux Documentation</h1><ul>'
            for dir in target/doc/*/; do
              crate=$(basename "$dir")
              # Skip internal rustdoc directories
              [ "$crate" = "src" ] && continue
              [ "$crate" = "static.files" ] && continue
              if [ -f "$dir/index.html" ]; then
                echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
              fi
            done
            echo '</ul></body></html>'
          } > target/doc/index.html

      # Upload the Pages artifact only on push-to-main. On PRs we just want
      # to verify `cargo doc` builds with `-D warnings`; uploading reserves
      # the org-wide GitHub Pages deployment slot and causes the build to be
      # cancelled when another PR is open ("higher priority waiting request
      # for pages exists"), which is the failure mode that blocked PRs #85
      # and #86 in the 2026-05-20 batch.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
