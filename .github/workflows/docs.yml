name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: "Build rustdoc" is a required check, so it must report on the
  # speculative queue ref. The Pages deploy job stays push+main-gated and is
  # correctly skipped for merge_group events. No-op until a queue is enabled.
  merge_group:

permissions:
  contents: read
  pages: write
  id-token: write

# Scope the concurrency group per-ref so PRs don't cancel each other's
# rustdoc builds. The deploy job is push-to-main only, so the actual Pages
# slot is only ever contended by one ref at a time (main). On PRs we still
# want cancel-in-progress (a force-push supersedes the earlier run) but it
# must be scoped to that PR's ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: [self-hosted, ci, Linux]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-${{ github.job }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: bash scripts/ci-cargo-with-fallback.sh doc --workspace --no-deps

      - name: Prepare Pages artifact
        run: |
          # Generate a root index that links to all workspace crates.
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>CoreCrux Docs</title></head><body>'
            echo '<h1>CoreCrux Documentation</h1><ul>'
            for dir in target/doc/*/; do
              crate=$(basename "$dir")
              # Skip internal rustdoc directories
              [ "$crate" = "src" ] && continue
              [ "$crate" = "static.files" ] && continue
              if [ -f "$dir/index.html" ]; then
                echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
              fi
            done
            echo '</ul></body></html>'
          } > target/doc/index.html

      # Upload the Pages artifact only on push-to-main. On PRs we just want
      # to verify `cargo doc` builds with `-D warnings`; uploading reserves
      # the org-wide GitHub Pages deployment slot and causes the build to be
      # cancelled when another PR is open ("higher priority waiting request
      # for pages exists"), which is the failure mode that blocked PRs #85
      # and #86 in the 2026-05-20 batch.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, ci, Linux]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
