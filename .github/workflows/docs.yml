name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Scope the concurrency group per-ref so PRs don't cancel each other's
# rustdoc builds. The deploy job is push-to-main only, so the actual Pages
# slot is only ever contended by one ref at a time (main). On PRs we still
# want cancel-in-progress (a force-push supersedes the earlier run) but it
# must be scoped to that PR's ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Prepare Pages artifact
        run: |
          # Generate a root index that links to all workspace crates.
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>CoreCrux Docs</title></head><body>'
            echo '<h1>CoreCrux Documentation</h1><ul>'
            for dir in target/doc/*/; do
              crate=$(basename "$dir")
              # Skip internal rustdoc directories
              [ "$crate" = "src" ] && continue
              [ "$crate" = "static.files" ] && continue
              if [ -f "$dir/index.html" ]; then
                echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
              fi
            done
            echo '</ul></body></html>'
          } > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, ci]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
