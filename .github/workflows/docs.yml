name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Prepare Pages artifact
        run: |
          # Generate a root index that links to all workspace crates.
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>CoreCrux Docs</title></head><body>'
            echo '<h1>CoreCrux Documentation</h1><ul>'
            for dir in target/doc/*/; do
              crate=$(basename "$dir")
              # Skip internal rustdoc directories
              [ "$crate" = "src" ] && continue
              [ "$crate" = "static.files" ] && continue
              if [ -f "$dir/index.html" ]; then
                echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
              fi
            done
            echo '</ul></body></html>'
          } > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
