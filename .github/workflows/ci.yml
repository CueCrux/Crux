name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Change scope ─────────────────────────────────────────────────────
  # Skip-but-report replacement for the old `paths-ignore` filters. With
  # paths-ignore, a docs-only PR never triggered this workflow, so the
  # REQUIRED checks (Lint / Test / MSRV / Coverage) stayed "expected"
  # forever and the PR was unmergeable without an admin bypass (first hit:
  # PR #167, a one-file .md fragment bump). Now the workflow always runs;
  # this cheap job decides whether anything outside the docs set changed,
  # and the heavy jobs skip when it didn't. GitHub treats skipped required
  # checks as satisfied, so docs-only PRs merge cleanly while code PRs get
  # the full gate.
  changes:
    name: Detect change scope
    runs-on: [self-hosted, ci]
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$(git merge-base "$base" HEAD)"..HEAD)
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before="HEAD~1"
            fi
            files=$(git diff --name-only "$before"..HEAD)
          fi
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # Docs set mirrors the old paths-ignore: *.md anywhere, docs/,
          # .agent/, LICENSE*/LICENCE*. Anything else (or an empty diff,
          # the safe default) counts as code.
          if [ -n "$files" ] && ! echo "$files" | grep -qEv '\.md$|^docs/|^\.agent/|^LICENSE|^LICENCE'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change set — heavy jobs will skip (and report skipped)"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, ci]
    env:
      # Per-job CARGO_HOME isolates the cargo package-cache file lock so the
      # four concurrent jobs on this self-hosted runner don't serialise
      # through one mutex. See run 26575505389 (40m Coverage block, 1h28m
      # Test job stuck, runner cancelled). github.job + github.run_id give
      # a unique cache dir per job per run; the seed step below symlinks
      # the toolchain binaries from the shared CARGO_HOME so cargo/rustc
      # discovery keeps working without copying gigabytes.
      CARGO_HOME: /home/gha-runner/.cargo-${{ github.job }}-${{ github.run_id }}
    steps:
      - name: Seed per-job CARGO_HOME from shared toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          for tool in /home/gha-runner/.cargo/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - name: Preflight (self-hosted runner toolchain)
        run: |
          set +e
          MISSING=""
          if ! command -v cc >/dev/null 2>&1; then MISSING="$MISSING cc"; fi
          if ! sudo -n true 2>/dev/null; then MISSING="$MISSING passwordless-sudo"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tooling:$MISSING"
            echo "::error::Run scripts/provision-self-hosted-runner.sh on the runner host."
            echo "::error::Or add the ci:fallback label on this PR to use ubuntu-latest runners (see docs/self-hosted-runner.md)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: typos
      - run: bash scripts/assert-daemon-release-boundary.sh
      - run: bash scripts/ci-cargo-with-fallback.sh clippy --workspace -- -D warnings

  # ── Test, MSRV, Coverage: self-hosted ────────────────────────────────
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, ci]
    env:
      # See `lint` job above for the per-job CARGO_HOME rationale.
      CARGO_HOME: /home/gha-runner/.cargo-${{ github.job }}-${{ github.run_id }}
    steps:
      - name: Seed per-job CARGO_HOME from shared toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          for tool in /home/gha-runner/.cargo/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - name: Preflight (self-hosted runner toolchain)
        run: |
          set +e
          MISSING=""
          if ! command -v cc >/dev/null 2>&1; then MISSING="$MISSING cc"; fi
          if ! sudo -n true 2>/dev/null; then MISSING="$MISSING passwordless-sudo"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tooling:$MISSING"
            echo "::error::Run scripts/provision-self-hosted-runner.sh on the runner host."
            echo "::error::Or add the ci:fallback label on this PR to use ubuntu-latest runners (see docs/self-hosted-runner.md)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci-cargo-with-fallback.sh build --workspace
      # `cargo test --workspace` (next step) already covers
      # `crux-integrations::community_packs`; the explicit invocation here
      # was duplicating that target's execution. Drop it.
      - run: bash scripts/ci-cargo-with-fallback.sh test --workspace
      # Smoke now runs against the debug binary built by `cargo build
      # --workspace` above. The release build (previously a `cargo build
      # --release` step here) added ~2m45s to the critical path purely to
      # produce an optimised binary for the smoke probe — but the probe
      # only hits /readyz, /healthz, /metrics, /console, /v1/version, and
      # /mcp, none of which care about codegen. If a perf-sensitive smoke
      # gate becomes useful later, move it to its own parallel job.
      - name: Smoke test
        run: |
          set -euo pipefail
          DATA_DIR=/tmp/crux-smoke-${{ github.run_id }}
          CORECRUXD_AUTH_MODE=dev_scopes CORECRUXD_DATA_DIR="$DATA_DIR" ./target/debug/corecruxd &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -rf "$DATA_DIR"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:14800/readyz >/dev/null && curl -sf http://localhost:14801/mcp >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:14800/healthz | jq .
          curl -sf http://localhost:14800/readyz
          # Stage to a variable then read via heredoc — `printf | head` has the
          # same SIGPIPE-race as `curl | head`: head closes the pipe after 5
          # lines, the upstream process exits with SIGPIPE/13 (write error),
          # and `set -o pipefail` propagates. Heredoc input has no pipe.
          METRICS=$(curl -sf http://localhost:14800/metrics)
          head -5 <<<"$METRICS"
          curl -sf http://localhost:14800/v1/version | jq -e '.features.mcp == true' >/dev/null
          curl -sf http://localhost:14800/v1/version | jq -e '.update.state | type == "string"' >/dev/null
          # The console HTML is now ~430 KB. Any `... | grep -q 'X'` pipeline
          # races: grep exits immediately on first match (the title is in the
          # first KB), the producing process gets SIGPIPE on its remaining
          # writes, and `set -euo pipefail` propagates that exit code.
          # Stage to a variable + use bash string matching — no pipe, no race.
          HTML=$(curl -sf http://localhost:14800/console)
          [[ "$HTML" == *"Crux Console"* ]]
          curl -sf http://localhost:14800/v1/console/summary \
            -H 'X-Corecrux-Scopes: admin:read' \
            | jq -e '.console.route == "/console"' >/dev/null
          curl -sf http://localhost:14800/v1/console/integrations \
            -H 'X-Corecrux-Scopes: admin:read' \
            | jq -e '.packs | type == "array"' >/dev/null
          curl -sf http://localhost:14801/mcp | jq -e '.serverInfo.name == "crux"' >/dev/null
          # Sanity-check the MCP catalog responds with a non-empty tool list.
          # Exact count is pinned by crux_mcp::tools::tests::TOOL_COUNT and the
          # crux-integration-tests::mcp_tools_list lower-bound; the smoke test
          # just confirms the surface is reachable. Echo the count so changes
          # in catalog size are visible in CI logs without breaking the build.
          TOOL_COUNT=$(curl -sf -X POST http://localhost:14801/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq -r '.result.tools | length')
          echo "MCP tools/list returned: $TOOL_COUNT tools"
          [ "$TOOL_COUNT" -gt 0 ]

  msrv:
    name: MSRV (1.88.0)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, ci]
    env:
      # See `lint` job above for the per-job CARGO_HOME rationale.
      CARGO_HOME: /home/gha-runner/.cargo-${{ github.job }}-${{ github.run_id }}
    steps:
      - name: Seed per-job CARGO_HOME from shared toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          for tool in /home/gha-runner/.cargo/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - name: Preflight (self-hosted runner toolchain)
        run: |
          set +e
          MISSING=""
          if ! command -v cc >/dev/null 2>&1; then MISSING="$MISSING cc"; fi
          if ! sudo -n true 2>/dev/null; then MISSING="$MISSING passwordless-sudo"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tooling:$MISSING"
            echo "::error::Run scripts/provision-self-hosted-runner.sh on the runner host (or add ci:fallback label)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci-cargo-with-fallback.sh build --workspace

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, ci]
    env:
      # See `lint` job above for the per-job CARGO_HOME rationale.
      CARGO_HOME: /home/gha-runner/.cargo-${{ github.job }}-${{ github.run_id }}
      COVERAGE_IGNORE_REGEX: '(.*/corecruxd/src/pool\.rs|.*/corecruxd/src/dataplane_store\.rs|.*/corecruxd/src/main\.rs|.*/corecruxd/src/http/admin\.rs|.*/corecruxd/src/http/append\.rs|.*/corecruxd/src/http/query\.rs|.*/corecruxd/src/http/projections\.rs|.*/corecruxd/src/http/receipts\.rs|.*/corecruxctl/src/main\.rs|.*/corecruxctl/src/audit_pack\.rs)$'
    steps:
      - name: Seed per-job CARGO_HOME from shared toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          for tool in /home/gha-runner/.cargo/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - name: Preflight (self-hosted runner toolchain)
        run: |
          set +e
          MISSING=""
          if ! command -v cc >/dev/null 2>&1; then MISSING="$MISSING cc"; fi
          if ! sudo -n true 2>/dev/null; then MISSING="$MISSING passwordless-sudo"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tooling:$MISSING"
            echo "::error::Run scripts/provision-self-hosted-runner.sh on the runner host (or add ci:fallback label)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci-cargo-with-fallback.sh build --bin corecruxd
      - name: Generate coverage reports
        run: |
          set -euo pipefail
          bash scripts/ci-cargo-with-fallback.sh llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only | tee coverage-summary.txt
      - name: Enforce coverage thresholds
        run: |
          SUMMARY=$(cat coverage-summary.txt)
          TOTAL=$(echo "$SUMMARY" | grep "^TOTAL" | awk '{print $4}' | tr -d '%')
          echo "::notice::Total workspace coverage: ${TOTAL}%"

          FAILED=0

          if (( $(echo "$TOTAL < 84" | bc -l) )); then
            echo "::error::Workspace coverage ${TOTAL}% is below 84% floor"
            FAILED=1
          fi

          for crate in corecrux-memory crux-sync crux-contrib; do
            COV=$(echo "$SUMMARY" | grep "^${crate}/" | awk '{sum+=$1; missed+=$2} END {if(sum>0) printf "%.1f", (1-missed/sum)*100; else print "100.0"}')
            echo "${crate}: ${COV}%"
            if (( $(echo "$COV < 95" | bc -l) )); then
              echo "::error::${crate} coverage ${COV}% is below 95% floor"
              FAILED=1
            fi
          done

          for file in corecruxd/src/config.rs corecruxd/src/control.rs corecruxd/src/structured_log.rs corecruxd/src/problem.rs; do
            COV=$(echo "$SUMMARY" | grep "^${file}" | awk '{print $4}' | tr -d '%')
            echo "${file}: ${COV}%"
            if [ -n "$COV" ] && (( $(echo "$COV < 90" | bc -l) )); then
              echo "::error::${file} coverage ${COV}% is below 90% floor"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All coverage thresholds met."
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
