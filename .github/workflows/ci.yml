name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /home/gha-runner/.cargo
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: self-hosted
            runner: [self-hosted, ci]
            needs_setup: false
          - name: github
            runner: ubuntu-latest
            needs_setup: true
    steps:
      - uses: actions/checkout@v6
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        if: matrix.needs_setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        if: matrix.needs_setup
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install typos
        if: matrix.needs_setup
        run: cargo install typos-cli

      - name: Check formatting
        run: cargo fmt --check

      - name: Check for typos
        run: typos

      - name: Clippy (workspace lint config)
        run: cargo clippy --workspace

  test:
    name: Test
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v6
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build (includes daemon for integration tests)
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Smoke test
        run: |
          CORECRUXD_DATA_DIR=/tmp/crux-smoke-${{ github.run_id }} ./target/release/corecruxd &
          PID=$!
          sleep 3
          curl -sf http://localhost:14800/healthz | jq .
          curl -sf http://localhost:14800/readyz
          curl -sf http://localhost:14800/metrics | head -5
          kill $PID
          rm -rf /tmp/crux-smoke-${{ github.run_id }}

  msrv:
    name: MSRV (1.88.0)
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v6
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build with MSRV
        run: cargo +1.88.0 build --workspace

  coverage:
    name: Coverage
    runs-on: [self-hosted, ci]
    env:
      COVERAGE_IGNORE_REGEX: '(.*/corecruxd/src/pool\.rs|.*/corecruxd/src/dataplane_store\.rs)$'
    steps:
      - uses: actions/checkout@v6
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build daemon for integration tests
        run: cargo build --bin corecruxd

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only

      - name: Enforce coverage thresholds
        run: |
          SUMMARY=$(cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only 2>&1)
          TOTAL=$(echo "$SUMMARY" | grep "^TOTAL" | awk '{print $4}' | tr -d '%')
          echo "::notice::Total workspace coverage: ${TOTAL}%"

          FAILED=0

          # Workspace floor: 81% (ratchets up as tests are added)
          if (( $(echo "$TOTAL < 81" | bc -l) )); then
            echo "::error::Workspace coverage ${TOTAL}% is below 81% floor"
            FAILED=1
          fi

          # New crate floor: 95%
          for crate in corecrux-memory crux-sync crux-contrib; do
            COV=$(echo "$SUMMARY" | grep "^${crate}/" | awk '{sum+=$1; missed+=$2} END {if(sum>0) printf "%.1f", (1-missed/sum)*100; else print "100.0"}')
            echo "${crate}: ${COV}%"
            if (( $(echo "$COV < 95" | bc -l) )); then
              echo "::error::${crate} coverage ${COV}% is below 95% floor"
              FAILED=1
            fi
          done

          # Phase 1 code floor: 90%
          for file in corecruxd/src/config.rs corecruxd/src/control.rs corecruxd/src/structured_log.rs corecruxd/src/problem.rs; do
            COV=$(echo "$SUMMARY" | grep "^${file}" | awk '{print $4}' | tr -d '%')
            echo "${file}: ${COV}%"
            if [ -n "$COV" ] && (( $(echo "$COV < 90" | bc -l) )); then
              echo "::error::${file} coverage ${COV}% is below 90% floor"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All coverage thresholds met."

      - name: Upload coverage to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
