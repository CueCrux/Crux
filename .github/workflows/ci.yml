name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: typos
      - run: cargo clippy --workspace -- -D warnings

  # ── Test, MSRV, Coverage: self-hosted ────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Smoke test
        run: |
          set -euo pipefail
          DATA_DIR=/tmp/crux-smoke-${{ github.run_id }}
          CORECRUXD_AUTH_MODE=dev_scopes CORECRUXD_DATA_DIR="$DATA_DIR" ./target/release/corecruxd &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -rf "$DATA_DIR"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:14800/readyz >/dev/null && curl -sf http://localhost:14801/mcp >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:14800/healthz | jq .
          curl -sf http://localhost:14800/readyz
          curl -sf http://localhost:14800/metrics | head -5
          curl -sf http://localhost:14800/v1/version | jq -e '.features.mcp == true' >/dev/null
          curl -sf http://localhost:14800/v1/version | jq -e '.update.state | type == "string"' >/dev/null
          curl -sf http://localhost:14801/mcp | jq -e '.serverInfo.name == "crux"' >/dev/null
          curl -sf -X POST http://localhost:14801/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq -e '.result.tools | length == 28' >/dev/null

  msrv:
    name: MSRV (1.88.0)
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: cargo build --workspace

  coverage:
    name: Coverage
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
      COVERAGE_IGNORE_REGEX: '(.*/corecruxd/src/pool\.rs|.*/corecruxd/src/dataplane_store\.rs|.*/corecruxd/src/http/append\.rs|.*/corecruxd/src/http/query\.rs|.*/corecruxd/src/http/projections\.rs|.*/corecruxd/src/http/receipts\.rs)$'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: cargo build --bin corecruxd
      - run: cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --lcov --output-path lcov.info
      - run: cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only
      - name: Enforce coverage thresholds
        run: |
          SUMMARY=$(cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --summary-only 2>&1)
          TOTAL=$(echo "$SUMMARY" | grep "^TOTAL" | awk '{print $4}' | tr -d '%')
          echo "::notice::Total workspace coverage: ${TOTAL}%"

          FAILED=0

          if (( $(echo "$TOTAL < 81" | bc -l) )); then
            echo "::error::Workspace coverage ${TOTAL}% is below 81% floor"
            FAILED=1
          fi

          for crate in corecrux-memory crux-sync crux-contrib; do
            COV=$(echo "$SUMMARY" | grep "^${crate}/" | awk '{sum+=$1; missed+=$2} END {if(sum>0) printf "%.1f", (1-missed/sum)*100; else print "100.0"}')
            echo "${crate}: ${COV}%"
            if (( $(echo "$COV < 95" | bc -l) )); then
              echo "::error::${crate} coverage ${COV}% is below 95% floor"
              FAILED=1
            fi
          done

          for file in corecruxd/src/config.rs corecruxd/src/control.rs corecruxd/src/structured_log.rs corecruxd/src/problem.rs; do
            COV=$(echo "$SUMMARY" | grep "^${file}" | awk '{print $4}' | tr -d '%')
            echo "${file}: ${COV}%"
            if [ -n "$COV" ] && (( $(echo "$COV < 90" | bc -l) )); then
              echo "::error::${file} coverage ${COV}% is below 90% floor"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All coverage thresholds met."
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
