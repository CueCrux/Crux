name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuecrux/crux-daemon

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag policy:
          #   - Releases (git tag v*) publish semver tags (`X.Y.Z`, `X.Y`) and
          #     `latest`. `latest` therefore means "last released version".
          #   - Merges to main publish `edge` (main-tip), NOT `latest`, so
          #     deployers can opt into bleeding-edge without disturbing `latest`.
          # `enable={{is_default_branch}}` is true for both default-branch
          # pushes and tag builds whose ref is on the default branch; the
          # semver/raw `type` filters keep each tag scoped to the right event.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the build sha into corecruxd --version / the boot banner
          # (the build context has no .git, so build.rs can't derive it).
          build-args: |
            GIT_SHA=${{ github.sha }}
