name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  # PRs that touch the image or this workflow get a build+scan (never a
  # push) so the Trivy gate is exercised before merge, not after.
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "scripts/check-docker-tag-policy.py"
  # Floating aliases move only after the complete Release workflow succeeds.
  # The promotion job never checks out or executes code from the release ref.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      skip_trivy_gate:
        description: >-
          Skip the Trivy CRITICAL gate (use only during a Trivy DB/registry
          outage; the skip is logged in the run, never silent).
        type: boolean
        default: false
      trivy_waiver_owner:
        description: "Required when skip_trivy_gate=true; team or passport owning the waiver."
        type: string
        required: false
      trivy_waiver_expires:
        description: "Required when skip_trivy_gate=true; waiver expiry as YYYY-MM-DD."
        type: string
        required: false
      trivy_waiver_reason:
        description: "Required when skip_trivy_gate=true; short outage or risk rationale."
        type: string
        required: false

permissions:
  contents: read
  packages: write
  # Trivy SARIF upload to the Security tab (code-scanning API).
  security-events: write
  # cosign keyless signing/attestation of the pushed image (OIDC token).
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuecrux/crux-daemon

jobs:
  build-and-push:
    name: Build and Push Docker Image
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify immutable release tag policy
        run: python3 scripts/check-docker-tag-policy.py

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # metadata-action otherwise adds `latest` automatically for a semver
          # tag, bypassing the acceptance-gated promotion job below.
          flavor: |
            latest=false
          # Tag policy:
          #   - Release tag builds publish only the immutable `X.Y.Z` tag.
          #     The promotion job below moves `X.Y` and `latest` only after the
          #     complete Release workflow and its acceptance assets succeed.
          #   - Merges to main publish `edge` (main-tip), NOT `latest`, so
          #     deployers can opt into bleeding-edge without disturbing `latest`.
          # `enable={{is_default_branch}}` is true for both default-branch
          # pushes and tag builds whose ref is on the default branch; the
          # semver/raw `type` filters keep each tag scoped to the right event.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # --- Supply-chain scan gate (ExecPlan crux-supply-chain-attestation-2026-06-11, M2) ---
      # Build locally first (no push), scan with Trivy, and only push if the
      # image carries no CRITICAL vulnerabilities. The runner's Docker layer
      # cache makes the subsequent push build a no-op rebuild.
      # New third-party actions below are pinned to commit SHAs (floating
      # tags are themselves a T.5 supply-chain vector).
      - name: Build image for scan (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: local/crux-daemon:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Trivy scan (SARIF report, CRITICAL+HIGH)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/crux-daemon:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        # github/codeql-action v4.37.6
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy gate (fail on CRITICAL)
        if: ${{ inputs.skip_trivy_gate != true }}
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/crux-daemon:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
          # Gate only on vulnerabilities that have an available fix. Distro base
          # images (Debian bookworm-slim → git → perl) ship unfixable CRITICALs
          # (e.g. CVE-2026-8376, CVE-2026-42496 fix_deferred/affected with no
          # fixed version), which would pin the gate permanently red without any
          # action available to us. The SARIF report above stays comprehensive
          # (all CRITICAL+HIGH, fixed or not) so the Security tab still tracks
          # them; the merge gate fails only on actionable fixes we are skipping.
          ignore-unfixed: true
          # Trivy was already installed (and its vuln DB cached) by the
          # SARIF step above — don't reinstall.
          skip-setup-trivy: true

      - name: Validate Trivy gate waiver
        if: ${{ inputs.skip_trivy_gate == true }}
        env:
          WAIVER_OWNER: ${{ inputs.trivy_waiver_owner }}
          WAIVER_EXPIRES: ${{ inputs.trivy_waiver_expires }}
          WAIVER_REASON: ${{ inputs.trivy_waiver_reason }}
        run: |
          set -euo pipefail
          if [ -z "$WAIVER_OWNER" ] || [ -z "$WAIVER_EXPIRES" ] || [ -z "$WAIVER_REASON" ]; then
            echo "::error::skip_trivy_gate=true requires trivy_waiver_owner, trivy_waiver_expires, and trivy_waiver_reason"
            exit 1
          fi
          if ! expiry_epoch=$(date -u -d "$WAIVER_EXPIRES" +%s 2>/dev/null); then
            echo "::error::trivy_waiver_expires must be a valid YYYY-MM-DD date"
            exit 1
          fi
          today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)
          if [ "$expiry_epoch" -lt "$today_epoch" ]; then
            echo "::error::trivy_waiver_expires must not be in the past"
            exit 1
          fi
          jq -n \
            --arg owner "$WAIVER_OWNER" \
            --arg expires "$WAIVER_EXPIRES" \
            --arg reason "$WAIVER_REASON" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg image "local/crux-daemon:scan" \
            '{
              schema: "cuecrux.trivy_waiver.v1",
              owner: $owner,
              expires: $expires,
              reason: $reason,
              run_id: $run_id,
              commit_sha: $sha,
              image_ref: $image,
              gate: "trivy-critical"
            }' > trivy-waiver.json

      - name: Log Trivy gate skip
        if: ${{ inputs.skip_trivy_gate == true }}
        run: echo "::warning::Trivy CRITICAL gate SKIPPED via workflow_dispatch input; structured waiver artifact recorded."

      - name: Upload Trivy waiver
        if: ${{ inputs.skip_trivy_gate == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-waiver-${{ github.run_id }}
          path: trivy-waiver.json
          if-no-files-found: error
          retention-days: 90

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the build sha into corecruxd --version / the boot banner
          # (the build context has no .git, so build.rs can't derive it).
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # --- Image SBOM + keyless sign/attest (ExecPlan crux-supply-chain-attestation-2026-06-11, M3) ---
      # syft generates the SBOM from the image as pushed (digest-addressed),
      # so the published SBOM matches what actually ships; cosign signs the
      # image and attaches the SBOM as a CycloneDX attestation.
      - name: Generate image SBOM (syft)
        if: github.event_name != 'pull_request'
        # anchore/sbom-action v0.24.0 (pinned SHA)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: crux-daemon-image.cdx.json
          # Also attach the SBOM to the workflow run as an artifact.
          artifact-name: crux-daemon-image.cdx.json

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # sigstore/cosign-installer v4.1.2 (pinned SHA)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image + attest SBOM (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"
          cosign attest --yes \
            --type cyclonedx \
            --predicate crux-daemon-image.cdx.json \
            "$IMAGE_DIGEST_REF"

  # `vX.Y` and `latest` are release acceptance aliases, not build aliases.
  # workflow_run carries a privileged token, so this job treats its payload as
  # untrusted metadata: it never checks out the release ref, requires an exact
  # stable-semver tag, binds the tag and image to the completed run SHA, and
  # verifies the signed immutable image before promoting its digest.
  promote-release-aliases:
    name: Promote accepted release aliases
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/release.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-alias-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      IMAGE_REPO: ghcr.io/cuecrux/crux-daemon
    steps:
      - name: Validate completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vX.Y.Z releases may move floating aliases: $RELEASE_TAG"
            exit 1
          fi

          tag_sha="$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag resolves to $tag_sha, expected completed run SHA $RELEASE_SHA"
            exit 1
          fi

          release="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and (.draft == false) and (.prerelease == false)' \
            <<<"$release" >/dev/null || {
              echo "::error::$RELEASE_TAG is not an accepted stable release"
              exit 1
            }

          for asset in multiple.intoto.jsonl update-manifest.json; do
            jq -e --arg asset "$asset" \
              'any(.assets[]; .name == $asset)' <<<"$release" >/dev/null || {
                echo "::error::Accepted release is missing required asset: $asset"
                exit 1
              }
          done

          accepted_tags="$(gh api --paginate \
            "repos/$REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "multiple.intoto.jsonl")) | select(any(.assets[]; .name == "update-manifest.json")) | .tag_name')"
          highest_accepted="$(
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                printf '%s\n' "$tag"
              fi
            done <<<"$accepted_tags" | sort -V | tail -n 1
          )"
          if [ "$highest_accepted" != "$RELEASE_TAG" ]; then
            echo "::error::$RELEASE_TAG is not the highest accepted stable release ($highest_accepted)"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify immutable image and promote exact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          image_tag="$IMAGE_REPO:$version"
          digest="$(docker buildx imagetools inspect "$image_tag" \
            --format '{{json .Manifest.Digest}}' | jq -er '.')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Immutable image returned an invalid digest: $digest"
            exit 1
          fi

          digest_ref="$IMAGE_REPO@$digest"
          revision="$(docker buildx imagetools inspect "$digest_ref" \
            --format '{{json .Image.Config.Labels}}' \
            | jq -er '."org.opencontainers.image.revision"')"
          if [ "$revision" != "$RELEASE_SHA" ]; then
            echo "::error::Image revision $revision does not match release SHA $RELEASE_SHA"
            exit 1
          fi

          identity="https://github.com/$REPOSITORY/.github/workflows/docker.yml@refs/tags/$RELEASE_TAG"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$digest_ref" >/dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$digest_ref" >/dev/null

          # Re-evaluate accepted-release monotonicity immediately before the
          # registry mutation. The job-level concurrency group serializes all
          # promoters; this second check also catches a newer Release workflow
          # completing while signature verification was in progress.
          accepted_tags="$(gh api --paginate \
            "repos/$REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "multiple.intoto.jsonl")) | select(any(.assets[]; .name == "update-manifest.json")) | .tag_name')"
          highest_accepted="$(
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                printf '%s\n' "$tag"
              fi
            done <<<"$accepted_tags" | sort -V | tail -n 1
          )"
          if [ "$highest_accepted" != "$RELEASE_TAG" ]; then
            echo "::error::Refusing stale promotion: highest accepted release is $highest_accepted"
            exit 1
          fi

          # GitHub release metadata is not the only monotonic anchor. `latest`
          # exists for this established package and is the global registry
          # watermark. Any inspection/auth/network error is fatal; treating it
          # as an absent alias would turn an outage into a downgrade bypass.
          if ! current_labels="$(docker buildx imagetools inspect \
            "$IMAGE_REPO:latest" \
            --format '{{json .Image.Config.Labels}}')"; then
            echo "::error::Cannot inspect the existing latest alias; refusing promotion"
            exit 1
          fi
          if ! current_version="$(jq -er '."org.opencontainers.image.version"' \
            <<<"$current_labels")"; then
            echo "::error::Existing latest alias has no verifiable OCI version label"
            exit 1
          fi
          current_version="${current_version#v}"
          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Existing latest alias has invalid stable version: $current_version"
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
          if [ "$newest" != "$version" ]; then
            echo "::error::Refusing to downgrade latest from $current_version to $version"
            exit 1
          fi

          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_REPO:$minor" \
            --tag "$IMAGE_REPO:latest" \
            "$digest_ref"

          for alias in "$minor" latest; do
            alias_digest="$(docker buildx imagetools inspect "$IMAGE_REPO:$alias" \
              --format '{{json .Manifest.Digest}}' | jq -er '.')"
            if [ "$alias_digest" != "$digest" ]; then
              echo "::error::$alias resolved to $alias_digest after promotion, expected $digest"
              exit 1
            fi
          done
