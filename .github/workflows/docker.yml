name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  # PRs that touch the image or this workflow get a build+scan (never a
  # push) so the Trivy gate is exercised before merge, not after.
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      skip_trivy_gate:
        description: >-
          Skip the Trivy CRITICAL gate (use only during a Trivy DB/registry
          outage; the skip is logged in the run, never silent).
        type: boolean
        default: false
      trivy_waiver_owner:
        description: "Required when skip_trivy_gate=true; team or passport owning the waiver."
        type: string
        required: false
      trivy_waiver_expires:
        description: "Required when skip_trivy_gate=true; waiver expiry as YYYY-MM-DD."
        type: string
        required: false
      trivy_waiver_reason:
        description: "Required when skip_trivy_gate=true; short outage or risk rationale."
        type: string
        required: false

permissions:
  contents: read
  packages: write
  # Trivy SARIF upload to the Security tab (code-scanning API).
  security-events: write
  # cosign keyless signing/attestation of the pushed image (OIDC token).
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuecrux/crux-daemon

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag policy:
          #   - Releases (git tag v*) publish semver tags (`X.Y.Z`, `X.Y`) and
          #     `latest`. `latest` therefore means "last released version".
          #   - Merges to main publish `edge` (main-tip), NOT `latest`, so
          #     deployers can opt into bleeding-edge without disturbing `latest`.
          # `enable={{is_default_branch}}` is true for both default-branch
          # pushes and tag builds whose ref is on the default branch; the
          # semver/raw `type` filters keep each tag scoped to the right event.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # --- Supply-chain scan gate (ExecPlan crux-supply-chain-attestation-2026-06-11, M2) ---
      # Build locally first (no push), scan with Trivy, and only push if the
      # image carries no CRITICAL vulnerabilities. The runner's Docker layer
      # cache makes the subsequent push build a no-op rebuild.
      # New third-party actions below are pinned to commit SHAs (floating
      # tags are themselves a T.5 supply-chain vector).
      - name: Build image for scan (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local/crux-daemon:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Trivy scan (SARIF report, CRITICAL+HIGH)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/crux-daemon:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        # github/codeql-action v4.36.2
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy gate (fail on CRITICAL)
        if: ${{ inputs.skip_trivy_gate != true }}
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/crux-daemon:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
          # Gate only on vulnerabilities that have an available fix. Distro base
          # images (Debian bookworm-slim → git → perl) ship unfixable CRITICALs
          # (e.g. CVE-2026-8376, CVE-2026-42496 fix_deferred/affected with no
          # fixed version), which would pin the gate permanently red without any
          # action available to us. The SARIF report above stays comprehensive
          # (all CRITICAL+HIGH, fixed or not) so the Security tab still tracks
          # them; the merge gate fails only on actionable fixes we are skipping.
          ignore-unfixed: true
          # Trivy was already installed (and its vuln DB cached) by the
          # SARIF step above — don't reinstall.
          skip-setup-trivy: true

      - name: Validate Trivy gate waiver
        if: ${{ inputs.skip_trivy_gate == true }}
        env:
          WAIVER_OWNER: ${{ inputs.trivy_waiver_owner }}
          WAIVER_EXPIRES: ${{ inputs.trivy_waiver_expires }}
          WAIVER_REASON: ${{ inputs.trivy_waiver_reason }}
        run: |
          set -euo pipefail
          if [ -z "$WAIVER_OWNER" ] || [ -z "$WAIVER_EXPIRES" ] || [ -z "$WAIVER_REASON" ]; then
            echo "::error::skip_trivy_gate=true requires trivy_waiver_owner, trivy_waiver_expires, and trivy_waiver_reason"
            exit 1
          fi
          if ! expiry_epoch=$(date -u -d "$WAIVER_EXPIRES" +%s 2>/dev/null); then
            echo "::error::trivy_waiver_expires must be a valid YYYY-MM-DD date"
            exit 1
          fi
          today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)
          if [ "$expiry_epoch" -lt "$today_epoch" ]; then
            echo "::error::trivy_waiver_expires must not be in the past"
            exit 1
          fi
          jq -n \
            --arg owner "$WAIVER_OWNER" \
            --arg expires "$WAIVER_EXPIRES" \
            --arg reason "$WAIVER_REASON" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg image "local/crux-daemon:scan" \
            '{
              schema: "cuecrux.trivy_waiver.v1",
              owner: $owner,
              expires: $expires,
              reason: $reason,
              run_id: $run_id,
              commit_sha: $sha,
              image_ref: $image,
              gate: "trivy-critical"
            }' > trivy-waiver.json

      - name: Log Trivy gate skip
        if: ${{ inputs.skip_trivy_gate == true }}
        run: echo "::warning::Trivy CRITICAL gate SKIPPED via workflow_dispatch input; structured waiver artifact recorded."

      - name: Upload Trivy waiver
        if: ${{ inputs.skip_trivy_gate == true }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-waiver-${{ github.run_id }}
          path: trivy-waiver.json
          if-no-files-found: error
          retention-days: 90

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the build sha into corecruxd --version / the boot banner
          # (the build context has no .git, so build.rs can't derive it).
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # --- Image SBOM + keyless sign/attest (ExecPlan crux-supply-chain-attestation-2026-06-11, M3) ---
      # syft generates the SBOM from the image as pushed (digest-addressed),
      # so the published SBOM matches what actually ships; cosign signs the
      # image and attaches the SBOM as a CycloneDX attestation.
      - name: Generate image SBOM (syft)
        if: github.event_name != 'pull_request'
        # anchore/sbom-action v0.24.0 (pinned SHA)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: crux-daemon-image.cdx.json
          # Also attach the SBOM to the workflow run as an artifact.
          artifact-name: crux-daemon-image.cdx.json

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # sigstore/cosign-installer v4.1.2 (pinned SHA)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image + attest SBOM (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"
          cosign attest --yes \
            --type cyclonedx \
            --predicate crux-daemon-image.cdx.json \
            "$IMAGE_DIGEST_REF"
