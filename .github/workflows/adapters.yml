name: Framework adapters

on:
  pull_request:
    paths:
      - 'integrations/adapters/**'
      - 'sdks/python/**'
      - '.github/workflows/adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Adapter conformance (mapping layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/adapters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The mapping layer covers reshaping and needs no daemon, so it runs on
      # every PR. The live layer needs a built corecruxd and runs locally via
      # `python -m conformance` -- see the README.
      - name: Install the SDK dependency and every adapter framework
        run: python -m pip install 'httpx>=0.27' 'langchain-core>=0.3'

      - name: Conformance suite + negative controls
        run: python -m unittest discover -s tests -v

      - name: Every discovered adapter, mapping layer
        run: python -m conformance --mapping

      - name: Suite still runs with no frameworks installed
        # The neutral core adapter must always be exercised, otherwise a
        # machine without LangChain would silently check nothing.
        run: |
          python -m pip uninstall -y langchain-core
          python -m conformance --mapping

      - name: Package builds
        run: |
          python -m pip install 'build==1.5.0' 'hatchling==1.31.0'
          python -m build --no-isolation --outdir dist
