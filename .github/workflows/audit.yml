name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: "Cargo deny policy", "Cargo audit", and "Licence check" are
  # required checks, so they must report on the speculative queue ref or the
  # queue hangs. No-op until a queue is enabled on `main`.
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  advisories:
    name: Cargo deny policy
    runs-on: [self-hosted, ci, Linux]
    env:
      CARGO_DENY_VERSION: 0.19.4
    steps:
      - uses: actions/checkout@v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-${{ github.job }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          (
            flock 9
            if ! "$CARGO_HOME/bin/cargo-deny" --version | grep -q "cargo-deny $CARGO_DENY_VERSION"; then
              cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
            fi
          ) 9>/tmp/cargo-deny-install.lock
          "$CARGO_HOME/bin/cargo-deny" --version
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check advisory ignore metadata
        run: bash scripts/check-deny-advisory-ignores.sh

      - name: Check advisories, yanked dependencies, and cargo-deny policy
        run: cargo deny check

  cargo-audit:
    name: Cargo audit
    runs-on: [self-hosted, ci, Linux]
    env:
      CARGO_AUDIT_VERSION: 0.22.1
    steps:
      - uses: actions/checkout@v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-${{ github.job }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo-audit
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          (
            flock 9
            if ! "$CARGO_HOME/bin/cargo-audit" --version | grep -q "$CARGO_AUDIT_VERSION"; then
              cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
            fi
          ) 9>/tmp/cargo-audit-install.lock
          "$CARGO_HOME/bin/cargo-audit" --version
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check RustSec advisories
        run: cargo audit

  licenses:
    name: Licence check
    runs-on: [self-hosted, ci, Linux]
    env:
      CARGO_DENY_VERSION: 0.19.4
    steps:
      - uses: actions/checkout@v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # $RUNNER_TEMP is writable on EVERY runner pool, unlike the
          # /home/gha-runner path this used to hardcode — which is what made
          # these jobs a scheduling coin flip (pass on hel1, die in 13s on
          # vukgpu02 with "mkdir: cannot create directory ... Permission denied").
          #
          # Set HERE and not in the job-level `env:` because the `runner` context
          # is not available there; only `github`/`needs`/`matrix` etc. are.
          # Using it at job level makes the whole workflow file invalid.
          #
          # The symlink loop is the FAST PATH, not a requirement: where a shared
          # toolchain exists it is linked in and the toolchain action becomes a
          # no-op; where it does not, the glob stays literal, `-e` fails, and the
          # action installs into this writable home. Same workflow, both pools.
          CARGO_HOME="${RUNNER_TEMP}/cargo-${{ github.job }}-${{ github.run_id }}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          (
            flock 9
            if ! "$CARGO_HOME/bin/cargo-deny" --version | grep -q "cargo-deny $CARGO_DENY_VERSION"; then
              cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
            fi
          ) 9>/tmp/cargo-deny-install.lock
          "$CARGO_HOME/bin/cargo-deny" --version
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check licenses
        run: cargo deny check licenses
