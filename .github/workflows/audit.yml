name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  advisories:
    name: Advisory audit
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v6

      - name: Check advisories
        run: cargo deny check advisories

  licenses:
    name: Licence check
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v6

      - name: Check licenses
        run: cargo deny check licenses
