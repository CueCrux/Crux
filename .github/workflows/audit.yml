name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  advisories:
    name: Advisory audit
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
      CARGO_DENY_VERSION: 0.19.4
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          (
            flock 9
            if ! "$CARGO_HOME/bin/cargo-deny" --version | grep -q "cargo-deny $CARGO_DENY_VERSION"; then
              cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
            fi
          ) 9>/tmp/cargo-deny-install.lock
          "$CARGO_HOME/bin/cargo-deny" --version
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check advisories
        run: cargo deny check advisories

  licenses:
    name: Licence check
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
      CARGO_DENY_VERSION: 0.19.4
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          (
            flock 9
            if ! "$CARGO_HOME/bin/cargo-deny" --version | grep -q "cargo-deny $CARGO_DENY_VERSION"; then
              cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
            fi
          ) 9>/tmp/cargo-deny-install.lock
          "$CARGO_HOME/bin/cargo-deny" --version
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check licenses
        run: cargo deny check licenses
