name: Semver Check
on:
  pull_request:
    branches: [main]
  # Merge queue: "Semver Compatibility" is a required check, so it must report
  # on the speculative queue ref or the queue hangs. No-op until a queue is
  # enabled on `main`.
  merge_group:

jobs:
  semver:
    name: Semver Compatibility
    runs-on: [self-hosted, ci, Linux]
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo-${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve CARGO_HOME (shared toolchain when the runner has one)
        run: |
          # CARGO_HOME lives under RUNNER_TEMP so it is writable on EVERY runner
          # pool, not just the one whose host happens to have /home/gha-runner.
          # Hardcoding that path is what made 17 jobs a scheduling coin flip:
          # they passed on hel1 and died in 13s on vukgpu02 with
          # "mkdir: cannot create directory '/home/gha-runner': Permission denied".
          #
          # The symlink loop is the FAST PATH, not a requirement. Where a shared
          # toolchain exists it is linked in so rustup/cargo are already present
          # and the toolchain action becomes a no-op; where it does not, the glob
          # stays literal, `-e` fails, and the action installs into this writable
          # home instead. Same workflow, both pools.
          mkdir -p "$CARGO_HOME/bin"
          for tool in "${CRUX_SHARED_CARGO_HOME:-/home/gha-runner/.cargo}"/bin/*; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$CARGO_HOME/bin/$(basename "$tool")"
          done
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-semver-checks
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Check semver (advisory)
        # ADVISORY, deliberately: "Semver Compatibility" is a required check on
        # main, so a hard failure here would wedge every PR. But the previous
        # form (`|| echo` AND continue-on-error) could never fail NOR surface
        # what broke — a structurally always-green required check. Now:
        # violations land in the job summary + a warning annotation; the job
        # still passes. Promote to enforcing (fail in the else-branch) after a
        # clean run history — see ExecPlan
        # crux-mutation-testing-first-class-2026-07-19 (M5).
        run: |
          set -uo pipefail
          if cargo semver-checks check-release --workspace 2>&1 | tee semver.log; then
            echo "## Semver: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ Semver violations (advisory — job stays green)"
              echo '```'
              tail -100 semver.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cargo-semver-checks found violations — see the job summary. Advisory pending promotion to enforcing."
          fi
