name: Semver Check
on:
  pull_request:
    branches: [main]
  # Merge queue: "Semver Compatibility" is a required check, so it must report
  # on the speculative queue ref or the queue hangs. No-op until a queue is
  # enabled on `main`.
  merge_group:

jobs:
  semver:
    name: Semver Compatibility
    runs-on: [self-hosted, ci]
    env:
      CARGO_HOME: /home/gha-runner/.cargo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Check semver
        run: cargo semver-checks check-release --workspace || echo "::warning::Semver check failed (expected for first release or missing baseline)"
        continue-on-error: true
