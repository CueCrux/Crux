name: Semver Check
on:
  pull_request:
    branches: [main]

jobs:
  semver:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks@0.44.0 --locked
      - name: Check semver
        run: cargo semver-checks check-release --workspace || echo "::warning::Semver check failed (expected for first release or missing baseline)"
        continue-on-error: true
