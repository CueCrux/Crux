#
# Fallback CI workflow — runs the same gates as ci.yml on GitHub-hosted
# `ubuntu-latest` runners instead of the `[self-hosted, ci]` pool. Triggered
# explicitly by labelling a PR `ci:fallback`. See `docs/self-hosted-runner.md`.
#
# Why this exists: when the self-hosted runner breaks (missing cc, broken
# sudo), operators have shipped enough urgent PRs through admin-merge that
# they need a sanctioned override. This workflow is that override. It is
# slower than ci.yml (cold caches every run, no CARGO_HOME on stable disk)
# and shouldn't become the default — it exists so one PR can ship while the
# runner is being provisioned.
#
# Coverage thresholds are deliberately relaxed in this workflow (warn, not
# fail) because the GitHub-hosted runner builds without the cached cargo
# state that the self-hosted runner accumulates over time.

name: CI (fallback / ubuntu-latest)

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint (fallback)
    if: contains(github.event.pull_request.labels.*.name, 'ci:fallback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: cargo fmt --check
      - run: typos
      - run: bash scripts/assert-daemon-release-boundary.sh
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test (fallback)
    if: contains(github.event.pull_request.labels.*.name, 'ci:fallback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88.0, fallback)
    if: contains(github.event.pull_request.labels.*.name, 'ci:fallback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --workspace
