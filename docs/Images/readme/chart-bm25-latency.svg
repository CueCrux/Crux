<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <text x="0" y="14" font-size="12" font-weight="600" fill="#8b949e">BM25 single-segment search latency (Criterion, median)</text>
  <g font-size="11">
    <text x="0" y="56" fill="#8b949e">100 docs</text>
    <rect x="110" y="44" width="14" height="18" rx="4" fill="#3fb950"/>
    <text x="132" y="57" font-weight="600" fill="#3fb950">583 ns</text>
    <text x="0" y="106" fill="#8b949e">1,000 docs</text>
    <rect x="110" y="94" width="52" height="18" rx="4" fill="#3fb950"/>
    <text x="170" y="107" font-weight="600" fill="#3fb950">2.62 µs</text>
    <text x="0" y="156" fill="#8b949e">10,000 docs</text>
    <rect x="110" y="144" width="240" height="18" rx="4" fill="#58a6ff"/>
    <text x="358" y="157" font-weight="600" fill="#58a6ff">23.1 µs</text>
  </g>
  <text x="110" y="192" font-size="10" fill="#6e7681">microseconds, not milliseconds — memory lookups shouldn't need a GPU (docs/benchmarks.md)</text>
</svg>
