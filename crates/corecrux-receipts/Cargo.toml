[package]
name = "corecrux-receipts"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
ciborium-ll = "0.2.2"
chacha20poly1305 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["serde"] }
cms = { version = "0.3.0-pre.2", features = ["std"] }
const-oid = "0.10.2"
ed25519-dalek = { workspace = true, features = ["std"] }
half = "2.7.1"
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11.14"
# `preserve_order` is LOAD-BEARING, not a preference. `canonical_body_bytes`
# in observation_envelope.rs signs `serde_json::to_value(record)`, so the map
# ordering IS the wire format: with the feature on, fields keep struct
# declaration order; with it off, serde_json sorts them alphabetically and
# every observation receipt ever minted fails to verify.
#
# Until this crate owned that canonicalisation the dependency was accidental —
# corecruxd only got the feature because `crux-session` happens to enable it
# and Cargo unifies features across the graph. Declared here so the crate that
# defines the format also declares what the format depends on.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
zip = { workspace = true }

# C2PA X.509 trust-anchor signer (agent-ux-07 M6).
# `p256` provides the local P-256 leaf key (ECDSA-with-SHA256).
# `rcgen` builds the CSR that Vault PKI signs (Vault verifies the CSR's
# public key matches the SubjectPublicKeyInfo it returns inside the leaf).
# `x509-cert` parses Vault's returned PEM chain + the operator-supplied
# root anchor PEM offline for the corecruxctl verifier path.
# `der` is used to obtain DER bytes for chain validation.
# `ureq` is the synchronous HTTP client used to POST CSRs to Vault PKI;
# rustls-tls keeps the dep surface small (no openssl).
p256 = { workspace = true, features = ["std", "ecdsa", "pem"] }
rcgen = { workspace = true, features = ["x509-parser"] }
x509-cert = { workspace = true, features = ["std", "pem"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
der = { version = "0.7.10", default-features = false, features = ["std", "pem"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
url = { workspace = true }
uuid = { workspace = true }
parking_lot = "0.12.3"
# rand_core 0.6 matches p256 0.13's CryptoRng trait. We only use OsRng.
rand_core = { version = "0.6.4", features = ["std", "getrandom"] }
ring = "0.17.14"

corecrux-types = { path = "../corecrux-types" }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
