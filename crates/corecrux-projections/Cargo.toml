[package]
name = "corecrux-projections"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }

[dev-dependencies]
proptest = { workspace = true }
# Zero-write gate (`tests/native_memory_ingest.rs`): the ExecPlan's M4 gate names
# sha256 for the before/after content snapshot, so the test computes sha256 even
# though the projection itself hashes with blake3.
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
