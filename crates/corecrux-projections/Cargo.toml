[package]
name = "corecrux-projections"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.5"
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.11"
uuid = { version = "1.15.1", features = ["serde", "v4"] }
xxhash-rust = { version = "0.8.12", features = ["xxh64"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }

[dev-dependencies]
proptest = "1.6.0"
tempfile = "3.16.0"

[lints]
workspace = true
