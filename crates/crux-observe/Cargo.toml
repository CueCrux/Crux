[package]
name = "crux-observe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
regex = "1.11"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["v4"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "registry"] }
tokio = { version = "1.52.3", features = ["sync", "rt"] }
corecrux-memory = { path = "../corecrux-memory" }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json", "registry"] }

[lints]
workspace = true
