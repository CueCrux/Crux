[package]
name = "crux-mcp"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
hex = { workspace = true }
jsonwebtoken = { workspace = true, features = ["use_pem", "aws_lc_rs"] }
prometheus = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["v4"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-retrieval = { path = "../corecrux-retrieval" }
crux-lens-features = { path = "../crux-lens-features" }
corecrux-types = { path = "../corecrux-types" }
crux-observe = { path = "../crux-observe" }
crux-integrations = { path = "../crux-integrations" }
crux-router = { path = "../crux-router" }
crux-session = { path = "../crux-session" }
rcx-capability-token = { path = "../rcx-capability-token" }
vaultcrux-local = { path = "../vaultcrux-local" }

[dev-dependencies]
# agent-passport M5 T.1 regression suite builds a real `.ccxi` segment to prove
# the `query` retrieval path's tenant-hash isolation end-to-end.
corecrux-index = { path = "../corecrux-index" }
http-body-util = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
zstd = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true
