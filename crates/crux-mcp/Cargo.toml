[package]
name = "crux-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.1"
blake3 = "1.5.1"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "serde"] }
base64 = "0.22.1"
rand = "0.8.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["v4"] }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-retrieval = { path = "../corecrux-retrieval" }
corecrux-types = { path = "../corecrux-types" }
crux-observe = { path = "../crux-observe" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
