[package]
name = "crux-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["std"] }
hex = "0.4.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
rand = "0.10.1"
regex = "1.11"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.12"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.23.2", features = ["v4"] }
xxhash-rust = { version = "0.8.12", features = ["xxh64"] }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-retrieval = { path = "../corecrux-retrieval" }
crux-lens-features = { path = "../crux-lens-features" }
corecrux-types = { path = "../corecrux-types" }
crux-observe = { path = "../crux-observe" }
crux-integrations = { path = "../crux-integrations" }
crux-router = { path = "../crux-router" }
crux-session = { path = "../crux-session" }
rcx-capability-token = { path = "../rcx-capability-token" }
vaultcrux-local = { path = "../vaultcrux-local" }

[dev-dependencies]
# agent-passport M5 T.1 regression suite builds a real `.ccxi` segment to prove
# the `query` retrieval path's tenant-hash isolation end-to-end.
corecrux-index = { path = "../corecrux-index" }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
zstd = "0.13.3"
tar = "0.4.44"

[lints]
workspace = true
