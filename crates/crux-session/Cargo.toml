[package]
name = "crux-session"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VaultCrux Session Handshake v1 — canonical CBOR/JSON encoder, BLAKE3 hashing, ed25519 verify."

[dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

[dev-dependencies]
corecrux-projections = { path = "../corecrux-projections" }
hex-literal = "1.1.0"

[lints]
workspace = true
