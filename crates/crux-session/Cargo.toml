[package]
name = "crux-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VaultCrux Session Handshake v1 — canonical CBOR/JSON encoder, BLAKE3 hashing, ed25519 verify."

[dependencies]
blake3 = "1.8.5"
ed25519-dalek = { version = "2.1.1", features = ["std", "rand_core"] }
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.139", features = ["preserve_order"] }
thiserror = "2.0.12"

[dev-dependencies]
corecrux-projections = { path = "../corecrux-projections" }
hex-literal = "1.1.0"

[lints]
workspace = true
