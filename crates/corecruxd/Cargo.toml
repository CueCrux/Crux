[package]
name = "corecruxd"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
# Phase B (community-extensions ExecPlan M6): enables the wasmtime-backed
# host for `kind: wasm` extensions. Off by default so that operators who
# only use Phase A external-tool extensions don't pay the wasmtime build
# cost (~30s cold + ~60MB binary growth).
wasm-extensions = ["dep:wasmtime"]
# buyer-fit M3.4: compile in the optional fastembed (ONNX) embedder. OFF by
# default — the default binary keeps the always-on pure-Rust LocalHashEmbedder
# and never links ONNX Runtime. Enable with `CORECRUXD_DENSE_MODEL=fastembed`.
dense-embed-model = ["corecrux-memory/dense-embed-model"]
# ExecPlan crux-external-findings-remediation M4: hosted-service HTTP surfaces
# — the Pro GPU-1 compute bridge (`/v1/gpu1/*`, `src/http/gpu1.rs`) and the Pro
# cloud access posture (`GET /v1/cloud/access-contract`, `src/http/cloud.rs`) —
# are compiled OUT of the default Community Edition binary. OFF by default;
# NOT part of any default feature list. Enable to build the hosted daemon.
hosted-surfaces = []

[dependencies]
axum = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock"] }
ciborium = { workspace = true }
crc32fast = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std", "pkcs8"] }
fs2 = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true, default-features = false, features = ["use_pem", "aws_lc_rs"] }
prometheus = { workspace = true, default-features = false }
chacha20poly1305 = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }
tar = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tonic = { workspace = true }
tower = { workspace = true, features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "timeout", "trace"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
ureq = { workspace = true, features = ["json"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
zstd = { workspace = true }
zip = { workspace = true, features = ["default"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-proto = { path = "../corecrux-proto" }
corecrux-retrieval = { path = "../corecrux-retrieval" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }
corecrux-types = { path = "../corecrux-types" }
crux-cost = { path = "../crux-cost" }
crux-observe = { path = "../crux-observe" }
crux-observe-api = { path = "../crux-observe-api" }
crux-integrations = { path = "../crux-integrations" }
crux-lens-features = { path = "../crux-lens-features" }
crux-mcp = { path = "../crux-mcp" }
crux-router = { path = "../crux-router" }
crux-sync = { path = "../crux-sync" }
rcx-capability-token = { path = "../rcx-capability-token" }
crux-session = { path = "../crux-session" }
crux-enterprise-shim = { path = "../crux-enterprise-shim" }
vaultcrux-local = { path = "../vaultcrux-local" }

wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime"], optional = true }
sha2 = { workspace = true }
# Witness (Track W / G1): Sigstore Rekor's hashedrekord verification requires
# ECDSA P-256 (the daemon seal key is Ed25519), so the witness signs entries
# with a dedicated P-256 key. Already a workspace dep via corecrux-receipts.
p256 = { workspace = true, default-features = false, features = ["std", "ecdsa", "pem"] }
notify = "8"
tree-sitter = "0.26.10"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-swift = "=0.7.3"
tree-sitter-php = "=0.24.2"

[dev-dependencies]
corecrux-index = { path = "../corecrux-index" }
rcgen = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
wat = "1"

[build-dependencies]
anyhow = { workspace = true }

[lints]
workspace = true
