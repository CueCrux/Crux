[package]
name = "corecruxd"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
# Phase B (community-extensions ExecPlan M6): enables the wasmtime-backed
# host for `kind: wasm` extensions. Off by default so that operators who
# only use Phase A external-tool extensions don't pay the wasmtime build
# cost (~30s cold + ~60MB binary growth).
wasm-extensions = ["dep:wasmtime"]

[dependencies]
axum = "0.8.9"
utoipa = { version = "5", features = ["axum_extras"] }
base64 = "0.22.1"
blake3 = "1.8.5"
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
crc32fast = "1.4.2"
ed25519-dalek = { version = "2.2.0", features = ["std"] }
fs2 = "0.4.3"
hex = "0.4.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
prometheus = { version = "0.13.4", default-features = false }
chacha20poly1305 = "0.10.1"
prost = "0.14.3"
rand = "0.10.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
xxhash-rust = { version = "0.8.12", features = ["xxh64"] }
tar = "0.4.44"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tonic = "0.14.6"
tower-http = { version = "0.6.2", features = ["catch-panic", "cors", "timeout", "trace"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
ureq = { version = "3.3.0", features = ["json"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["tonic"], optional = true }
uuid = { version = "1.23.1", features = ["v4"] }
zstd = "0.13.3"
zip = "8.6.0"

corecrux-frame = { path = "../corecrux-frame" }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-proto = { path = "../corecrux-proto" }
corecrux-retrieval = { path = "../corecrux-retrieval" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }
corecrux-types = { path = "../corecrux-types" }
crux-observe = { path = "../crux-observe" }
crux-integrations = { path = "../crux-integrations" }
crux-lens-features = { path = "../crux-lens-features" }
crux-mcp = { path = "../crux-mcp" }
crux-router = { path = "../crux-router" }
crux-session = { path = "../crux-session" }
crux-enterprise-shim = { path = "../crux-enterprise-shim" }
vaultcrux-local = { path = "../vaultcrux-local" }

wasmtime = { version = "45", default-features = false, features = ["cranelift", "runtime"], optional = true }
sha2 = "0.11"

[dev-dependencies]
corecrux-index = { path = "../corecrux-index" }
serial_test = "3"
tempfile = "3"
wat = "1"

[build-dependencies]
anyhow = "1.0.97"

[lints]
workspace = true
