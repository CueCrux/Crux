<!-- Activity log — human lane (ExecPlan crux-dual-surface-activity-log-2026-06-18, M3).
     A new page on the embedded console: live rolling list off /v1/events/stream,
     backfill off /v1/activity, colour-by-kind, client-side search, row-expand to
     verbatim text + receipt cross-walk. Self-contained, no external runtime deps. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity · Crux Console</title>
<script>(function(){try{if((localStorage.getItem('cx-theme')||'dark')==='dark')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();</script>
<style>
  :root{ --bg-page:#f8fafc; --surface:#fff; --surface-muted:#e2e8f0; --border:#e2e8f0;
    --text-primary:#0f172a; --text-secondary:rgba(71,85,105,.85); --text-muted:rgba(100,116,139,.7);
    --accent:#5E6AD2; --ok:#16a34a; --run:#d97706; --err:#dc2626; --idle:#64748b;
    --code-bg:#f1f5f9; --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  html.dark{ --bg-page:#020203; --surface:#0a0a0c; --surface-muted:#0a0a0c; --border:rgba(138,143,152,.16);
    --text-primary:#EDEDEF; --text-secondary:rgba(138,143,152,.9); --text-muted:rgba(138,143,152,.6);
    --ok:#34d399; --run:#fbbf24; --err:#f87171; --idle:#6b7689; --code-bg:#0a0e16; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg-page); color:var(--text-primary); font-family:var(--font-sans); font-size:14px; }
  a{ color:var(--accent); text-decoration:none; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-page); z-index:5; flex-wrap:wrap; }
  header h1{ font-size:1rem; margin:0; font-weight:600; }
  header .crumb{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
  .controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 20px; border-bottom:1px solid var(--border); }
  .controls label{ font-size:11px; color:var(--text-muted); font-family:var(--font-mono); display:flex; flex-direction:column; gap:3px; }
  input, button, select{ font-family:var(--font-mono); font-size:12px; padding:6px 9px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-primary); min-height:32px; }
  button{ cursor:pointer; background:var(--accent); color:#fff; border:none; font-weight:600; }
  button.ghost{ background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
  .kinds{ display:flex; gap:5px; flex-wrap:wrap; }
  .kchip{ font-family:var(--font-mono); font-size:10.5px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); cursor:pointer; user-select:none; color:var(--text-secondary); }
  .kchip.on{ color:#fff; border-color:transparent; }
  #status{ padding:6px 20px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
  #live-dot{ display:inline-block; width:8px; height:8px; border-radius:999px; background:var(--idle); margin-right:5px; vertical-align:middle; }
  #live-dot.on{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .list{ padding:6px 14px 60px; }
  .row{ border:1px solid var(--border); border-left-width:4px; border-radius:10px; padding:9px 12px; margin:7px 0; background:var(--surface); cursor:pointer; }
  .row:hover{ border-color:var(--accent); }
  .row .meta{ display:flex; gap:10px; align-items:center; font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); }
  .row .kind{ font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .row .preview{ margin-top:4px; color:var(--text-secondary); white-space:pre-wrap; word-break:break-word; font-size:13px; }
  .row .expand{ margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; display:none; }
  .row.open .expand{ display:block; }
  .row .verbatim{ font-family:var(--font-mono); font-size:12px; background:var(--code-bg); border-radius:8px; padding:9px; white-space:pre-wrap; word-break:break-word; }
  .badge{ display:inline-block; font-family:var(--font-mono); font-size:10px; padding:2px 7px; border-radius:999px; margin:4px 5px 0 0; border:1px solid var(--border); color:var(--text-secondary); }
  .badge.ok{ color:var(--ok); border-color:var(--ok); }
  .badge.warn{ color:var(--run); border-color:var(--run); }
  .badge.err{ color:var(--err); border-color:var(--err); }
  .k-question{ border-left-color:var(--accent); } .k-question .kind{ color:var(--accent); }
  .k-answer{ border-left-color:var(--ok); } .k-answer .kind{ color:var(--ok); }
  .k-reasoning{ border-left-color:var(--idle); } .k-reasoning .kind{ color:var(--idle); }
  .k-command{ border-left-color:var(--run); } .k-command .kind{ color:var(--run); }
  .k-fact{ border-left-color:#8b5cf6; } .k-fact .kind{ color:#8b5cf6; }
  .k-execplan,.k-handoff{ border-left-color:#0ea5e9; } .k-execplan .kind,.k-handoff .kind{ color:#0ea5e9; }
  .k-error{ border-left-color:var(--err); } .k-error .kind{ color:var(--err); }
  .empty{ padding:40px 20px; text-align:center; color:var(--text-muted); font-family:var(--font-mono); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Activity</h1>
  <span class="crumb">Crux Console · <a href="/console">← back to console</a></span>
  <span style="flex:1"></span>
  <span id="live-wrap" class="crumb"><span id="live-dot"></span><span id="live-label">live off</span></span>
  <button class="ghost" id="theme-btn" type="button">theme</button>
</header>

<div class="controls">
  <label>tenant_id <input id="f-tenant" value="default" size="14"></label>
  <label>session_id <input id="f-session" placeholder="session id" size="22"></label>
  <label>token_budget <input id="f-budget" value="2000" size="7" inputmode="numeric"></label>
  <label>search <input id="f-search" placeholder="filter text…" size="18"></label>
  <div class="kinds" id="kinds"></div>
  <button id="btn-load" type="button">Load</button>
  <button class="ghost" id="btn-live" type="button">Go live</button>
</div>

<div id="status"><span id="status-text">Enter a session id and Load. The activity log is gated by CORECRUXD_FEATURE_ACTIVITY_LOG.</span></div>
<div class="list" id="list"><div class="empty">No activity loaded yet.</div></div>

<script>
const KINDS = ["question","answer","reasoning","command","fact","execplan","handoff","error"];
const $ = id => document.getElementById(id);
let activeKinds = new Set(KINDS);
let es = null;          // EventSource for live
let rows = [];          // current loaded rows (newest-first)

// ── auth (mirror the console's apiHeaders) ──────────────────────────────────
function boundPassport(){ try{ return localStorage.getItem('crux-console-bound-passport')||''; }catch{ return ''; } }
function headers(){
  const h = {'X-Corecrux-Scopes':'facts:read,admin:read'};
  const pid = boundPassport(); if(pid) h['X-Corecrux-Passport-Id'] = pid;
  return h;
}
async function apiGet(path){
  const r = await fetch(path, {headers: headers()});
  const t = await r.text(); let d; try{ d = JSON.parse(t); }catch{ d = {text:t}; }
  if(!r.ok) throw {status:r.status, data:d};
  return d;
}
function enc(s){ return encodeURIComponent(s); }
function tenant(){ return ($('f-tenant').value||'default').trim(); }
function session(){ return ($('f-session').value||'').trim(); }
function budget(){ const n = parseInt($('f-budget').value,10); return (n>0)?n:2000; }

// ── kind filter chips ───────────────────────────────────────────────────────
function renderKindChips(){
  const wrap = $('kinds'); wrap.innerHTML='';
  KINDS.forEach(k=>{
    const c = document.createElement('span');
    c.className = 'kchip k-'+k+(activeKinds.has(k)?' on':'');
    c.textContent = k;
    if(activeKinds.has(k)){ c.style.background = kindColor(k); }
    c.onclick = ()=>{ activeKinds.has(k)?activeKinds.delete(k):activeKinds.add(k); renderKindChips(); render(); };
    wrap.appendChild(c);
  });
}
function kindColor(k){
  const v = getComputedStyle(document.documentElement);
  const map = {question:'--accent',answer:'--ok',reasoning:'--idle',command:'--run',error:'--err'};
  if(k==='fact') return '#8b5cf6'; if(k==='execplan'||k==='handoff') return '#0ea5e9';
  return v.getPropertyValue(map[k]||'--idle').trim()||'#6b7689';
}

// ── load + render ───────────────────────────────────────────────────────────
function setStatus(msg){ $('status-text').textContent = msg; }
async function load(){
  const s = session();
  if(!s){ setStatus('Enter a session id first.'); return; }
  const kindsParam = (activeKinds.size && activeKinds.size<KINDS.length) ? '&kinds='+enc([...activeKinds].join(',')) : '';
  const url = `/v1/activity?tenant_id=${enc(tenant())}&session=${enc(s)}&token_budget=${budget()}${kindsParam}`;
  try{
    const data = await apiGet(url);
    rows = data.rows||[];
    setStatus(`${data.returned||0} row(s)${data.truncated?' (budget-truncated — raise token_budget)':''} · session ${s}`);
    render();
  }catch(e){
    if(e.status===404){ setStatus('Activity log disabled on this daemon (set CORECRUXD_FEATURE_ACTIVITY_LOG=1).'); }
    else if(e.status===400){ setStatus('Bad request: '+((e.data&&(e.data.detail||e.data.title))||'check token_budget / params')); }
    else { setStatus('Load failed (HTTP '+(e.status||'?')+'): '+((e.data&&(e.data.detail||e.data.title))||'')); }
    rows = []; render();
  }
}
function matchesSearch(r, q){
  if(!q) return true;
  const hay = ((r.kind||'')+' '+(r.preview||'')+' '+(r.tool||'')+' '+(r.intent||'')+' '+(r.turn_id||'')).toLowerCase();
  return hay.includes(q);
}
function render(){
  const q = ($('f-search').value||'').trim().toLowerCase();
  const list = $('list'); list.innerHTML='';
  const visible = rows.filter(r=>activeKinds.has(r.kind) && matchesSearch(r,q));
  if(!visible.length){ list.innerHTML = '<div class="empty">No matching activity.</div>'; return; }
  visible.forEach(r=> list.appendChild(rowEl(r)));
}
function rowEl(r){
  const el = document.createElement('div');
  el.className = 'row k-'+(r.kind||'idle');
  const conf = (r.confidence!=null)?` · conf ${r.confidence}`:'';
  const tool = r.tool?` · ${escapeHtml(r.tool)}`:''; const intent = r.intent?` · ${escapeHtml(r.intent)}`:'';
  el.innerHTML =
    `<div class="meta"><span class="kind">${escapeHtml(r.kind||'')}</span><span>seq ${r.seq}</span>`+
    `<span>${escapeHtml(r.ts||'')}</span><span>${r.turn_id?('turn '+escapeHtml(r.turn_id)):'—'}</span>`+
    `<span>${tool}${intent}${conf}</span></div>`+
    `<div class="preview">${escapeHtml(r.preview||'')}</div>`+
    `<div class="expand"><div class="verbatim">loading verbatim…</div><div class="receipts"></div></div>`;
  el.onclick = ()=>{ const open = el.classList.toggle('open'); if(open) expand(el, r); };
  return el;
}
async function expand(el, r){
  const vb = el.querySelector('.verbatim'); const rc = el.querySelector('.receipts');
  if(!r.turn_id){ vb.textContent = r.preview||'(no turn id — preview only)'; rc.innerHTML=''; return; }
  try{
    const data = await apiGet(`/v1/activity/turn/${enc(r.turn_id)}?tenant_id=${enc(tenant())}&session=${enc(session())}`);
    const entries = data.entries||[];
    vb.textContent = entries.map(e=> `[${e.kind}] ${e.text}`).join('\n\n') || '(no entries)';
    const receiptIds = [...new Set(entries.flatMap(e=> (e.refs&&e.refs.receipt_ids)||[]))];
    rc.innerHTML = '';
    receiptIds.forEach(id=>{
      const b = document.createElement('span'); b.className='badge'; b.textContent='⏳ '+id;
      rc.appendChild(b); verifyBadge(b, id);
    });
    if(!receiptIds.length){ rc.innerHTML = '<span class="badge">no receipt refs</span>'; }
  }catch(e){ vb.textContent = 'deref failed (HTTP '+(e.status||'?')+')'; }
}
async function verifyBadge(b, id){
  // Cross-walk verification. Synthetic append ids ("act_…") have no signed
  // CROWN receipt yet (T.4 follow-up) → shown as "recorded", not a failure.
  try{
    const data = await apiGet(`/v1/receipts/${enc(id)}/verification?tenant_id=${enc(tenant())}`);
    if(data && data.signature_valid && data.error_code==='OK'){ b.className='badge ok'; b.textContent='✓ verified '+id; }
    else { b.className='badge warn'; b.textContent='• recorded '+id; }
  }catch(e){
    if(e.status===404 || (id+'').startsWith('act_')){ b.className='badge warn'; b.textContent='• recorded '+id; }
    else { b.className='badge err'; b.textContent='✕ unverifiable '+id; }
  }
}

// ── live ────────────────────────────────────────────────────────────────────
function toggleLive(){
  if(es){ es.close(); es=null; $('live-dot').classList.remove('on'); $('live-label').textContent='live off'; $('btn-live').textContent='Go live'; return; }
  es = new EventSource('/v1/events/stream?types=activity.appended');
  let pending=null;
  es.addEventListener('activity.appended', ev=>{
    try{ const d = JSON.parse(ev.data); const payload = d.data||d;
      if(payload.session_id && payload.session_id!==session()) return;
    }catch{}
    // Debounced refetch so a burst of appends = one reload.
    clearTimeout(pending); pending = setTimeout(load, 400);
  });
  es.onerror = ()=>{ $('live-label').textContent='live (reconnecting)'; };
  $('live-dot').classList.add('on'); $('live-label').textContent='live on'; $('btn-live').textContent='Stop live';
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── wire-up ─────────────────────────────────────────────────────────────────
$('btn-load').onclick = load;
$('btn-live').onclick = toggleLive;
$('f-search').oninput = render;
$('f-session').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
$('theme-btn').onclick = ()=>{ const d=document.documentElement.classList.toggle('dark'); try{ localStorage.setItem('cx-theme', d?'dark':'light'); }catch{} renderKindChips(); };
// Prefill session from ?session= / #session= for deep-linking from the console.
(function(){ const p=new URLSearchParams(location.search); const s=p.get('session')||p.get('session_id'); if(s) $('f-session').value=s; const t=p.get('tenant_id'); if(t) $('f-tenant').value=t; })();
renderKindChips();
if(session()) load();
</script>
</body>
</html>
