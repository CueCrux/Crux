<!-- Unified Shell Console v2 — M0 scaffold (ExecPlan unified-shell-console-2026-07-03).
     One embedded, no-build SPA shell: 5 destinations (Overwatch · Work · Memory ·
     Trust · Meters) + a System group, a token-registry theme system (Glass/Dark/
     Light), plan-driven boot off same-origin GET /v1/version + /v1/console/summary.
     Self-contained: no external requests of any kind (strict-CSP assumption),
     vanilla JS, inline SVG icons. Served at /console when CORECRUXD_CONSOLE_V2 is
     truthy; the legacy console is untouched when the flag is off. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crux Console — Unified Shell</title>
<!-- PWA install surface (M5). Same-origin, no external requests. theme-color +
     background use the Glass theme --bg (#060A12). The service worker is registered
     from a small script at the end of <body> (feature-detected, secure-context only). -->
<link rel="manifest" href="/console-v2/manifest.webmanifest">
<meta name="theme-color" content="#060A12">
<link rel="icon" type="image/svg+xml" href="/console-v2/icon.svg">
<link rel="apple-touch-icon" href="/console-assets/CueCrux-Arc-Loop-White.png">
<!-- Apply the persisted theme before first paint to avoid a flash. Mirrors the
     THEMES registry below; unknown/absent value falls back to the default. -->
<script>
  (function () {
    try {
      var allowed = { glass: 1, dark: 1, light: 1 };
      var t = localStorage.getItem('crux.console.theme');
      document.documentElement.setAttribute('data-theme', allowed[t] ? t : 'glass');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'glass');
    }
    // Apply the persisted rail state before first paint too (icon-only vs full
    // rail) so the grid width doesn't jump on load. Mirrors crux.console.rail.
    try {
      // Collapsed by default on a fresh load; only an explicit user-expanded
      // preference (persisted as 'open') keeps the rail open.
      document.documentElement.setAttribute(
        'data-rail', localStorage.getItem('crux.console.rail') === 'open' ? 'open' : 'collapsed');
    } catch (e) {
      document.documentElement.setAttribute('data-rail', 'collapsed');
    }
    // Apply the persisted presentation mode (Standard | Professional | Documents)
    // before first paint so Pro density / the reader layout don't flash. Mirrors
    // crux.console.mode. 'documents' (M10) is the console-as-reader. Mode is
    // PRESENTATION — never posture.
    try {
      var m = localStorage.getItem('crux.console.mode');
      document.documentElement.setAttribute('data-mode', (m === 'professional' || m === 'documents') ? m : 'standard');
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'standard');
    }
  })();
</script>
<style>
  /* ---- Base reset -------------------------------------------------------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --radius: 14px;
    --radius-sm: 10px;
  }

  /* ---- Theme token registry --------------------------------------------- */
  /* Adding a 4th theme = one JS THEMES entry + one CSS block here. Nothing
     else in the shell references literal colours. */
  :root[data-theme="glass"] {
    color-scheme: dark;
    --bg: #060A12;
    --surface: rgba(255,255,255,.055);
    --surface2: rgba(255,255,255,.03);
    --edge: rgba(255,255,255,.10);
    --edge-strong: rgba(255,255,255,.18);
    --ink: #EAF0F7;
    --ink2: #93A4B8;
    --ink3: #6E7E96;
    --acc: #6CA8FF;
    --ok: #3DDC97;
    --warn: #F5B94B;
    --crit: #F0716C;
    --trust: #A78BFA;
    --approve-a: #43E6A2;
    --approve-b: #2BB983;
    --approve-ink: #05261A;
    --blur: 18px;
    --card-shadow: none;
    --aurora-opacity: 1;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #11151C;
    --edge: #2A313C;
    --edge-strong: #3D4654;
    --ink: #E6EDF3;
    --ink2: #9BA7B4;
    --ink3: #6E7B8A;
    --acc: #58A6FF;
    --ok: #2EA043;
    --warn: #D29922;
    --crit: #F85149;
    --trust: #BC8CFF;
    --approve-a: #2EA043;
    --approve-b: #238636;
    --approve-ink: #FFFFFF;
    --blur: 0px;
    --card-shadow: none;
    --aurora-opacity: 0;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface2: #EDF1F5;
    --edge: #D7DEE5;
    --edge-strong: #B9C4CF;
    --ink: #1B2733;
    --ink2: #4A5866;
    --ink3: #5B6B7D;
    --acc: #2456A6;
    --ok: #1A7F4E;
    --warn: #9A5B00;
    --crit: #B91C1C;
    --trust: #6D28D9;
    --approve-a: #1A7F4E;
    --approve-b: #14663E;
    --approve-ink: #FFFFFF;
    --blur: 0px;
    --card-shadow: 0 1px 3px rgba(27,39,51,.08);
    --aurora-opacity: 0;
  }

  body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--acc); text-decoration: none; }
  button { font: inherit; }

  /* ---- Aurora background (glass theme only) ------------------------------ */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: var(--aurora-opacity);
    transition: opacity .4s ease;
    background:
      radial-gradient(48rem 48rem at 12% -8%, rgba(108,168,255,.20), transparent 60%),
      radial-gradient(42rem 42rem at 96% 4%, rgba(167,139,250,.16), transparent 58%),
      radial-gradient(46rem 46rem at 78% 108%, rgba(61,220,151,.12), transparent 60%);
  }
  :root[data-theme="glass"] .aurora {
    animation: auroraDrift 34s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-1.5%, 1.2%, 0) scale(1.06); }
  }

  /* ---- App shell layout -------------------------------------------------- */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; transition: grid-template-columns .2s ease; }

  .rail {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 12px;
    border-right: 1px solid var(--edge);
    background: var(--surface);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    overflow: hidden;
  }

  /* Rail collapse toggle — a 44px chevron at the rail top. aria-expanded +
     aria-label are set in JS; the glyph rotates when collapsed. */
  .rail-toggle {
    display: flex; align-items: center; justify-content: center; flex: none;
    min-height: 32px; min-width: 32px; margin-left: auto; margin-right: -2px;
    background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
    color: var(--ink3); cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .rail-toggle svg { width: 18px; height: 18px; transition: transform .2s ease; }
  .rail-toggle:hover { background: var(--surface2); color: var(--ink); border-color: var(--edge-strong); }

  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
  .brand .mark {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, var(--acc), var(--trust));
    color: #fff;
  }
  .brand .mark svg { width: 18px; height: 18px; }
  .brand .name { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
  .brand .name small { display: block; font-weight: 500; font-size: 11px; color: var(--ink3); letter-spacing: .02em; }

  nav { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .nav-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink3); font-weight: 600; padding: 14px 10px 6px;
  }
  /* ---- Nav-family interactive surface — ONE source of truth --------------
     The nav-item / button / pill family shares this single glass ruleset:
     squarer var(--radius-sm) corners, transparent → var(--surface2) on hover,
     a 1px var(--edge) → var(--edge-strong) border, and an accent icon on the
     current/pressed item. Each selector then adds ONLY its own layout
     (size · gap · font) below — no duplicated colour / hover / current blocks.
     Shape/size/transition/hover/current are shared here; the LEFT RAIL items
     take one at-rest override just below (they rest borderless — the resting
     outline belongs to body buttons + sub-nav pills only). .btn-primary (the
     approve gradient) is the single accent variant and opts out of this tint. */
  .nav-item, .btn-quiet, .pill {
    color: var(--ink2); background: transparent;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .nav-item:hover, .btn-quiet:hover:not(:disabled), .pill:hover {
    background: var(--surface2); color: var(--ink); border-color: var(--edge-strong);
  }
  .nav-item[aria-current="page"], .pill[aria-current="page"], .btn-quiet[aria-pressed="true"] {
    background: var(--surface2); color: var(--ink); border-color: var(--edge-strong);
  }
  .nav-item[aria-current="page"] svg, .pill[aria-current="page"] svg { opacity: 1; color: var(--acc); }
  /* Left-rail items rest BORDERLESS (transparent) — restored to the pre-round-3
     look. Body buttons (.btn-quiet) + sub-nav pills keep the shared resting
     outline; only the rail drops it at rest. The --surface2 fill +
     --edge-strong border still appear on hover / aria-current (the two
     rail-scoped selectors below out-specify the family hover/current rules).
     Everything else (shape/size/transition/current-accent) stays shared above. */
  .rail .nav-item { border-color: transparent; }
  .rail .nav-item:hover,
  .rail .nav-item[aria-current="page"] { border-color: var(--edge-strong); }

  /* nav-item layout only (colour/border/hover live in the shared rule above). */
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    min-height: 44px; padding: 0 12px;
    width: 100%; text-align: left;
  }
  .nav-item svg { width: 18px; height: 18px; flex: none; opacity: .9; }
  .nav-item .label { flex: 1; font-weight: 500; }
  .nav-item .kbd {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink3);
    border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px;
    min-width: 20px; text-align: center;
  }

  .rail-footer { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .passport-chip {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface2); width: 100%; text-align: left; font: inherit; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .passport-chip:hover { border-color: var(--edge-strong); background: var(--surface); }
  .passport-chip .avatar {
    width: 30px; height: 30px; flex: none; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, var(--trust), var(--acc));
  }
  .passport-chip .avatar svg { width: 16px; height: 16px; }
  .passport-chip .who { min-width: 0; flex: 1; line-height: 1.3; }
  .passport-chip .who b {
    display: block; font-size: 13px; font-weight: 650; letter-spacing: -.01em; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .passport-chip .who span {
    display: block; font-size: 10.5px; color: var(--ink3); letter-spacing: .02em;
    font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .theme-switch {
    display: flex; gap: 4px; padding: 4px;
    border: 1px solid var(--edge); border-radius: 12px; background: var(--surface2);
  }
  .theme-btn {
    flex: 1; min-height: 44px; min-width: 40px;
    display: grid; place-items: center;
    background: none; border: 1px solid transparent; border-radius: 9px;
    color: var(--ink2); cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .theme-btn svg { width: 18px; height: 18px; }
  .theme-btn:hover { color: var(--ink); background: var(--surface); }
  .theme-btn[aria-pressed="true"] { background: var(--acc); color: #fff; }

  /* ---- Collapsed rail (icon-only, ~64px) --------------------------------
     Guarded to the desktop tier (min-width:721px) so it never fights the
     phone media query that hides the rail entirely. Toggled via
     :root[data-rail="collapsed"]; state persists in localStorage
     (crux.console.rail). Labels, group labels, kbd hints, the brand name, the
     passport identity text and the footer collapse; nav items keep a title
     tooltip (set in JS) and the theme switch stacks its icons vertically. */
  @media (min-width: 721px) {
    :root[data-rail="collapsed"] .app { grid-template-columns: 64px 1fr; }
    :root[data-rail="collapsed"] .rail { padding: 16px 8px; align-items: stretch; }
    :root[data-rail="collapsed"] .rail-toggle { margin: -4px auto 2px; }
    :root[data-rail="collapsed"] .rail-toggle svg { transform: rotate(180deg); }
    :root[data-rail="collapsed"] .brand { flex-direction: column; justify-content: center; padding: 4px 0 12px; gap: 6px; }
    :root[data-rail="collapsed"] .brand .name { display: none; }
    :root[data-rail="collapsed"] .rail-toggle { margin: 0 auto; }
    :root[data-rail="collapsed"] .nav-item { justify-content: center; padding: 0; gap: 0; }
    :root[data-rail="collapsed"] .nav-item .label,
    :root[data-rail="collapsed"] .nav-item .kbd,
    :root[data-rail="collapsed"] .nav-group-label { display: none; }
    :root[data-rail="collapsed"] .passport-chip { justify-content: center; padding: 8px 0; gap: 0; }
    :root[data-rail="collapsed"] .passport-chip .who { display: none; }
    :root[data-rail="collapsed"] .theme-switch { flex-direction: column; }
  }

  /* ---- Main column ------------------------------------------------------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 28px; border-bottom: 1px solid transparent;
    position: sticky; top: 0; z-index: 4;
    background: transparent;
    transition: background .25s ease, border-color .25s ease, backdrop-filter .25s ease;
  }
  /* Glass only once the view scrolls under it (toggled by wireTopbarScroll). */
  .topbar.scrolled {
    border-bottom-color: var(--edge);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
  }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .topbar .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--ink2); }

  /* Right cluster: compact mono chips (build · auth · dataplane · optional DEMO)
     then the status pill. Chips ride the same pill language as the health pill. */
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .topchips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .topchips:empty { display: none; }
  /* Every topbar chip AND the status pill share ONE height + padding + font
     metric so they baseline-align in the .topbar-right cluster (item 3):
     32px min-height, 0 12px padding, 11.5px/1 text. They now carry the same
     squarer var(--radius-sm) corners as the rest of the family (no longer a
     rounded 999px pill). Per-chip rules below only add family colour (mono
     chips, DEMO warn, health dot). */
  .topchip, .health {
    display: inline-flex; align-items: center;
    min-height: 32px; padding: 0 12px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    font-size: 11.5px; line-height: 1; white-space: nowrap;
    color: var(--ink2); background: var(--surface2);
  }
  .topchip { font-family: var(--font-mono); letter-spacing: .02em; }
  .topchip.demo {
    color: var(--warn); font-weight: 600; letter-spacing: .08em;
    background: color-mix(in srgb, var(--warn) 13%, transparent);
    border-color: color-mix(in srgb, var(--warn) 34%, transparent);
  }

  /* ---- Compact rail meta — the old top bar, condensed under the brand ------
     A full-width Command | Explore surface toggle, then extremely compact
     wrapped status chips + the connection pill. Hidden when the rail collapses
     to icon-only. */
  .rail-meta {
    display: flex; flex-direction: column; gap: 8px;
    padding: 2px 8px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--edge);
  }
  .railseg { display: flex; gap: 3px; padding: 3px; }
  .railseg .modeseg-btn { flex: 1; justify-content: center; min-height: 28px; padding: 0 8px; font-size: 12px; }
  .rail-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .rail-meta .topchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .rail-meta .topchip, .rail-meta .health {
    min-height: 20px; padding: 0 6px; font-size: 9.5px; border-radius: 6px; gap: 5px;
  }
  .rail-meta .health .dot { width: 7px; height: 7px; }
  /* auth + dataplane as compact icon chips (value in the title tooltip). */
  .rail-meta .icon-chip { padding: 0; min-width: 22px; justify-content: center; color: var(--ink3); }
  .rail-meta .icon-chip svg { width: 13px; height: 13px; }
  .rail-meta .icon-chip.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, var(--edge)); }
  /* Theme quick-cycle icon — lives in the chips row, sized like the status chips. */
  .rail-theme-cycle {
    flex: none; min-height: 20px; min-width: 22px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--edge); border-radius: 6px; background: var(--surface2);
    color: var(--ink2); cursor: pointer; transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .rail-theme-cycle:hover { color: var(--ink); border-color: var(--edge-strong); background: var(--surface); }
  .rail-theme-cycle svg { width: 13px; height: 13px; }
  /* Bottom account roll-up menu (Settings · Language · Log out) — the System button. */
  .acct-menu-wrap { position: relative; }
  .passport-chip { width: 100%; font: inherit; cursor: pointer; }
  .passport-chip[aria-expanded="true"] { border-color: var(--edge-strong); }
  .passport-chip .acct-caret { margin-left: auto; display: inline-flex; width: 14px; height: 14px; color: var(--ink3); flex: none; }
  .passport-chip .acct-caret svg { width: 14px; height: 14px; transform: rotate(-90deg); }
  .passport-chip[aria-expanded="true"] .acct-caret svg { transform: rotate(90deg); }
  .acct-menu {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 30;
    display: flex; flex-direction: column; gap: 2px; padding: 6px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  }
  .acct-menu[hidden] { display: none; }
  .acct-item {
    display: flex; align-items: center; gap: 11px; width: 100%; min-height: 38px; padding: 8px 10px;
    border: 0; border-radius: 8px; background: none; color: var(--ink);
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .acct-item:hover { background: var(--surface2); }
  .acct-ico { display: inline-flex; width: 16px; height: 16px; flex: none; color: var(--ink2); }
  .acct-ico svg { width: 16px; height: 16px; }
  .acct-sep { height: 1px; margin: 4px 2px; background: var(--edge); }
  .acct-code { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); border: 1px solid var(--edge); border-radius: 5px; padding: 1px 6px; }
  /* Settings › Theme picker */
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .theme-opt { display: flex; flex-direction: column; gap: 8px; }
  .theme-opt-btn {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
    color: var(--ink2); cursor: pointer; font-weight: 500;
  }
  .theme-opt-btn svg { width: 18px; height: 18px; flex: none; }
  .theme-opt-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, var(--surface2)); }
  .theme-cycle-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink3); cursor: pointer; }
  @media (min-width: 721px) {
    :root[data-rail="collapsed"] .rail-meta { display: none; }
  }

  /* ---- Top-bar search stub (page header left · search right) -------------- */
  .topbar-title { min-width: 0; }
  .searchstub {
    margin-left: auto; display: inline-flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 14px; width: 320px; max-width: 42%;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--ink3); font-size: 13px;
    transition: border-color .18s ease, color .18s ease;
  }
  .searchstub:focus-within { border-color: var(--edge-strong); color: var(--ink2); }
  .searchstub .ss-ico { display: inline-flex; width: 15px; height: 15px; flex: none; }
  .searchstub .ss-ico svg { width: 15px; height: 15px; }
  .searchstub .ss-input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--ink); font: inherit; font-size: 13px;
  }
  .searchstub .ss-input::placeholder { color: var(--ink3); }
  .searchstub kbd {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink2); flex: none;
    padding: 2px 6px; border: 1px solid var(--edge); border-radius: 5px;
  }
  /* Explore rail reuses the Command .nav-item look; the surface glyph sits in the
     icon slot (sized to match the 18px SVG icons of the Command rail). */
  .nav-item .nav-glyph {
    width: 18px; height: 18px; flex: none; display: inline-flex;
    align-items: center; justify-content: center; font-size: 14px; line-height: 1; opacity: .9;
  }
  .nav-item[aria-current="page"] .nav-glyph { opacity: 1; color: var(--acc); }
  /* Explorer surface — centred in the page and wider than the default surface
     column (overrides the 920/900 surface widths for the search experience). */
  .doc-surface-main.explorer-surface { width: 100%; max-width: 1240px; margin: 0 auto; }
  .doc-surface-main.explorer-surface .explorer-region { max-width: 100%; }
  .explorer-region.explorer-empty { min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .explorer-region .explorer-controls { max-width: 1120px; width: 100%; margin: 0 auto; }
  .explorer-region .explorer-results,
  .explorer-region .explorer-detail { max-width: 1120px; width: 100%; margin: 0 auto; }
  .explorer-region.explorer-empty .explorer-results { text-align: center; }
  /* Result cards are clickable → open the detail page. */
  .explorer-card { cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .explorer-card:hover { border-color: var(--edge-strong); background: var(--surface); }
  .explorer-back { margin-bottom: 14px; }
  .explorer-detail-head { display: flex; align-items: baseline; gap: 12px; }
  .explorer-detail-head h2 { margin: 0; font-size: 20px; font-weight: 650; }

  .health { gap: 8px; }
  .health .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); flex: none; }
  .health.ok .dot { background: var(--ok); }
  .health.degraded .dot { background: var(--warn); }
  .health.down .dot { background: var(--crit); }

  .content { padding: 26px 28px 48px; }

  /* ---- Rings prototype embed --------------------------------------------
     The rings-clock landing mock renders in an isolated iframe (base64 data:
     URL). Cancel the .content padding so the full-bleed prototype fills the
     surface below the topbar; the mock owns its own internal scroll. */
  .rings-region-host { margin: -26px -28px -48px; height: calc(100vh - 72px); min-height: 520px; }
  .rings-frame { display: block; width: 100%; height: 100%; border: 0; background: #0b0d13; }

  /* ---- Stat tiles (Overwatch boot readout) ------------------------------ */
  .stats {

    gap: 12px; margin-bottom: 26px;
  }
  .stat {
    padding: 14px 16px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  }

  .degraded-card {

  }

  /* ---- Destination card grid -------------------------------------------- */
  .section-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--ink3); font-weight: 600; margin: 0 0 12px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(244px, 1fr)); gap: 14px; }
  .card {
    padding: 16px 18px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);

  }

    background: var(--surface2); border: 1px solid var(--edge); color: var(--acc);

  .card .soon {
    align-self: flex-start; margin-top: 2px;
    font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
    color: var(--trust); background: color-mix(in srgb, var(--trust) 14%, transparent);

  /* ---- Sub-nav pill row (destination → pages) --------------------------- */
  .subnav {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px;
    padding-bottom: 16px; border-bottom: 1px solid var(--edge);
  }
  /* Sub-nav page pills — layout only; the glass look + current state come from
     the shared nav-family ruleset above (squarer, edge → edge-strong, accent on
     the current page — no longer a rounded solid-accent fill). */
  .pill {
    min-height: 36px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 500; font-size: 13px;
  }
  .pill svg { width: 16px; height: 16px; flex: none; opacity: .9; }

  /* ---- Page card grid + control DSL ------------------------------------- */
  .page-host { min-height: 40px; }
  .v2grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; align-items: start; }
  .v2card {
    padding: 16px 18px; border: 1px solid var(--edge); border-radius: var(--radius);

  .v2card-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--ink2); }
  .v2card-body { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .v2card-body:empty { margin-top: 0; }

  .ctl-row { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .ctl-label { font-size: 11.5px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
  .ctl-desc { margin: 0; font-size: 12px; color: var(--ink3); line-height: 1.45; }
  .ctl-input {
    width: 100%; min-height: 40px; padding: 8px 11px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--ink); font: inherit;
  }
  .ctl-input.mono { font-family: var(--font-mono); font-size: 12.5px; }
  .ctl-textarea { min-height: 68px; resize: vertical; line-height: 1.5; }
  .ctl-input:disabled { opacity: .72; cursor: not-allowed; }
  .ctl-input::placeholder { color: var(--ink3); }
  /* Native <select> theming: a custom chevron replaces the OS control art, and a
     theme-matched `color-scheme` (set per theme below) fixes the broken light /
     blue popup + option list in dark mode. Options are explicitly re-coloured too
     (Chromium/Windows honours these on the option list). */
  .ctl-select {
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    padding-right: 32px; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237E8CA0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center;
  }
  .ctl-select:hover { border-color: var(--edge-strong); }
  .ctl-select:focus-visible { border-color: var(--acc); outline: none; }
  .ctl-select option { background: var(--surface); color: var(--ink); }

  .ctl-info {
    display: flex; align-items: baseline; gap: 12px; justify-content: space-between;
    padding: 8px 10px; border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  .ctl-info-k { font-size: 12px; color: var(--ink3); font-weight: 500; flex: none; }
  .ctl-info-v { font-size: 12.5px; color: var(--ink); text-align: right; word-break: break-word; font-variant-numeric: tabular-nums; }
  .runtime-capability-status[data-capability-availability="unavailable"],
  .runtime-capability-status[data-capability-availability="degraded"] { border-color: var(--warn); }
  .runtime-capability-status[data-capability-availability="unknown"] .ctl-info-v { color: var(--ink3); }

  /* ---- LED toggle — ported from the legacy console .active-toggle -----------
     (crates/corecruxd/console/index.html:388-392). A compact squarer chip with
     an 8px LED dot that glows when on. The v2 DSL `toggle` renders this: LED +
     label, family shape (var(--radius-sm), NOT a rounded 999px pill). On-state
     (.on, set from control.v) = accent border + a glowing --ok LED (index.html
     used --run; the operator asked for --ok here); off = an --ink3 LED. The
     glow is a static box-shadow — no animation, so it survives reduced-motion
     untouched. Toggle semantics/gating are unchanged: mut toggles stay
     operator-gated and disabled (the input is disabled by applyMutationGate). */
  .ctl-toggle {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    padding: 5px 11px; border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--ink2);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  .ctl-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .ctl-toggle:hover { color: var(--ink); border-color: var(--edge-strong); }
  .ctl-toggle .led {
    width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ink3);
    transition: background .18s ease, box-shadow .18s ease;
  }
  .ctl-toggle.on { color: var(--ink); border-color: var(--acc); }
  .ctl-toggle.on .led { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
  .ctl-toggle input:disabled ~ .ctl-toggle-label { opacity: .72; }
  .ctl-toggle-label { font-size: 12.5px; color: inherit; }

  /* ---- Unified buttons — exactly two families console-wide ---------------
     Every button in the console is one of two families:
       .btn-quiet   — the nav-item look (transparent → var(--surface2) on hover,
                      1px var(--edge) → var(--edge-strong), radius-sm, 44px, 150–
                      300ms). Used for the DSL `btn`, page-level buttons, deep-
                      machinery links, chart range toggles, and the gate "return".
       .btn-primary — the approve gradient (--approve-a/-b/-ink). Used only where
                      an action is the primary affirmative (the gate "Approve").
     `.danger` on .btn-quiet is a colour cue (crit text/edge), not a third family. */
  /* Button box model. .btn-quiet's glass tint (bg/border/hover/pressed) comes
     from the shared nav-family ruleset near the rail; this only owns the button
     geometry + font. .btn-primary keeps its own (gradient) surface below. */
  .btn-primary, .btn-quiet {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius-sm);
    font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
    text-decoration: none;
    transition: background .2s ease, color .2s ease, border-color .2s ease, filter .2s ease;
  }
  .btn-primary svg, .btn-quiet svg { width: 15px; height: 15px; flex: none; }
  .btn-quiet.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); }
  .btn-primary { background: linear-gradient(180deg, var(--approve-a), var(--approve-b)); color: var(--approve-ink); border: 1px solid transparent; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
  .btn-primary:disabled, .btn-quiet:disabled { opacity: .55; cursor: not-allowed; }
  /* In a stacked control row a button hugs the start rather than stretching. */
  .ctl-row > .btn-primary, .ctl-row > .btn-quiet { align-self: flex-start; }

  .gate-tag {
    margin-left: 8px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
    color: var(--trust); background: color-mix(in srgb, var(--trust) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--trust) 30%, transparent); padding: 1px 7px; border-radius: 999px;
  }
  .ctl-row.is-gated, .exp.is-gated { position: relative; }
  .capability-reason {
    margin: 8px 0 0; padding: 8px 10px;
    color: var(--ink2); background: color-mix(in srgb, var(--warn) 8%, var(--surface));
    border-left: 3px solid var(--warn); border-radius: var(--radius-sm);
    font-size: 12px; line-height: 1.45;
  }
  .doc-card.is-capability-disabled { flex-wrap: wrap; }
  .doc-card.is-capability-disabled > .capability-reason { flex-basis: 100%; }

  /* M13b live-write harness: result line + two-step confirm dialog. */
  .wired-out { margin-top: 6px; }
  .wired-result { margin: 0; font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .wired-result.is-ok { color: var(--ok); }
  .wired-result.is-err { color: var(--crit); }

    margin-top: 6px; padding: 10px 12px; border-radius: 10px;

  .wired-confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .ctl-bar { display: flex; flex-direction: column; gap: 6px; }
  .ctl-bar-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink2); }
  .ctl-bar-val { color: var(--ink); font-variant-numeric: tabular-nums; }

  .ctl-bar-fill { height: 100%; background: var(--acc); border-radius: 999px; }

  /* Gradient bar fills (Sessions token/progress bars) — a horizontal gradient
     reading cool→accent for progress and accent→warm for token burn. */
  .ctl-bar-fill.grad-prog { background: linear-gradient(90deg, var(--ok), var(--acc)); }
  .ctl-bar-fill.grad-tok { background: linear-gradient(90deg, var(--acc), var(--warn)); }

  /* ---- ExecPlans kanban board (cx-work) --------------------------------- */
  .cvx-kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 6px; }
  .cvx-kcol { flex: 1 1 0; min-width: 224px; display: flex; flex-direction: column; gap: 10px; }

  .cvx-kcol-body { display: flex; flex-direction: column; gap: 10px; min-height: 8px; }
  .cvx-kempty { margin: 0; font-size: 12px; color: var(--ink3); padding: 8px 2px; }
  .cvx-kcard {
    position: relative; overflow: hidden; padding: 11px 13px 10px 15px; display: flex; flex-direction: column; gap: 7px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--card-shadow);
  }

  .cvx-kcard[data-strip="in_progress"]::before { background: var(--acc); }

  .cvx-krisk.risk-high { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); background: color-mix(in srgb, var(--crit) 12%, transparent); }
  .cvx-krisk.risk-medium { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }

  .cvx-kfill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ok), var(--acc)); }
  .cvx-kprogv { font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--ink2); flex: none; }
  .cvx-kcard-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 1px; }

  /* ---- Session cards (cx-sessions) — token/progress gradient bars -------- */
  .sess-card {

  }

  .sess-chip-plan { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 34%, transparent); background: color-mix(in srgb, var(--acc) 11%, transparent); }
  .sess-chip-pass { color: var(--trust); border-color: color-mix(in srgb, var(--trust) 30%, transparent); background: color-mix(in srgb, var(--trust) 11%, transparent); }

  .ctl-rpcout {
    margin: 0; padding: 12px; min-height: 90px; max-height: 300px; overflow: auto;

  /* ---- List rows — legacy list-page language ported (item 3b) --------------
     Ported from the legacy searchable list rows (.sp-exp / .sp-exphead /
     .sp-expname / .sp-expbody, crates/corecruxd/console/index.html:514-524):
     the row rhythm (compact 8px 12px head), the hover treatment (the whole row
     head lifts to a brighter surface on hover), mono metadata columns (the sub
     line is mono + ellipsised, as the legacy .sp-expname small was), and a
     top-border separator between the head and the body. Extracted into v2
     tokens — no legacy var names copied. */
  .exp { border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2); overflow: hidden; }
  .exp-sum {
    list-style: none; cursor: pointer; padding: 8px 12px;

    transition: background .16s ease;

    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .exp-badge {
    font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; font-weight: 600; color: var(--ink2);
    border: 1px solid var(--edge); border-radius: 999px; padding: 1px 8px; background: var(--surface);
  }
  .exp[open] > .exp-sum { border-bottom: 1px solid var(--edge); }
  .exp-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }

  /* ---- Pro-board card strips — one consistent left-strip system ----------
     Work items + plan rows carry a 3px left strip keyed by state, matching the
     Overwatch gate card's ::before geometry (same 3px width, radius-clipped by
     the card). planned → ink3 · in_progress → acc · blocked/review → warn ·
     done → ok. The strip rides inside the rounded, overflow:hidden .exp. */
  .exp-strip { position: relative; }
  .exp-strip::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--ink3); z-index: 1;
  }
  .exp-strip[data-strip="in_progress"]::before { background: var(--acc); }
  .exp-strip[data-strip="blocked"]::before,
  .exp-strip[data-strip="review"]::before { background: var(--warn); }
  .exp-strip[data-strip="done"]::before { background: var(--ok); }
  .exp-strip[data-strip="planned"]::before { background: var(--ink3); }
  .exp-strip > .exp-sum { padding-left: 15px; }

  /* ---- Projects — progressive disclosure + repo card grid (item 2) -------
     "＋ New project" / "＋ Add repos" are nav-family buttons (.btn-quiet) that
     reveal their form on click; the panel collapses on a second click or Esc.
     A project's repos render as a small card grid inside its expanded card. */
  .ctl-disclose { display: flex; flex-direction: column; gap: 8px; }
  .ctl-disclose-btn { align-self: flex-start; }
  .ctl-disclose-panel {
    display: flex; flex-direction: column; gap: 12px; padding: 12px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  .ctl-disclose-panel[hidden] { display: none; }
  .repogrid-host { display: flex; flex-direction: column; gap: 8px; }
  .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .repo-card {
    padding: 10px 12px; border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface); box-shadow: var(--card-shadow); min-width: 0;
  }
  .repo-card-name { font-size: 12.5px; font-weight: 600; color: var(--ink); word-break: break-word; }
  .repo-card-meta { margin-top: 3px; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }

  /* ---- Overwatch landing — Overwatch-concept restyle (post-M6) ----------
     Ports the concept's Overwatch view: a full-width stat-tile row, then a
     7fr/5fr split — NEEDS YOU gate cards on the left, FLEET + ACTIVITY ticker
     on the right. Every colour comes from a theme token (the approve gradient
     via --approve-a/-b/-ink), so all three themes render correctly. Behaviour
     (render.js) is unchanged; this is look only. */
  .ow-landing-region { margin-bottom: 22px; }
  .ow-landing { display: flex; flex-direction: column; gap: 2px; }

  /* Tagline subtitle introducing the Overwatch view (concept apphead sub). */
  .ow-tagline { margin: 0 2px 16px; font-size: 13px; color: var(--ink2); }

  /* Section header: mono · uppercase · wide tracking, with a right-aligned
     count/hint (concept .sechead). */
  .ow-sec { display: flex; align-items: baseline; gap: 10px; margin: 18px 2px 10px; }
  .ow-sec.first { margin-top: 2px; }
  .ow-sec h2 {
    margin: 0; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink2);
  }
  .ow-ct { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .ow-ct:empty { display: none; }
  .ow-sec .ow-link { margin-left: auto; font-size: 11.5px; color: var(--acc); cursor: pointer; text-decoration: none; }
  .ow-sec .ow-link:hover { text-decoration: underline; }

  /* Two-column grid — 7fr left (needs-you → fleet) / 5fr right (page nav). */
  .ow-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  /* Overwatch view tabs (under Daemon-at-a-glance) — swap the content below. */
  .ow-tabs { display: flex; gap: 2px; margin: 8px 0 18px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  .ow-tab {
    min-height: 40px; padding: 0 16px; margin-bottom: -1px;
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink2); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .ow-tab:hover { color: var(--ink); }
  .ow-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
  .ow-tabcontent { min-height: 200px; }
  .ow-col { min-width: 0; }

  /* Stat tiles — reused from the cx-overview build so the readout never drifts
     from the page; styled to the concept .tile look, scoped to the landing so
     the Overview page itself is untouched. */
  .ow-tiles .v2card {
    background: none; border: none; box-shadow: none; backdrop-filter: none;
    -webkit-backdrop-filter: none; padding: 0; min-width: 0;
  }
  .ow-tiles .v2card-h {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink2);
  }
  .ow-tiles .v2card-sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .ow-tiles .v2card-body { margin-top: 12px; }
  .ow-tiles .stats { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); }
  .ow-tiles .stat { padding: 13px 15px; border-radius: var(--radius-sm); }
  .ow-tiles .stat .k {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink3); font-weight: 600;
  }
  .ow-tiles .stat .v { margin-top: 5px; font-size: 23px; letter-spacing: -.02em; }
  .ow-tiles .stat .v small { font-size: 11px; color: var(--ink3); }
  /* Identity tiles (Facts · Sessions · ExecPlans) carry the LEGACY card
     stat-number size — matches index.html renderDash .dash-num (44px/800/-.025em). */
  .ow-tiles .stat.stat-lg .v { font-size: 44px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
  .ow-tiles .stat.stat-lg .v small { display: block; margin-top: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: 0; }
  /* Honest gauge/meter for a REAL ratio tile (Storage free) — the measured
     free-space fraction, never a fabricated series. */
  .ow-tiles .tile-meter { margin-top: 10px; height: 6px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--edge); overflow: hidden; }
  .ow-tiles .tile-meter-fill { height: 100%; background: var(--acc); border-radius: 999px; }

  /* ---- Glance tiles as gradient hero cards (ref: "Today at a glance") -----
     Each card overrides --acc, which recolours BOTH the background wash and the
     area chart (chart-line/fill + meter all read var(--acc)) in one place. The
     appended spark chart is stretched full-bleed along the card bottom. */
  .ow-tiles .stat {
    position: relative; overflow: hidden;
    min-height: 150px; padding: 15px 17px 14px; border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--acc) 24%, var(--edge));
    background:
      radial-gradient(130% 100% at 100% 105%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 62%),
      linear-gradient(158deg, color-mix(in srgb, var(--acc) 11%, var(--surface)), var(--surface) 58%);
  }
  .ow-tiles .stat .k { position: relative; z-index: 1; color: color-mix(in srgb, var(--acc) 55%, var(--ink2)); }
  .ow-tiles .stat .v { position: relative; z-index: 1; }
  /* full-bleed area chart anchored to the card bottom (stretched via
     preserveAspectRatio="none" on the spark svg) */
  .ow-tiles .stat .chart-svg.spark {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 48px; margin: 0; opacity: .92;
  }
  .ow-tiles .stat .chart-line { stroke-width: 2; }
  .ow-tiles .stat .chart-dot { display: none; }
  /* per-card accent hue cycle (top row lands orange · green · violet, matching ref) */
  .ow-tiles .stat:nth-child(6n+1) { --acc: #e8823c; }
  .ow-tiles .stat:nth-child(6n+2) { --acc: #34c790; }
  .ow-tiles .stat:nth-child(6n+3) { --acc: #7c6cf0; }
  .ow-tiles .stat:nth-child(6n+4) { --acc: #4a9ff0; }
  .ow-tiles .stat:nth-child(6n+5) { --acc: #e6608a; }
  .ow-tiles .stat:nth-child(6n+6) { --acc: #d9b23a; }
  /* Glance header row: title left, Day/Week/Month range toggle pushed right. */
  .v2card-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .v2card-head-row .v2card-h { margin: 0; }
  /* Header action button — a "+" (reveal a card below) or ⚙ cog (reveal above). */
  .v2card-head-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .v2card-head-actions .ctl-row.in-head { flex-direction: row; gap: 0; margin: 0; }
  .v2card-head-actions .ctl-row.in-head .ctl-desc { display: none; }
  .v2card-addbtn {
    flex: 0 0 auto; width: 28px; height: 28px; padding: 0; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500; color: var(--ink2);
    background: var(--surface); border: 1px solid var(--edge); border-radius: var(--radius-sm);
    cursor: pointer; transition: color .12s, border-color .12s, background .12s, transform .18s;
  }
  .v2card-addbtn.cog { font-size: 15px; }
  .v2card-addbtn:hover { color: var(--ink); border-color: var(--acc); }
  .v2card-addbtn.is-on { color: var(--acc); border-color: var(--acc); }
  .v2card-addbtn.plus.is-on { transform: rotate(45deg); }
  .v2card-addbtn.cog.is-on { transform: rotate(90deg); }
  .v2card.is-collapsed { display: none; }
  .exp.is-hidden { display: none; }

  /* ---- Site map destination (ported from the unified-shell concept) ------
     A two-column card grid: each destination is a card with a coloured left
     rail (--sec-c), a mono tagline, and a list of pages with provenance chips
     and annotation badges. Closes with the census note. */
  .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .map-sec {
    position: relative; overflow: hidden; padding: 15px 17px 6px;
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
  }
  .map-sec::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--sec-c, var(--acc)); }
  .map-sec > h3 { margin: 0 0 2px; font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 9px; }
  .map-ico { display: inline-flex; width: 16px; height: 16px; color: var(--sec-c, var(--acc)); flex: none; }
  .map-ico svg { width: 16px; height: 16px; }
  .map-h-note { font-family: var(--font-mono); font-size: 9px; color: var(--ink3); font-weight: 500; }
  .map-sec > .tag { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); margin-bottom: 10px; }
  .map-page { padding: 9px 0; border-top: 1px solid var(--edge); }
  .map-page b { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .map-page .why { font-size: 11px; color: var(--ink2); margin-top: 3px; line-height: 1.5; }
  .provs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .prov {
    font-family: var(--font-mono); font-size: 9px; padding: 1.5px 7px; border-radius: 6px;
    border: 1px solid var(--edge); color: var(--ink3); background: var(--surface2);
  }
  .prov.new { border-color: color-mix(in srgb, var(--trust) 35%, transparent); color: var(--trust); }
  .anno { font-family: var(--font-mono); font-size: 8.5px; font-weight: 600; letter-spacing: .1em; padding: 2px 7px; border-radius: 6px; }
  .anno.merge { background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
  .anno.promote { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .anno.new { background: color-mix(in srgb, var(--trust) 15%, transparent); color: var(--trust); }
  .anno.vsw { background: var(--surface2); color: var(--ink2); }
  .anno.adv { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
  .map-note {
    margin-top: 14px; padding: 14px 17px; border-radius: var(--radius);
    border: 1px solid var(--edge); background: var(--surface); box-shadow: var(--card-shadow);
    font-size: 12px; color: var(--ink2); line-height: 1.6;
  }
  .map-note b { color: var(--ink); }
  .map-note .mono { font-family: var(--font-mono); font-size: 10px; color: var(--ink2); }
  @media (max-width: 900px) { .map-grid { grid-template-columns: 1fr; } }

  /* Overwatch page nav (right column) — the nav-family section that replaces the
     suppressed sub-nav pill row. Pills stack; active state via the shared .pill
     rule. 44px targets for the primary nav. */
  .ow-pagenav { display: flex; flex-direction: column; gap: 6px; }
  .ow-pagenav .pill { min-height: 44px; width: 100%; justify-content: flex-start; }

  /* Source chips (which fleet sources answered) + enrich meta chips. */
  .ow-srcchips, .ow-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .ow-chip {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink2); background: var(--surface2);
    border: 1px solid var(--edge); border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }

  /* ---- Gate card (Art.14 human gate) — concept .gate anatomy ------------- */
  .ow-gate {
    position: relative; overflow: hidden; padding: 15px 17px; margin-bottom: 12px;
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    transition: opacity .3s ease, border-color .3s ease;
  }
  .ow-gate::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--warn); }
  .ow-gate.is-resolved::before { background: var(--ok); }
  .ow-gate.is-resolved { opacity: .8; border-color: color-mix(in srgb, var(--ok) 40%, var(--edge)); }
  .ow-gate-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ow-badge {
    font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 7px;
    color: var(--trust); background: color-mix(in srgb, var(--trust) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--trust) 28%, transparent);
  }
  .ow-badge.risk {
    color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent);
    border-color: color-mix(in srgb, var(--warn) 30%, transparent);
  }
  .ow-slug {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ow-gate h3 { margin: 10px 0 3px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .ow-gate-action { font-family: var(--font-mono); font-size: 11px; color: var(--ink2); margin: 0 0 4px; }

  /* Consequences block (only when /v1/actions/enrich returns). */
  .ow-conseq {
    display: flex; flex-direction: column; gap: 6px; margin: 10px 0;
    padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--surface2); border: 1px solid var(--edge);
  }
  .ow-narrative { color: var(--ink2); font-size: 12.5px; margin: 0; line-height: 1.45; }
  .ow-conseq-row { display: flex; gap: 9px; font-size: 12.5px; color: var(--ink2); line-height: 1.4; }
  .ow-conseq-row::before {
    content: ""; flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--trust);
  }
  .ow-conseq-row b { color: var(--ink); font-weight: 600; }

  /* Attribution line — mono, with a mini gradient avatar. */
  .ow-attr {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink3); margin: 10px 0;
  }
  .ow-avatar {
    width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-size: 8px; font-weight: 700; color: #fff; font-family: var(--font-sans);
    background: linear-gradient(135deg, var(--trust), var(--acc));
  }

  /* Action row: primary approve · quiet return · inline note (concept .actions).
     The buttons themselves are the two unified families (.btn-primary /
     .btn-quiet) defined above — this row only owns the layout. */
  .ow-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .ow-note {
    width: 100%; min-height: 40px; margin-top: 8px; padding: 8px 11px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--ink); font: inherit; font-size: 12.5px;
  }
  .ow-note::placeholder { color: var(--ink3); }
  .ow-status:empty { display: none; }
  .ow-status { color: var(--warn); font-size: 12px; margin: 6px 0 0; }
  .ow-await { color: var(--ink3); font-size: 12.5px; margin: 8px 0 0; }

  /* Post-approve done-line (concept .doneline). */
  .ow-done { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ok); margin-top: 4px; }
  .ow-done svg { width: 16px; height: 16px; flex: none; }
  .ow-done.returned { color: var(--warn); }
  .ow-done .ow-hash {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink2);
    background: color-mix(in srgb, var(--ok) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent);
    padding: 2px 8px; border-radius: 7px;
  }

  /* All-clear empty state (concept "all clear — agents unblocked"). */
  .ow-allclear {
    display: flex; align-items: center; gap: 10px; padding: 16px 18px;
    border: 1px solid color-mix(in srgb, var(--ok) 30%, var(--edge)); border-radius: var(--radius);
    background: color-mix(in srgb, var(--ok) 6%, var(--surface));
  }
  .ow-allclear svg { width: 20px; height: 20px; flex: none; color: var(--ok); }
  .ow-allclear b { display: block; font-size: 13.5px; color: var(--ink); }
  .ow-allclear span { font-size: 12px; color: var(--ink3); }

  /* Attention-zone summary (M3b): needs_you rendered as cards below; running /
     awaiting-review shown as a compact grouping readout. */
  .ow-zone-summary {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em;
    color: var(--ink3); margin: 0 0 10px; padding: 6px 10px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  /* Read-only attention cards reuse the .ow-gate chrome; the waiting card takes a
     neutral (trust) stripe to distinguish it from a blocked (warn) plan. */
  .ow-gate.ow-attn-waiting::before { background: var(--trust); }
  /* Inferred marker: the waiting signal is derived (not daemon-backed), so the
     chip reads muted/dashed — a visibly soft, honest signal. */
  .ow-chip.ow-inferred {
    color: var(--ink3); border: 1px dashed var(--edge);
    background: transparent; font-style: italic;
  }

  /* ---- Fleet rows (concept .sess) --------------------------------------- */
  .ow-fleet-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; margin-bottom: 9px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface); box-shadow: var(--card-shadow);
  }
  .ow-dot { width: 8px; height: 8px; flex: none; margin-top: 5px; border-radius: 50%; background: var(--ok); }
  .ow-dot.pulse { animation: owPulse 2s ease-in-out infinite; }
  .ow-dot.idle { background: var(--ink3); }
  @keyframes owPulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 14%, transparent); } }
  .ow-fleet-meta { min-width: 0; flex: 1; }
  .ow-fleet-meta b { font-size: 13px; display: block; }
  .ow-focus {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink3); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ow-leases { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .ow-lease {
    font-family: var(--font-mono); font-size: 9px; color: var(--ink2);
    background: var(--surface2); border: 1px solid var(--edge); padding: 2px 7px; border-radius: 6px;
  }
  .ow-lease.ov {
    color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent);
    border-color: color-mix(in srgb, var(--warn) 35%, transparent);
  }
  .ow-fleet-side { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); text-align: right; flex: none; max-width: 42%; }
  .ow-fleet-side div { margin-top: 2px; word-break: break-word; }

  /* ---- Activity ticker (concept trust ticker) --------------------------- */
  .ow-ticker {
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    padding: 4px 14px;
  }
  .ow-tick { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--edge); font-size: 12px; }
  .ow-tick:last-child { border-bottom: none; }
  .ow-tick-label { color: var(--ink2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ow-tick-ts { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); flex: none; }
  .ow-hash {
    font-family: var(--font-mono); font-size: 10px; color: var(--trust);
    background: color-mix(in srgb, var(--trust) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--trust) 25%, transparent);
    padding: 2px 8px; border-radius: 7px; white-space: nowrap; flex: none;
  }

  /* ---- Engine-mediated card (right column; only when it answers) -------- */
  .ow-engine {
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    padding: 12px 15px; display: flex; flex-direction: column; gap: 8px;
  }
  .ow-body .ctl-info { margin-bottom: 0; }

  /* Phone (<720px): columns stack, action buttons go full-width. */
  @media (max-width: 720px) {
    .ow-cols { grid-template-columns: 1fr; }
    .ow-actions .btn-primary, .ow-actions .btn-quiet { flex: 1; }
    .ow-fleet-side { max-width: none; }
  }

  /* ---- Charts (single-series area/line, no dependency) ------------------
     Rendered by CruxRender.areaChart(). One series only: a 2px var(--acc)
     stroke over an area fill (svg gradient --acc→transparent), faint var(--edge)
     gridlines, an emphasised endpoint dot, and NO legend (the title names the
     series). Value labels are ink tokens, tabular-nums — never the series
     colour. Range = a row of three .btn-quiet toggles above the chart. */
  .chart-card {
    padding: 16px 18px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    display: flex; flex-direction: column; gap: 12px; position: relative; min-width: 0;
  }
  .chart-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .chart-title { margin: 0; font-size: 14.5px; font-weight: 650; }
  .chart-sub { margin: 0; font-size: 12px; color: var(--ink2); }
  .chart-latest {
    margin-left: auto; font-variant-numeric: tabular-nums;
    font-size: 18px; font-weight: 650; color: var(--ink);
  }
  .chart-range { display: flex; gap: 6px; flex-wrap: wrap; }
  .chart-range .btn-quiet { min-height: 30px; padding: 0 12px; font-size: 12px; }
  .chart-figure { width: 100%; }
  .chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-grid { stroke: var(--edge); stroke-width: 1; }
  .chart-line { fill: none; stroke: var(--acc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-dot { fill: var(--acc); }
  .chart-dot-ring { fill: none; stroke: var(--acc); stroke-width: 1.5; opacity: .35; }
  .chart-axis { fill: var(--ink3); font-family: var(--font-mono); font-size: 9px; font-variant-numeric: tabular-nums; }
  .chart-empty { font-size: 12.5px; color: var(--ink3); padding: 18px 2px; }
  .spark { display: block; width: 76px; height: 24px; margin-top: 8px; overflow: visible; }
  .spark .chart-line { stroke-width: 1.6; }

  /* Demo-mode corner chip — marks any panel whose data came from fixtures. */
  .demo-chip {
    position: absolute; top: 10px; right: 12px;
    font-family: var(--font-mono); font-size: 8.5px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    border-radius: 6px; padding: 1px 6px; pointer-events: none;
  }
  .ow-panel { position: relative; }
  .demo-chip.inline { position: static; align-self: flex-start; }

  /* ---- Presentation mode: Standard | Professional (M8) ------------------
     Mode is PRESENTATION only — the security boundary is posture, which is
     independent of mode (a customer sees the SAME gated surface in either
     mode). Standard is the curated forward-facing view; Professional adds
     legacy-style density, extra mono metadata on list rows, Pro-only sections
     /pages, and the full sub-nav pill row. Every colour is a theme token. */

  /* Topbar segmented control (nav-family look, aria-pressed), sat left of the
     chip cluster in .topbar-right. */
  .modeseg {
    display: inline-flex; gap: 3px; padding: 3px; flex: none;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  .modeseg-btn {
    min-height: 26px; padding: 0 11px; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink2);
    cursor: pointer; white-space: nowrap;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .modeseg-btn:hover:not(:disabled) { color: var(--ink); }
  .modeseg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--edge-strong); }
  .modeseg-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Extra mono metadata on list rows — hidden in Standard, revealed in Pro. */
  .exp-meta {
    display: none; font-family: var(--font-mono); font-size: 10px; color: var(--ink3);
    min-width: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Pro-mode dashboard strip — the home for the legacy CX-landing top cards
     (daemon · execplans · token usage · MCP gateway). Rendered by render.js
     renderDashStrip() only in Professional mode. */
  .ow-dashstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0 0 18px; }
  .ow-dashcard {
    position: relative; padding: 13px 15px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    display: flex; flex-direction: column; gap: 7px; min-width: 0;
  }
  .ow-dashcard-k { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); }
  .ow-dashcard-v { font-size: 20px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; word-break: break-word; }
  .ow-dashcard-chips { display: flex; flex-wrap: wrap; gap: 5px; }

  /* Professional density — tighter rhythm across cards / rows / tiles, and the
     mono metadata revealed. Standard keeps the roomier forward-facing look. */
  :root[data-mode="professional"] .v2card { padding: 12px 14px; }
  :root[data-mode="professional"] .v2card-body { gap: 8px; margin-top: 10px; }
  :root[data-mode="professional"] .v2grid { gap: 10px; }
  :root[data-mode="professional"] .exp-sum { padding: 6px 10px; }
  :root[data-mode="professional"] .exp-strip > .exp-sum { padding-left: 13px; }
  :root[data-mode="professional"] .exp-body { padding: 8px 10px; gap: 7px; }
  :root[data-mode="professional"] .stat { padding: 10px 12px; }
  :root[data-mode="professional"] .card { padding: 12px 14px; }
  :root[data-mode="professional"] .ow-fleet-row { padding: 9px 11px; margin-bottom: 7px; }
  :root[data-mode="professional"] .ow-gate { padding: 12px 14px; }
  :root[data-mode="professional"] .exp-meta { display: inline-block; }

  /* ---- Documents mode (M10) — the console-as-reader ---------------------
     Ported COMPOSITION + MATERIAL from the WebCrux Proof reader
     (webcrux-surfaces-demo-v3.jsx): the Section/Card reading composition, the
     EvidenceCard side surface, Receipt chips, and coverage/progress affordances
     — rebuilt in v2 tokens (every colour is a theme token, so all three themes
     render). Under [data-mode="documents"] the console becomes a READER: the
     rail slims to a document tree, the main column is a ~72ch reading surface,
     and the right panel (≥1280px; stacked below on phone) is the evidence
     material. Mode is presentation only — posture is untouched. */

  /* The rail hosts the document tree in place of the destination nav. */
  :root[data-mode="documents"] .rail nav { gap: 1px; }
  .doc-tree-group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-family: var(--font-mono);
    color: var(--ink3); font-weight: 600; padding: 14px 8px 5px;
  }
  .doc-tree-item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; text-align: left; min-height: 40px; padding: 7px 10px;
    color: var(--ink2); background: transparent;
    border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer;
    transition: background .16s ease, color .16s ease, border-color .16s ease;
  }
  .doc-tree-item:hover { background: var(--surface2); color: var(--ink); border-color: var(--edge-strong); }
  .doc-tree-item[aria-current="page"] { background: var(--surface2); color: var(--ink); border-color: var(--edge-strong); }
  .doc-tree-item[aria-current="page"] .doc-tree-label { color: var(--acc); }
  .doc-tree-label { font-weight: 600; font-size: 12.5px; }
  .doc-tree-sub {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-tree-empty { padding: 8px 10px; }
  :root[data-rail="collapsed"] .doc-tree-sub, :root[data-rail="collapsed"] .doc-tree-group { display: none; }

  /* 3-zone reader inside the content column: reading surface + evidence panel.
     A single column below 1280px (the evidence stacks under the reading). */
  .doc-reader { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
  @media (min-width: 1280px) {
    .doc-reader { grid-template-columns: minmax(0, 1fr) 320px; }
    .doc-evidence { position: sticky; top: 92px; }
  }

  /* Reading surface — a ~72ch measure with generous line-height (the ported
     Proof reading column). 72ch is the reading measure token/rule. */
  .doc-main { min-width: 0; max-width: 72ch; }
  .doc-read-head { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--edge); }
  .doc-read-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .doc-read-sub { margin: 4px 0 0; font-size: 13px; color: var(--ink2); }
  .doc-read-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  /* Section micro-label (ported Section) — mono · uppercase · wide tracking. */
  .doc-sec {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em;
    font-family: var(--font-mono); color: var(--ink3);
    margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--edge);
  }
  .doc-card {
    padding: 14px 16px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    display: flex; flex-direction: column; gap: 10px;
  }
  /* A reading chunk with a state-keyed left strip (matches the pro-board 3px). */
  .doc-chunk { position: relative; padding: 10px 14px; margin-bottom: 6px; border-radius: var(--radius-sm); }
  .doc-chunk::before { content: ""; position: absolute; inset: 2px auto 2px 0; width: 3px; border-radius: 2px; background: var(--ink3); }
  .doc-chunk-ok::before { background: var(--ok); }
  .doc-chunk-warn::before { background: var(--warn); }
  .doc-chunk-crit::before { background: var(--crit); }
  .doc-chunk-text { margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink); }
  .doc-card .doc-chunk-text + .doc-chunk-text { margin-top: 10px; }
  .doc-chunk-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .doc-chunk-claims { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); }

  /* Coverage / label badge (ported CovBadge/Badge) — squarer family pill. */
  .doc-cov {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    color: var(--ink2); background: var(--surface2); border: 1px solid var(--edge);
  }
  .doc-cov-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .doc-cov-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .doc-cov-crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
  .doc-cov-trust { color: var(--trust); background: color-mix(in srgb, var(--trust) 12%, transparent); border-color: color-mix(in srgb, var(--trust) 30%, transparent); }

  /* Evidence panel (right zone). */
  .doc-evidence { min-width: 0; display: flex; flex-direction: column; }
  .doc-ev-host { display: flex; flex-direction: column; gap: 8px; }
  /* EvidenceCard (ported) — a card with a role-keyed left strip. */
  .doc-evcard {
    position: relative; padding: 11px 13px 11px 15px; margin-bottom: 8px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm);
    background: var(--surface); box-shadow: var(--card-shadow);
  }
  .doc-evcard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; border-radius: 2px 0 0 2px; background: var(--ink3); }
  .doc-ev-ok::before { background: var(--ok); }
  .doc-ev-trust::before { background: var(--trust); }
  .doc-ev-warn::before { background: var(--warn); }
  .doc-evcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .doc-evcard-domain { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--acc); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-evcard-quote {
    font-size: 11.5px; font-style: italic; line-height: 1.5; color: var(--ink);
    padding: 5px 9px; margin-bottom: 6px; border-radius: 0 6px 6px 0;
    border-left: 2px solid color-mix(in srgb, var(--acc) 40%, transparent);
    background: color-mix(in srgb, var(--acc) 7%, transparent);
  }
  .doc-evcard-summary { font-size: 11.5px; line-height: 1.5; color: var(--ink2); margin-bottom: 6px; }
  .doc-evcard-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 10px; color: var(--ink3); }
  .doc-evcard-ts { font-family: var(--font-mono); font-size: 9px; color: var(--ink3); flex: none; }

  /* Receipt chip (ported Receipt) — mono ⛓ hash rows. */
  .doc-receipt {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin-bottom: 6px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  .doc-receipt-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--trust); flex: none; }
  .doc-receipt-label { font-size: 11px; color: var(--ink2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-receipt-ts { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--ink3); flex: none; }

  /* Phone sources sheet — the reader's document list as a collapsible sheet.
     Hidden on the desktop tier (the rail tree is the source list there). */
  .doc-sources-sheet { display: none; }
  @media (max-width: 720px) {
    .doc-sources-sheet {
      display: block; margin-bottom: 16px;
      border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
    }
    .doc-sources-summary {
      list-style: none; cursor: pointer; padding: 11px 14px; min-height: 44px;
      display: flex; align-items: center; font-weight: 600; font-size: 13px; color: var(--ink);
    }
    .doc-sources-summary::-webkit-details-marker { display: none; }
    .doc-sources-sheet[open] .doc-sources-summary { border-bottom: 1px solid var(--edge); }
    .doc-sources-sheet .doc-tree { padding: 6px 8px 10px; }
    .doc-main { max-width: none; }
  }

  /* ---- Documents-mode surfaces (M12) — the 11 ported WebCrux Proof surfaces
     (webcrux-surfaces-demo-v3.jsx) rebuilt in v2 tokens. Every colour below is a
     theme token (var(--…)) — the smoke (check 33) scans this delimited block and
     rejects any hex/rgb literal. The composition (Section/Card rows, stat tiles,
     coloured dots/badges, state strips) mirrors the JSX micro-kit. */
  /* M12-SURFACE-CSS-START */
  .doc-surface-wrap { grid-template-columns: 1fr; }
  @media (min-width: 1280px) { .doc-surface-wrap { grid-template-columns: 1fr; } }
  .doc-surface-main { min-width: 0; max-width: 920px; }
  .doc-surface-note { margin: 4px 0 0; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .doc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); flex: none; }
  .doc-dot-ok { background: var(--ok); }
  .doc-dot-warn { background: var(--warn); }
  .doc-dot-crit { background: var(--crit); }
  .doc-dot-trust { background: var(--trust); }
  .doc-tiles { display: flex; flex-wrap: wrap; gap: 22px; }
  .doc-tile-v { font-size: 20px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .doc-tile-k { font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .doc-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .doc-row-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }
  .doc-row-text { font-size: 12.5px; color: var(--ink2); line-height: 1.55; }
  .doc-arrow { color: var(--ink3); font-size: 13px; padding: 0 2px; }
  /* A list/detail card (ported <Card> row) — a native disclosure. */
  .doc-list-card { cursor: default; }
  .doc-list-card > .doc-list-sum { list-style: none; cursor: pointer; display: block; }
  .doc-list-card > .doc-list-sum::-webkit-details-marker { display: none; }
  .doc-surface-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .doc-surface-row-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .doc-surface-row-side { flex: none; text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .doc-list-body { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--edge); }
  .doc-list-card[open] > .doc-list-sum { margin-bottom: 2px; }
  /* State-keyed 3px left strip (shares the pro-board geometry). */
  .doc-strip { position: relative; padding-left: 16px; }
  .doc-strip::before { content: ""; position: absolute; inset: 2px auto 2px 0; width: 3px; border-radius: 2px; background: var(--ink3); }
  .doc-strip-ok::before { background: var(--ok); }
  .doc-strip-warn::before { background: var(--warn); }
  .doc-strip-crit::before { background: var(--crit); }
  .doc-strip-trust::before { background: var(--trust); }
  .doc-claim-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--edge); }
  .doc-claim-row .doc-chunk-claims { margin-left: auto; }
  .doc-dep-node { padding: 8px 10px; margin-bottom: 4px; border-left: 1px solid var(--edge); display: flex; flex-direction: column; gap: 5px; }
  .doc-btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .doc-surface-empty { padding: 26px 16px; text-align: center; border: 1px dashed var(--edge); border-radius: var(--radius-sm); background: var(--surface2); }
  .doc-diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .doc-diff-row { display: grid; grid-template-columns: 84px 1fr 1fr 52px; align-items: center; gap: 8px; }
  @media (max-width: 560px) { .doc-diff-grid { grid-template-columns: 1fr; } .doc-diff-row { grid-template-columns: 1fr; } }
  /* M12-SURFACE-CSS-END */

  /* ---- Explorer (M11) — corpus search surface --------------------------
     A query box + a Local | WikiCrux backend toggle (nav-family .btn-quiet,
     aria-pressed) + a budget control, above a results column of cards. Cards
     reuse .doc-card material; every field shown is real. Reads only, so it is
     posture-independent. */
