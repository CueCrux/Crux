  .explorer-region { display: flex; flex-direction: column; gap: 16px; max-width: 900px; }
  .explorer-controls { display: flex; flex-direction: column; gap: 12px; }
  .explorer-search { display: flex; gap: 10px; flex-wrap: nowrap; align-items: center; }
  .explorer-input {
    flex: 1 1 auto; min-width: 0; min-height: 42px; padding: 0 14px;
    background: var(--surface2); border: 1px solid var(--edge); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 14px;
  }
  .explorer-input:focus { border-color: var(--edge-strong); outline: none; }
  /* Local | WikiCrux backend selector — a segmented toggle pinned to the right end. */
  .explorer-toggle {
    display: inline-flex; gap: 3px; flex: none; padding: 3px;
    border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface2);
  }
  .explorer-toggle .btn-quiet {
    min-height: 34px; padding: 0 14px; font-size: 12.5px;
    border: 1px solid transparent; border-radius: 8px;
  }
  .explorer-toggle .btn-quiet[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); border-color: var(--edge-strong);
  }
  @media (max-width: 620px) { .explorer-search { flex-wrap: wrap; } }
  .explorer-budget { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink3); }
  .explorer-budget input {
    width: 84px; min-height: 32px; padding: 0 8px; background: var(--surface2);
    border: 1px solid var(--edge); border-radius: 6px; color: var(--ink); font: inherit;
  }
  .explorer-results { display: flex; flex-direction: column; gap: 10px; }
  .explorer-card {
    padding: 12px 14px; border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .explorer-card-top { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  .explorer-card-title { font-weight: 600; font-size: 14px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .explorer-card-snippet { font-size: 13px; color: var(--ink2); line-height: 1.5; overflow-wrap: anywhere; }
  .explorer-card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---- Accessibility & motion ------------------------------------------- */
  .skip {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    padding: 10px 14px; background: var(--acc); color: #fff; border-radius: 0 0 8px 0; font-weight: 600;
  }
  .skip:focus { left: 0; }
  *:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
  a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }

  /* ---- Canvas (M9) — size-adaptive board + relation graph ---------------
     The board is a CSS-grid of self-contained cells (auto-fill + span classes);
     the tier (xs/s/m/l/xl) is picked by the pure canvasTier() and drives which
     widgets appear — a 4K+ viewport fills the full board. The board itself is
     the WebCrux tile canvas (M14, .cvx-* below): onion-layer tiles you drag,
     pan, and expand in place. The graph is a no-dependency inline SVG with
     drag-pan + wheel-zoom; every node colour is a theme token. */
  .canvas-region { display: flex; flex-direction: column; gap: 16px; }
  .canvas-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .canvas-seg { flex: none; }
  /* ---- WebCrux tile canvas (M14) — §07 interaction grammar, ported ------- */
  /* The measured values ARE the spec: easing cubic-bezier(.16,1,.3,1)
     everywhere; entry scale(.92)+8px rise .4s (70ms stagger) · exit .25s;
     hover lift −3px; sibling dim blur(18px) saturate(.2) opacity .15; 20px
     snap-grid dots; form/stack breakpoints 768/640. Every colour resolves to a
     theme token — the three themes restyle the canvas wholesale. */
  .cvx-board { min-width: 0; }
  .cvx-board-meta { margin-top: 8px; }
  .cvx-surface {
    position: relative; overflow: hidden; cursor: grab;
    height: calc(100vh - 210px); min-height: 540px;
    border-radius: var(--radius);
  }
  .cvx-surface.cvx-panning { cursor: grabbing; }
  .cvx-surface.cvx-has-exp { cursor: default; }
  /* Backdrop darkens softly behind an expanded tile. */
  .cvx-surface::before {
    content: ''; position: absolute; inset: 0; background: var(--bg);
    opacity: 0; z-index: 1; pointer-events: none; transition: opacity .4s ease;
  }
  .cvx-surface.cvx-has-exp::before { opacity: .3; }
  :root[data-theme="light"] .cvx-surface.cvx-has-exp::before { opacity: .15; }
  /* The 20px snap grid — tile positions round to these cells. */
  .cvx-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle, var(--edge) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  /* The pannable layer: eased for auto-pan on expand; transition OFF while
     actively panning so the drag tracks 1:1; GPU-promoted only during pan/
     expand (a permanent will-change blurs composited text). */
  .cvx-layer {
    position: relative; width: 100%; min-height: 100%; z-index: 2;
    transition: transform .6s cubic-bezier(.16,1,.3,1);
  }
  .cvx-surface.cvx-has-exp .cvx-layer,
  .cvx-surface.cvx-panning .cvx-layer { will-change: transform; }
  .cvx-surface.cvx-panning .cvx-layer { transition: none; }
  /* ── Tiles ── */
  .cvx-node {
    position: absolute; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--edge); border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    cursor: grab; user-select: none; -webkit-user-select: none; outline: none;
    transition:
      transform .4s cubic-bezier(.16,1,.3,1),
      box-shadow .2s ease,
      opacity .4s ease,
      filter .4s ease,
      width .5s cubic-bezier(.16,1,.3,1),
      height .5s cubic-bezier(.16,1,.3,1),
      top .5s cubic-bezier(.16,1,.3,1),
      left .5s cubic-bezier(.16,1,.3,1);
    animation: cvx-enter .4s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cvx-enter {
    from { opacity: 0; transform: scale(.92) translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .cvx-node:hover:not(.cvx-exp):not(.cvx-dim):not(.cvx-dragging):not(.cvx-chromeless) {
    transform: translateY(-3px);   /* the Aurora lift */
    border-color: var(--edge-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 20px 48px rgba(0,0,0,.5);
  }
  :root[data-theme="light"] .cvx-node:hover:not(.cvx-exp):not(.cvx-dim):not(.cvx-dragging):not(.cvx-chromeless) {
    box-shadow: 0 2px 4px rgba(27,39,51,.06), 0 24px 52px rgba(27,39,51,.16);
  }
  .cvx-node:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .cvx-node.cvx-dragging { cursor: grabbing; z-index: 50; transition: box-shadow .15s ease; }
  .cvx-node.cvx-exp {
    cursor: default; z-index: 100; border-color: var(--edge-strong);
    box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 8px 16px -4px rgba(0,0,0,.2),
      0 20px 40px -8px rgba(0,0,0,.35), 0 40px 80px -16px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] .cvx-node.cvx-exp {
    box-shadow: 0 0 0 1px rgba(27,39,51,.06), 0 8px 16px -4px rgba(27,39,51,.10), 0 24px 52px rgba(27,39,51,.16);
  }
  /* Sibling dim on expand — blur 18px · saturate .2 · opacity .15 (measured). */
  .cvx-node.cvx-dim {
    filter: blur(18px) saturate(.2) brightness(.6);
    opacity: .15; transform: scale(.9); pointer-events: none;
  }
  /* Exit — .25s out (tiles leaving on a re-flow). */
  .cvx-node.cvx-leave {
    opacity: 0; transform: scale(.95); pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  /* Accent top edge (3px) — keyed to theme tokens via data-accent. */
  .cvx-accent {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--cvx-acc, var(--ink3)); opacity: .8; z-index: 3;
  }
  .cvx-node[data-accent="acc"] { --cvx-acc: var(--acc); }
  .cvx-node[data-accent="ok"] { --cvx-acc: var(--ok); }
  .cvx-node[data-accent="warn"] { --cvx-acc: var(--warn); }
  .cvx-node[data-accent="crit"] { --cvx-acc: var(--crit); }
  .cvx-node[data-accent="trust"] { --cvx-acc: var(--trust); }
  .cvx-content {
    padding: 13px 15px; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .cvx-node.cvx-exp .cvx-content { overflow-y: auto; padding: 15px 17px; }
  .cvx-eyebrow { font: 600 9.5px var(--font-mono); letter-spacing: .12em; color: var(--ink3); text-transform: uppercase; }
  .cvx-title { margin: 0; font-size: 15.5px; font-weight: 750; letter-spacing: -.015em; color: var(--ink); line-height: 1.25; }
  .cvx-hero .cvx-title { font-size: 19px; }
  .cvx-sub { margin: 0; font-size: 11.5px; font-weight: 500; color: var(--cvx-acc, var(--ink2)); line-height: 1.4; }
  .cvx-node[data-accent="neutral"] .cvx-sub { color: var(--ink2); }
  .cvx-body {
    margin: 0; font-size: 12px; color: var(--ink2); line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  }
  .cvx-node.cvx-exp .cvx-body { display: block; -webkit-line-clamp: unset; overflow: visible; }
  /* Drill-in body — hidden at base level, revealed on expand. */
  .cvx-expbody { display: none; }
  .cvx-node.cvx-exp .cvx-expbody {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--edge);
  }
  .cvx-expbody p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink2); }
  /* Live widget bodies — reused console surfaces render flush (no nested chrome). */
  .cvx-live { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .cvx-node.cvx-exp .cvx-live { overflow: visible; }
  .cvx-live .v2card, .cvx-live .chart-card {
    background: none; border: none; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0;
  }
  .canvas-cell-body { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* Receipt chip — mono, ✓ in --ok, scheme in --trust (the Aurora signature). */
  .cvx-chip {
    margin-top: auto; align-self: flex-start; display: inline-flex; gap: 7px; align-items: center;
    font: 500 10px var(--font-mono); color: var(--ink2);
    border: 1px solid var(--edge); border-radius: 8px; padding: 4px 9px; background: var(--surface2);
    max-width: 100%; overflow: hidden; white-space: nowrap;
  }
  .cvx-chip-ok { color: var(--ok); }
  .cvx-chip-sig { color: var(--trust); }
  /* Chromeless — text straight on the canvas, no card chrome, never interactive. */
  .cvx-node.cvx-chromeless {
    background: transparent; border-color: transparent; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    overflow: visible; pointer-events: none; cursor: default;
  }
  .cvx-node.cvx-chromeless .cvx-title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .cvx-node.cvx-chromeless .cvx-sub { font-size: 13px; color: var(--ink2); }
  .cvx-node.cvx-chromeless .cvx-body { color: var(--ink3); max-width: 42ch; }
  /* Documents-mode canvas zone — full-width main column (a canvas, not prose;
     the reader keeps its ~72ch measure). */
  .doc-canvas { flex: 1; min-width: 0; }
  .doc-canvas .cvx-surface { height: calc(100vh - 150px); }
  /* ── Form / stack view (<640px — the PageView port: 12-col spans) ── */
  .cvx-pv { max-width: 1024px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .cvx-pv-intro { padding: 4px 0 8px; }
  .cvx-pv-title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); line-height: 1.15; }
  .cvx-pv-sub { margin: 6px 0 0; font-size: 13px; color: var(--ink2); }
  .cvx-pv-body { margin: 8px 0 0; font-size: 12.5px; color: var(--ink3); max-width: 64ch; }
  .cvx-pv-nav { display: flex; align-items: center; gap: 10px; }
  .cvx-pv-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .cvx-pv-grid .cvx-node, .cvx-pv .cvx-node.cvx-pv-focus {
    position: relative; left: auto; top: auto; width: auto; height: auto;
    min-height: 120px; cursor: pointer;
  }
  .cvx-pv-grid .cvx-node[data-span="4"] { grid-column: span 4; }
  .cvx-pv-grid .cvx-node[data-span="6"] { grid-column: span 6; }
  .cvx-pv-grid .cvx-node[data-span="8"] { grid-column: span 8; }
  .cvx-pv-grid .cvx-node[data-span="12"] { grid-column: span 12; }
  .cvx-pv .cvx-node.cvx-pv-focus { cursor: default; }
  @media (max-width: 768px) {
    .cvx-pv-grid .cvx-node[data-span] { grid-column: span 12; }
    .cvx-pv-grid .cvx-node[data-span="6"] { grid-column: span 6; }
  }
  @media (max-width: 640px) {
    .cvx-pv-grid { gap: 12px; }
    .cvx-pv-grid .cvx-node[data-span] { grid-column: span 12; }
  }
  /* Reduced motion: the global reduce rule already kills every animation and
     transition; the dim fallback additionally drops the blur so the dimmed
     context stays readable (grammar-demo parity). */
  @media (prefers-reduced-motion: reduce) {
    .cvx-node { animation: none; }
    .cvx-node.cvx-dim { filter: none; opacity: .3; transform: none; }
  }

  /* ---- Canvas relation graph — card nodes + node inspector --------------- */
  .canvas-graph { position: relative; }
  /* No frame — nodes drop straight onto the page; the stage is just the pannable area. */
  .canvas-graph-stage {
    position: relative; min-height: 640px; height: 74vh; overflow: hidden;
    touch-action: none; cursor: grab;
  }
  .canvas-graph-stage:active { cursor: grabbing; }
  .cv-graph-layer { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .cv-graph-edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  /* Straight solid wires tipped with a solid arrowhead at the target box edge; a
     pulse dot travels each wire source → target to show flow (JS-driven). */
  .cv-gedge { stroke: var(--edge-strong); stroke-width: 2; fill: none; opacity: .85; stroke-linecap: round; }
  .cv-gedge.is-hot { stroke: var(--acc); opacity: 1; stroke-width: 2.6; }
  .cv-gedge.is-dim { opacity: .1; }
  .cv-arrowhead { fill: var(--edge-strong); stroke: none; }
  .cv-arrowhead-hot { fill: var(--acc); }
  .cv-pulse { fill: var(--acc); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--acc) 60%, transparent)); }
  .cv-pulse.is-hot { r: 4; }
  .cv-pulse.is-dim { opacity: 0 !important; }
  /* Node cards */
  .cv-card {
    position: absolute; width: 300px; height: 128px; box-sizing: border-box; padding: 12px 14px;
    /* Uniform height (matches CARD_H in render.js) so every node's edge ports line
       up; content is vertically centred so short nodes don't read as top-heavy. */
    display: flex; flex-direction: column; justify-content: center; overflow: hidden;
    border: 1px solid var(--edge-strong); border-left: 3px solid var(--cv-c, var(--ink3)); border-radius: 12px;
    /* Frosted glass, but lifted for contrast: a light tint over a semi-opaque
       backing raises the card clearly above the near-black canvas, while the
       backdrop blur still softens any wire passing UNDER it. */
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--cv-c, var(--ink2)) 16%, transparent), color-mix(in srgb, var(--ink2) 5%, transparent) 65%),
      color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(8px) saturate(1.15); -webkit-backdrop-filter: blur(8px) saturate(1.15);
    box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: grab; outline: none; user-select: none;
    transition: border-color .12s ease, box-shadow .15s ease, transform .12s ease;
  }
  .cv-card:hover, .cv-card:focus-visible { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,.4); }
  .cv-card.is-dragging { cursor: grabbing; transform: none; box-shadow: 0 18px 40px rgba(0,0,0,.5); z-index: 50; transition: none; }
  .cv-card.is-sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc), 0 14px 30px rgba(0,0,0,.45); }
  .cv-card.is-dim { opacity: .3; }
  .cv-card[data-type="session"] { --cv-c: var(--ok); }
  .cv-card[data-type="work"] { --cv-c: var(--acc); }
  .cv-card[data-type="work"][data-strip="blocked"], .cv-card[data-type="work"][data-strip="review"] { --cv-c: var(--warn); }
  .cv-card[data-type="work"][data-strip="done"] { --cv-c: var(--ok); }
  .cv-card[data-type="gate"] { --cv-c: var(--warn); }
  .cv-card[data-type="passport"] { --cv-c: var(--trust); }
  .cv-card[data-type="project"] { --cv-c: var(--acc); }
  .cv-card-head { display: flex; align-items: center; gap: 8px; }
  .cv-card-kind { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
  .cv-card-badge { margin-left: auto; font-family: var(--font-mono); font-size: 9px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--ink2); border: 1px solid var(--edge); }
  .cv-card-title { margin-top: 5px; font-size: 13px; font-weight: 640; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-word; }
  .cv-card-sub { margin-top: 4px; font-size: 11px; color: var(--ink3); }
  .cv-card-id { margin-top: 6px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Milestone progress on work / session nodes — fill uses the node's own accent. */
  .cv-card-progrow { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
  .cv-card-prog { flex: 1; height: 5px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--edge); overflow: hidden; }
  .cv-card-prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--cv-c, var(--acc)) 50%, var(--acc)), var(--cv-c, var(--acc))); }
  .cv-card-progv { font-family: var(--font-mono); font-size: 9px; color: var(--ink3); white-space: nowrap; }
  /* Node inspector — slides in from the right edge on node click; pin keeps it. */
  .canvas-graph-inspector {
    position: absolute; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92%;
    display: flex; flex-direction: column; min-width: 0; z-index: 4;
    border: 1px solid var(--edge); border-radius: var(--radius);
    /* Opaque — the surface tint composited over the page bg so nodes don't show through. */
    background: linear-gradient(var(--surface), var(--surface)), var(--bg);
    box-shadow: -14px 0 44px rgba(0,0,0,.42);
    transform: translateX(calc(100% + 28px)); opacity: 0; pointer-events: none;
    transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .24s ease;
  }
  .canvas-graph-inspector.is-open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .cv-insp-topbar { display: flex; align-items: center; gap: 8px; padding: 13px 14px 11px; border-bottom: 1px solid var(--edge); flex: none; }
  .cv-insp-topbar .canvas-insp-type { flex: 1; }
  .cv-insp-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--ink3); cursor: pointer; transition: color .15s ease, background .15s ease, border-color .15s ease; }
  .cv-insp-btn:hover { color: var(--ink); background: var(--surface2); border-color: var(--edge); }
  .cv-insp-btn svg { width: 15px; height: 15px; }
  .cv-insp-pin[aria-pressed="true"] { color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); border-color: color-mix(in srgb, var(--acc) 40%, transparent); }
  .cv-insp-body { flex: 1; overflow: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .canvas-insp-type { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
  .cv-insp-badges { display: flex; gap: 6px; align-items: center; }
  .cv-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
  .cv-badge-type { background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--acc); }
  .cv-badge-state { background: var(--surface2); color: var(--ink2); border: 1px solid var(--edge); }
  .cv-insp-title { margin: 2px 0 0; font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--ink); word-break: break-word; }
  .cv-insp-sub { margin: 0; font-size: 12px; color: var(--ink3); }
  .cv-insp-fields { display: flex; flex-direction: column; border-top: 1px solid var(--edge); padding-top: 6px; }
  .cv-field { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--edge) 55%, transparent); }
  .cv-field-k { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); min-width: 92px; flex: none; }
  .cv-field-v { font-family: var(--font-mono); font-size: 11px; color: var(--ink); word-break: break-all; }
  .cv-insp-json { margin: 4px 0 0; padding: 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--edge); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: var(--ink2); overflow-x: auto; white-space: pre; }
  .cv-insp-linked-h { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin-top: 4px; }
  .cv-linked-item { display: flex; gap: 8px; align-items: center; padding: 6px 0; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--edge) 55%, transparent); }
  .cv-linked-item:hover .cv-linked-label { color: var(--acc); }
  .cv-linked-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); flex: none; }
  .cv-linked-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv-linked-sub { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink3); flex: none; }
  /* "View graph" cross-feature launch link — a small nav-family button. */
  .cx-graphlink { min-height: 30px; padding: 0 11px; font-size: 12px; align-self: flex-start; }
  @media (max-width: 720px) { .canvas-graph-inspector { width: 100%; max-width: 100%; } }

  /* ---- Canvas graph — zoom-aware LOD (M7) --------------------------------
     Zoomed OUT the nodes ride concentric type-shells (the ring overview); zoomed
     IN they snap to the card/force columns. A +/- cluster carries a live label
     ("overview" / "detail"); wheel + pinch still zoom. */
  .cv-zoom {
    position: absolute; left: 14px; bottom: 14px; z-index: 5;
    display: flex; align-items: center; gap: 2px; padding: 3px;
    border: 1px solid var(--edge); border-radius: 9px;
    background: color-mix(in srgb, var(--surface) 92%, var(--bg));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .cv-zoom-btn {
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: none; color: var(--ink2);
    font-size: 16px; line-height: 1; cursor: pointer; transition: color .12s ease, background .12s ease;
  }
  .cv-zoom-btn:hover { color: var(--ink); background: var(--surface2); }
  .cv-zoom-mode {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink3); padding: 0 8px; min-width: 58px; text-align: center;
  }
  .cv-graph-note {
    position: absolute; left: 14px; top: 14px; z-index: 5; max-width: 62%;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink3);
    background: color-mix(in srgb, var(--surface) 90%, var(--bg));
    border: 1px solid var(--edge); border-radius: 7px; padding: 4px 9px;
  }
  /* Overview (ring) declutter — drop the id line so the shells read cleanly. */
  .cv-graph-layer[data-lod="ring"] .cv-card-id { display: none; }

  /* ---- Plan tree (M4a) — Project → ExecPlan → Milestone → live session ----
     Indented rows over native <details>; nesting shown by indent + a rotating
     ▸ disclosure caret (CSS-only), not a coloured side-tab. */
  .plan-tree { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .plan-tree-node { border: none; }
  .plan-tree-node > .plan-tree-row { cursor: default; }
  .plan-tree-node > summary.plan-tree-row { cursor: pointer; list-style: none; }
  .plan-tree-node > summary.plan-tree-row::-webkit-details-marker { display: none; }
  /* Visible expand/collapse affordance — a caret that rotates when open. */
  .plan-tree-node > summary.plan-tree-row::before {
    content: '\25B8'; display: inline-block; flex: none; width: .9em;
    color: var(--ink3); transition: transform .15s ease;
  }
  .plan-tree-node[open] > summary.plan-tree-row::before { transform: rotate(90deg); }
  .plan-tree-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    min-height: 30px; padding: 4px 8px; border-radius: 7px;
  }
  .plan-tree-row:hover { background: var(--surface2); }
  .plan-tree-type {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink3); border: 1px solid var(--edge); border-radius: 5px; padding: 1px 5px; flex: none;
  }
  .plan-tree-type-unattached { color: var(--warn, var(--ink2)); }
  .plan-tree-label { font-weight: 600; color: var(--ink); }
  .plan-tree-state, .plan-tree-prog { font-family: var(--font-mono); font-size: 10px; color: var(--ink2); }
  .plan-tree-sub { font-size: 11px; color: var(--ink3); }
  .plan-tree-focus, .plan-tree-path, .plan-tree-lease {
    font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 5px;
    background: var(--surface2); color: var(--ink2); border: 1px solid var(--edge);
  }
  .plan-tree-focus { color: var(--acc); }
  .plan-tree-unresolved { color: var(--warn, var(--crit)); }
  .plan-tree-lease { color: var(--ink2); }
  /* Fail-honest per-feed degraded notice (mirrors the M2 .capability-reason idiom). */
  .plan-tree-degraded {
    font-size: 11.5px; color: var(--ink2); padding: 7px 10px; border-radius: 7px;
    background: var(--surface2); border: 1px dashed var(--edge-strong); margin-bottom: 4px;
  }
  /* Stale-plan hash chip (M4c console half). provenance = daemon hash only;
     insync = local matches; mismatch = a loud drift badge (T.2 guard). */
  .plan-tree-hash {
    font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--edge); color: var(--ink3); background: var(--surface2);
  }
  .plan-tree-hash-prov { color: var(--ink3); }
  .plan-tree-hash-insync { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .plan-tree-hash-mismatch {
    color: var(--crit); border-color: color-mix(in srgb, var(--crit) 55%, var(--edge));
    background: color-mix(in srgb, var(--crit) 12%, var(--surface2));
  }

  /* ---- Plan tree colour + filters (M7) ----------------------------------
     KIND → the row's left-border STYLE + colour and its type-chip hue (reusing
     the graph's kind vocabulary: project=acc, execplan=trust, session=ok,
     kanban(work)=warn, milestone=ink3, unattached=crit). STATE → a subtle row
     fill + the state-chip hue (reusing the console's status vocabulary:
     planned=ink3, in_progress/drafting=acc, blocked/review=warn,
     done/complete/deployed=ok, archive=muted). Additive: existing chips + hash
     badges + focus/lease chips are untouched. */
  .plan-tree-row[data-kind] { border-left: 3px solid transparent; }
  .plan-tree-row[data-kind="project"] { border-left-color: var(--acc); }
  .plan-tree-row[data-kind="execplan"] { border-left-color: var(--trust); }
  .plan-tree-row[data-kind="milestone"] { border-left-style: dotted; border-left-color: var(--ink3); }
  .plan-tree-row[data-kind="session"] { border-left-color: var(--ok); }
  .plan-tree-row[data-kind="work"] { border-left-style: dashed; border-left-color: var(--warn); }
  .plan-tree-row[data-kind="unattached"] { border-left-style: dashed; border-left-color: var(--crit); }
  /* Type chip hue by kind. */
  .plan-tree-row[data-kind="project"] .plan-tree-type { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 42%, var(--edge)); }
  .plan-tree-row[data-kind="execplan"] .plan-tree-type { color: var(--trust); border-color: color-mix(in srgb, var(--trust) 42%, var(--edge)); }
  .plan-tree-row[data-kind="milestone"] .plan-tree-type { color: var(--ink2); }
  .plan-tree-row[data-kind="session"] .plan-tree-type { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 42%, var(--edge)); }
  .plan-tree-row[data-kind="work"] .plan-tree-type { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 42%, var(--edge)); }
  .plan-tree-row[data-kind="unattached"] .plan-tree-type { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 42%, var(--edge)); }
  /* State fill (subtle). */
  .plan-tree-row[data-state="planned"] { background: color-mix(in srgb, var(--ink3) 7%, transparent); }
  .plan-tree-row[data-state="in_progress"], .plan-tree-row[data-state="drafting"] { background: color-mix(in srgb, var(--acc) 10%, transparent); }
  .plan-tree-row[data-state="blocked"], .plan-tree-row[data-state="review"] { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .plan-tree-row[data-state="done"], .plan-tree-row[data-state="complete"], .plan-tree-row[data-state="deployed"] { background: color-mix(in srgb, var(--ok) 9%, transparent); }
  .plan-tree-row[data-state="archive"] { background: color-mix(in srgb, var(--ink3) 5%, transparent); }
  /* State chip hue. */
  .plan-tree-row[data-state="in_progress"] .plan-tree-state, .plan-tree-row[data-state="drafting"] .plan-tree-state { color: var(--acc); }
  .plan-tree-row[data-state="blocked"] .plan-tree-state, .plan-tree-row[data-state="review"] .plan-tree-state { color: var(--warn); }
  .plan-tree-row[data-state="done"] .plan-tree-state, .plan-tree-row[data-state="complete"] .plan-tree-state, .plan-tree-row[data-state="deployed"] .plan-tree-state { color: var(--ok); }
  .plan-tree-row[data-state="planned"] .plan-tree-state, .plan-tree-row[data-state="archive"] .plan-tree-state { color: var(--ink3); }

  .plan-tree-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .plan-tree-legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px 13px;
    padding: 8px 11px; border: 1px solid var(--edge); border-radius: 8px; background: var(--surface);
  }
  .plan-tree-legend-h { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
  .plan-tree-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink2); }
  .plan-tree-legend-lab { font-family: var(--font-mono); }
  .plan-tree-legend-swatch { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--edge-strong); background: transparent; flex: none; }
  .plan-tree-legend-swatch[data-kind="project"] { background: var(--acc); border-color: var(--acc); }
  .plan-tree-legend-swatch[data-kind="execplan"] { background: var(--trust); border-color: var(--trust); }
  .plan-tree-legend-swatch[data-kind="milestone"] { border-style: dotted; border-color: var(--ink3); }
  .plan-tree-legend-swatch[data-kind="session"] { background: var(--ok); border-color: var(--ok); }
  .plan-tree-legend-swatch[data-kind="work"] { border-style: dashed; border-color: var(--warn); }
  .plan-tree-legend-swatch[data-kind="unattached"] { border-style: dashed; border-color: var(--crit); }
  .plan-tree-legend-swatch[data-state="planned"] { background: var(--ink3); border-color: var(--ink3); }
  .plan-tree-legend-swatch[data-state="in_progress"], .plan-tree-legend-swatch[data-state="drafting"] { background: var(--acc); border-color: var(--acc); }
  .plan-tree-legend-swatch[data-state="blocked"], .plan-tree-legend-swatch[data-state="review"] { background: var(--warn); border-color: var(--warn); }
  .plan-tree-legend-swatch[data-state="done"], .plan-tree-legend-swatch[data-state="complete"], .plan-tree-legend-swatch[data-state="deployed"] { background: var(--ok); border-color: var(--ok); }
  .plan-tree-legend-swatch[data-state="archive"] { background: color-mix(in srgb, var(--ink3) 55%, transparent); border-color: var(--ink3); }

  .plan-tree-filters { display: flex; flex-direction: column; gap: 7px; }
  .plan-tree-filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .plan-tree-filter-lab { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); min-width: 46px; }
  .plan-tree-toggle {
    font-family: var(--font-mono); font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--edge); background: var(--surface2); color: var(--ink3); cursor: pointer;
    transition: color .12s ease, border-color .12s ease, opacity .12s ease;
  }
  .plan-tree-toggle:hover { color: var(--ink); border-color: var(--edge-strong); }
  .plan-tree-toggle:not(.is-on) { opacity: .42; text-decoration: line-through; }
  .plan-tree-toggle.is-on[data-kind="project"] { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-kind="execplan"] { color: var(--trust); border-color: color-mix(in srgb, var(--trust) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-kind="session"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-kind="work"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-kind="unattached"] { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-kind="milestone"] { color: var(--ink); }
  .plan-tree-toggle.is-on[data-state="in_progress"], .plan-tree-toggle.is-on[data-state="drafting"] { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-state="blocked"], .plan-tree-toggle.is-on[data-state="review"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-state="done"], .plan-tree-toggle.is-on[data-state="complete"], .plan-tree-toggle.is-on[data-state="deployed"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .plan-tree-toggle.is-on[data-state="planned"], .plan-tree-toggle.is-on[data-state="archive"] { color: var(--ink2); }
  .plan-tree-search {
    flex: 1; min-width: 160px; font-family: inherit; font-size: 12px; padding: 5px 10px;
    border-radius: 7px; border: 1px solid var(--edge); background: var(--surface2); color: var(--ink);
  }
  .plan-tree-search:focus { outline: none; border-color: var(--acc); }
  .plan-tree-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink3); margin: 0; }

  /* Session-detail / evidence view (M4b) — tree + detail split. */
  .plan-tree-layout { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .plan-tree-col { flex: 1 1 340px; min-width: 0; }
  .session-detail-col { flex: 1 1 340px; min-width: 0; border-left: 1px solid var(--edge); padding-left: 14px; }
  @media (max-width: 720px) {
    .session-detail-col { border-left: none; padding-left: 0; border-top: 1px solid var(--edge); padding-top: 12px; }
  }
  .plan-tree-session-open { cursor: pointer; }
  .plan-tree-session-open:hover { background: var(--surface2); }
  .plan-tree-session-open:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  .session-detail { display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; }
  .session-detail-head { display: flex; flex-direction: column; gap: 6px; }
  .session-detail-title { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .session-detail-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .session-detail-sec { display: flex; flex-direction: column; gap: 6px; }
  .session-detail-sec-h {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .session-detail-item {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    border: 1px solid var(--edge); border-radius: 7px; padding: 6px 9px;
  }
  .session-detail-k { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink2); }
  .session-detail-hash { font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  /* Transcript reference — inert text, never a link (reference-only decision). */
  .session-detail-transcript-ref {
    font-family: var(--font-mono); font-size: 10.5px; padding: 2px 7px; border-radius: 5px;
    background: var(--surface2); border: 1px dashed var(--edge-strong); color: var(--ink3);
    word-break: break-all;
  }
  /* absent = reachable-but-empty (M2 disabled-with-reason idiom). */
  .session-detail-absent {
    font-size: 11.5px; color: var(--ink3); padding: 7px 10px; border-radius: 7px;
    background: var(--surface2); border: 1px solid var(--edge);
  }
  /* degraded = feed error (M4a appendFeedNotices idiom). */
  .session-detail-degraded {
    font-size: 11.5px; color: var(--ink2); padding: 7px 10px; border-radius: 7px;
    background: var(--surface2); border: 1px dashed var(--edge-strong);
  }
  .session-detail-badge {
    font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--edge); color: var(--ink3);
  }
  .session-detail-badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .session-detail-badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--edge)); }
  .session-detail-badge.err { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); }
  .session-detail-redacted { font-family: var(--font-mono); font-size: 10px; color: var(--warn); }

  /* ---- Activity log (Work › Activity) — v2-themed rolling activity surface --- */
  .act-log { display: flex; flex-direction: column; gap: 12px; }
  .act-controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .act-field { display: flex; flex-direction: column; gap: 3px; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .act-input { min-height: 34px; min-width: 170px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; background: var(--surface2); color: var(--ink); font: inherit; font-size: 13px; }
  .act-input.act-budget { min-width: 90px; }
  .act-input:focus { border-color: var(--edge-strong); outline: none; }
  .act-kinds { display: flex; gap: 5px; flex-wrap: wrap; align-self: center; }
  .act-kchip { font-family: var(--font-mono); font-size: 10.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--edge); background: none; color: var(--ink3); cursor: pointer; }
  .act-kchip.on { color: var(--ink); border-color: currentColor; }
  .act-kchip.k-question.on { color: var(--acc); }
  .act-kchip.k-answer.on { color: var(--ok); }
  .act-kchip.k-command.on { color: var(--warn); }
  .act-kchip.k-fact.on { color: var(--trust); }
  .act-kchip.k-execplan.on, .act-kchip.k-handoff.on { color: #5EC2E7; }
  .act-kchip.k-error.on { color: var(--crit); }
  .act-status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--ink3); }
  .act-livedot { width: 8px; height: 8px; border-radius: 999px; background: var(--ink3); flex: none; }
  .act-livedot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .act-list { display: flex; flex-direction: column; gap: 8px; }
  .act-row { border: 1px solid var(--edge); border-left: 4px solid var(--ink3); border-radius: 10px; padding: 10px 13px; background: var(--surface); cursor: pointer; }
  .act-row:hover { border-color: var(--edge-strong); }
  .act-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); }
  .act-kind { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); }
  .act-preview { margin-top: 4px; color: var(--ink2); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .act-expand { margin-top: 8px; border-top: 1px dashed var(--edge); padding-top: 8px; display: none; }
  .act-row.open .act-expand { display: block; }
  .act-verbatim { font-family: var(--font-mono); font-size: 12px; background: var(--surface2); border: 1px solid var(--edge); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; color: var(--ink2); }
  .act-receipts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .act-badge { font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--edge); color: var(--ink3); }
  .act-badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .act-badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--edge)); }
  .act-badge.err { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); }
  .act-row.k-question { border-left-color: var(--acc); }
  .act-row.k-answer { border-left-color: var(--ok); }
  .act-row.k-command { border-left-color: var(--warn); }
  .act-row.k-fact { border-left-color: var(--trust); }
  .act-row.k-execplan, .act-row.k-handoff { border-left-color: #5EC2E7; }
  .act-row.k-error { border-left-color: var(--crit); }
  .act-row.k-reasoning { border-left-color: var(--ink3); }
  /* M4 default-on all-sessions lane: derived kind-chip counts, clickable session
     pill, relative-time-with-absolute-on-hover, receipt/fact ref chips. */
  .act-kc { color: var(--ink3); margin-left: 5px; }
  .act-sess { font-family: var(--font-mono); font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--edge); background: none; color: var(--acc); cursor: pointer; }
  .act-sess:hover { border-color: currentColor; }
  .act-time { cursor: help; }
  .act-refs { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .act-ref { font-family: var(--font-mono); font-size: 9.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--edge); color: var(--ink3); }
  .act-ref.rc { color: var(--trust); border-color: color-mix(in srgb, var(--trust) 40%, var(--edge)); }
  .act-ref.fr { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 40%, var(--edge)); }

  /* ---- Facts browser (console-surfaces-remediation M2) — paged /v1/facts/list
     with entity-prefix groups, server-side search, ingest-time as_of machine,
     superseded/reserved toggles, and per-row full-value detail. All colour is
     var(--…) tokens (theme-safe across glass/dark/light). ------------------- */
  .facts-browser { display: flex; flex-direction: column; gap: 12px; }
  .facts-toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .facts-field { display: flex; flex-direction: column; gap: 3px; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .facts-input { min-height: 34px; min-width: 220px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; background: var(--surface2); color: var(--ink); font: inherit; font-size: 13px; }
  .facts-input.facts-asof { min-width: 190px; }
  .facts-input:focus { border-color: var(--edge-strong); outline: none; }
  .facts-toggles { display: flex; gap: 8px; align-items: center; }
  .facts-toggle { font-family: var(--font-mono); font-size: 10.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--edge); background: none; color: var(--ink3); cursor: pointer; }
  .facts-toggle.on { color: var(--ink); border-color: currentColor; }
  .facts-count { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .facts-count b { color: var(--ink); font-weight: 600; }
  .facts-asof-tag { margin-left: 8px; font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--acc) 45%, var(--edge)); color: var(--acc); }
  .facts-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .facts-chip { font-family: var(--font-mono); font-size: 10.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--edge); background: none; color: var(--ink3); cursor: pointer; }
  .facts-chip.on { color: var(--ink); border-color: currentColor; }
  .facts-chip .c { color: var(--ink3); margin-left: 5px; }
  .facts-banner { border: 1px solid var(--edge); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; color: var(--ink2); background: var(--surface2); }
  .facts-banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--edge)); color: var(--warn); }
  .facts-banner.err { border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); color: var(--crit); }
  .facts-groups { display: flex; flex-direction: column; gap: 8px; }
  .facts-group { border: 1px solid var(--edge); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .facts-gsum { display: flex; align-items: center; gap: 9px; padding: 9px 13px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; color: var(--ink); list-style: none; }
  .facts-gsum::-webkit-details-marker { display: none; }
  .facts-gdot { width: 8px; height: 8px; border-radius: 999px; background: var(--ink3); flex: none; }
  .facts-gname { font-weight: 600; }
  .facts-gcount { margin-left: auto; color: var(--ink3); font-size: 10.5px; }
  .facts-glist { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; }
  .facts-row { border: 1px solid var(--edge); border-left: 3px solid var(--ink3); border-radius: 8px; padding: 8px 12px; background: var(--surface2); cursor: pointer; }
  .facts-row:hover { border-color: var(--edge-strong); }
  .facts-rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .facts-key { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); font-weight: 600; }
  .facts-entity { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); }
  .facts-rbadges { display: flex; gap: 6px; }
  .facts-time { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .facts-val { margin-top: 4px; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .facts-badge { font-family: var(--font-mono); font-size: 9.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--edge); color: var(--ink3); }
  .facts-badge.sup { border-style: dashed; opacity: .85; }
  .facts-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--edge); }
  .facts-row.open .facts-detail { display: block; }
  .facts-row.open .facts-val { white-space: normal; }
  .facts-kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-family: var(--font-mono); font-size: 11px; }
  .facts-kv-k { color: var(--ink3); }
  .facts-kv-v { color: var(--ink2); word-break: break-word; }
  .facts-vlabel { margin: 9px 0 4px; font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
  .facts-vfull { margin: 0; padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--edge); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  .facts-loading { font-family: var(--font-mono); font-size: 11px; color: var(--ink3); }
  .facts-more { display: flex; justify-content: center; padding: 4px 0; }
  .facts-cap { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--warn); }
  .facts-empty { padding: 8px 0; }
  .facts-sentinel { height: 1px; }
  .facts-row.tone-acc { border-left-color: var(--acc); }
  .facts-row.tone-ok { border-left-color: var(--ok); }
  .facts-row.tone-crit { border-left-color: var(--crit); }
  .facts-row.tone-trust { border-left-color: var(--trust); }
  .facts-row.tone-warn { border-left-color: var(--warn); }
  .facts-row.tone-ink3 { border-left-color: var(--ink3); }
  .facts-group.tone-acc .facts-gdot { background: var(--acc); }
  .facts-group.tone-ok .facts-gdot { background: var(--ok); }
  .facts-group.tone-crit .facts-gdot { background: var(--crit); }
  .facts-group.tone-trust .facts-gdot { background: var(--trust); }
  .facts-group.tone-warn .facts-gdot { background: var(--warn); }
  .facts-group.tone-ink3 .facts-gdot { background: var(--ink3); }

  /* cx-sessions browser (M3) — reuses the facts-* chrome; these add the state
     chip, the per-row meta chip row, honest-empty notes, and the state details. */
  .sess-sc { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .sess-sc.active { color: var(--ok); }
  .sess-sc.idle { color: var(--ink3); }
  .sess-sc.archived { color: var(--warn); }
  /* same-id ExecPlan chip: an EXACT link — emphasised over the lighter coord
     live-announce plan chip (both classes apply; this one wins by source order). */
  .sess-chip-idmatch { color: var(--acc); border-color: var(--acc); background: color-mix(in srgb, var(--acc) 18%, transparent); font-weight: 600; }
  .sess-rmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .facts-row.open .sess-rmeta { margin-bottom: 4px; }
  .sess-note-empty { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink3); font-style: italic; }
  /* cx-cost (console-surfaces-remediation M5): method chip, output chip, top-burn
     bar chart, and the totals row — all var(--) tokens, no libraries. */
  .cost-method.link { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 11%, transparent); }
  .cost-method.window { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 11%, transparent); }
  .cost-out { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 32%, transparent); }
  .cost-chart { display: flex; flex-direction: column; gap: 4px; }
  .cost-chart:empty { display: none; }
  .cost-chart-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); margin-bottom: 2px; }
  .cost-bar { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 8px; }
  .cost-bar-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cost-bar-track { height: 12px; background: var(--surface2); border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
  .cost-bar-fill { height: 100%; background: var(--acc); border-radius: 6px 0 0 6px; min-width: 2px; }
  .cost-bar-val { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink2); text-align: right; }
  .cost-totals { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 8px 12px; border: 1px solid var(--edge); border-left: 3px solid var(--acc); border-radius: 8px; background: var(--surface2); }
  .cost-totals:empty { display: none; }
  .cost-totals-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--ink3); }
  .cost-totals-v { font-family: var(--font-mono); font-size: 12px; color: var(--ink2); }
  .cost-totals-v b { color: var(--ink); font-weight: 600; }
  .sess-empty { margin: 3px 0 6px; }
  .sess-state-details { margin-top: 9px; }
  .sess-state-details > summary { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); cursor: pointer; padding: 3px 0; }
  .sess-state-details[open] > summary { color: var(--ink2); }

  /* cx trust cluster (console-surfaces-remediation M6): receipts / gates /
     identity / mediation. Reuses the facts-* chrome; these add the help panels,
     kind chips, the verbatim verification verdict, and the honest posture cards.
     All colour is var(--) tokens — no hard-coded hues. */
  .m6-help { background: var(--surface2); border-color: var(--edge); color: var(--ink2); }
  .m6-help-h { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-weight: 600; margin-bottom: 5px; }
  .m6-help .facts-kv { margin-top: 6px; }
  .m6-help .facts-vlabel:first-child { margin-top: 4px; }
  .facts-banner.ok-empty { border-color: color-mix(in srgb, var(--ok) 40%, var(--edge)); }
  .facts-banner.ok-empty .m6-help-h { color: var(--ok); }
  /* Receipt kind chip: same pill as .sess-chip, tinted by kind tone. */
  .rcpt-kind { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .rcpt-kind.tone-acc { color: var(--acc); }
  .rcpt-kind.tone-ok { color: var(--ok); }
  .rcpt-kind.tone-crit { color: var(--crit); }
  .rcpt-kind.tone-trust { color: var(--trust); }
  .rcpt-kind.tone-warn { color: var(--warn); }
  .rcpt-kind.tone-ink3 { color: var(--ink3); }
  .rcpt-fetchable { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 11%, transparent); }
  .rcpt-envonly { color: var(--ink3); border-style: dashed; }
  /* Verification verdict — rendered VERBATIM from the daemon report. */
  .rcpt-verdict { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-family: var(--font-mono); font-size: 11.5px; padding: 8px 10px; border-radius: 8px; margin: 4px 0; border: 1px solid var(--edge); }
  .rcpt-verdict.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--edge)); }
  .rcpt-verdict.bad { border-color: color-mix(in srgb, var(--crit) 45%, var(--edge)); }
  .rcpt-verdict-k { color: var(--ink3); }
  .rcpt-verdict b { color: var(--ink); font-weight: 600; }
  .rcpt-verdict.ok b { color: var(--ok); }
  .rcpt-verdict.bad b { color: var(--crit); }
  .gate-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .aurora { animation: none !important; }
  }

  /* ---- Phone tier: bottom tab bar + "More" sheet (max-width:720px) ------ */
  /* Desktop/tablet: the mobile chrome is inert (never painted); the rail is the
     nav. All phone-tier colour comes from theme tokens, so every theme is right. */
  .tabbar, .sheet, .sheet-scrim { display: none; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }                 /* hide the desktop rail entirely */
    .content, .topbar { padding-left: 16px; padding-right: 16px; }
    /* Reserve room so content never hides behind the fixed tab bar; add the iOS
       home-indicator inset (env(safe-area-inset-bottom)). */
    .content { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px) + 20px); }

    /* Fixed bottom tab bar: four equal touch targets (≥44px). */
    .tabbar {
      display: flex;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border-top: 1px solid var(--edge);
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    }
    .tab {
      flex: 1; min-height: 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 4px 2px; border: 1px solid transparent; border-radius: var(--radius-sm);
      background: none; color: var(--ink3); cursor: pointer;
      transition: color .16s ease, background .16s ease;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab .tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
    .tab:hover { color: var(--ink2); }
    .tab[aria-current="page"] { color: var(--acc); }
    .tab[aria-current="page"] svg { opacity: 1; }

    /* "More" bottom sheet + scrim. */
    .sheet-scrim {
      display: block; position: fixed; inset: 0; z-index: 25;
      background: rgba(2, 5, 12, .5);
    }
    .sheet {
      display: flex; flex-direction: column; gap: 14px;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 26;
      max-height: 80vh; overflow-y: auto;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--edge-strong);
      border-radius: 18px 18px 0 0;
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    }
    .sheet[hidden], .sheet-scrim[hidden] { display: none; }
    .sheet-handle {
      width: 40px; height: 4px; border-radius: 999px; background: var(--edge-strong);
      margin: 2px auto 2px;
    }
    .sheet-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--ink3); font-weight: 600; padding: 0 2px 2px;
    }
    .sheet-nav { display: flex; flex-direction: column; gap: 4px; }
    .sheet-item {
      display: flex; align-items: center; gap: 12px;
      min-height: 44px; padding: 0 12px; width: 100%; text-align: left;
      border: 1px solid transparent; border-radius: var(--radius-sm);
      background: none; color: var(--ink2); cursor: pointer; font: inherit;
      transition: background .16s ease, color .16s ease;
    }
    .sheet-item svg { width: 20px; height: 20px; flex: none; opacity: .9; }
    .sheet-item .label { flex: 1; font-weight: 500; }
    .sheet-item:hover { background: var(--surface2); color: var(--ink); }
    .sheet-item[aria-current="page"] { background: var(--surface2); color: var(--ink); border-color: var(--edge-strong); }
    .sheet-item[aria-current="page"] svg { opacity: 1; color: var(--acc); }
    .sheet-chrome { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; border-top: 1px solid var(--edge); }
  }
</style>
</head>
<body>
  <a class="skip" href="#main">Skip to console content</a>
  <div class="aurora" aria-hidden="true"></div>

  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">Crux Console<small>Unified shell · v2</small></span>
        <button class="rail-toggle" id="railToggle" type="button" aria-expanded="false" aria-label="Expand navigation" title="Expand navigation"></button>
      </div>
      <!-- Compact meta cluster (condensed from the old top bar): the Command |
           Explore surface toggle + the status chips + the connection pill. -->
      <div class="rail-meta" id="railMeta">
        <div class="modeseg railseg" id="modeSeg" role="group" aria-label="Surface"></div>
        <div class="rail-chips">
          <div class="topchips" id="topchips"></div>
          <span class="health" id="health" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="healthText">Connecting…</span>
          </span>
          <button class="rail-theme-cycle" id="themeCycle" type="button" title="Cycle theme" aria-label="Cycle theme"></button>
        </div>
      </div>
      <nav id="nav" aria-label="Primary"></nav>
      <div class="rail-footer">
        <div class="acct-menu-wrap" id="acctWrap">
          <div class="acct-menu" id="acctMenu" role="menu" aria-label="Account &amp; system" hidden>
            <button class="acct-item" type="button" data-acct="settings" role="menuitem"><span class="acct-ico" data-ico="settings" aria-hidden="true"></span>Settings</button>
            <button class="acct-item" type="button" data-acct="language" role="menuitem"><span class="acct-ico" data-ico="globe" aria-hidden="true"></span>Language<span class="acct-code" id="acctLangCode">EN</span></button>
            <div class="acct-sep"></div>
            <button class="acct-item" type="button" data-acct="logout" role="menuitem"><span class="acct-ico" data-ico="logout" aria-hidden="true"></span>Log out</button>
          </div>
          <button class="passport-chip" id="passportChip" type="button" aria-haspopup="menu" aria-expanded="false" title="Account &amp; system">
            <span class="avatar" aria-hidden="true"></span>
            <span class="who">
              <b id="passportName">Passport</b>
              <span id="passportSub">not yet wired</span>
            </span>
            <span class="acct-caret" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="topbar">
        <div class="topbar-title">
          <h1 id="destTitle">Overwatch</h1>
          <p class="sub" id="destSub">Loading…</p>
        </div>
        <form class="searchstub" id="searchStub" role="search" aria-label="Search">
          <span class="ss-ico" aria-hidden="true"></span>
          <input class="ss-input" id="searchStubInput" type="search" placeholder="Search facts, plans, receipts…" aria-label="Search query" autocomplete="off">
          <kbd>⌘K</kbd>
        </form>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Phone tier (max-width:720px): fixed bottom tab bar + "More" bottom sheet.
       Inert on desktop (CSS display:none). The tab bar carries four ≥44px targets
       (Overwatch · Work · Trust · More); "More" opens the sheet, which lists the
       remaining destinations (Memory · Meters · System) plus the passport chip +
       theme switch relocated from the rail. Built + wired by the script below. -->
  <nav class="tabbar" id="tabbar" aria-label="Primary (mobile)"></nav>
  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <aside class="sheet" id="moreSheet" role="dialog" aria-modal="true" aria-label="More destinations" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-title">More</div>
    <div class="sheet-nav" id="sheetNav"></div>
    <div class="sheet-chrome" id="sheetChromeSlot"></div>
  </aside>

<!-- No-build module split, served same-origin (console.rs embeds these). api.js
     is the generated allowlist fetch client (must load first — pages/render use
     window.CruxApi); pages.js carries the ported 26-page registry; render.js is
     the DSL renderer. -->
<script src="/console-v2/api.js"></script>
<script src="/console-v2/pages.js"></script>
<script src="/console-v2/render.js"></script>
