      if (cur == null) return undefined;
      cur = cur[path[i]];
    }
    return cur;
  }
  function fmtNum(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    try { return n.toLocaleString('en-US'); } catch (e) { return String(n); }
  }
  function fmtPct(ratio) {
    if (typeof ratio !== 'number' || !isFinite(ratio)) return '—';
    return (ratio * 100).toFixed(ratio < 0.1 ? 1 : 0) + '%';
  }
  function fmtBytes(b) {
    if (typeof b !== 'number' || !isFinite(b) || b < 0) return '—';
    var u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], i = 0, v = b;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
  }
  function str(v) { return (v == null || v === '') ? '—' : String(v); }

  // ---- Network: never throws, never spams the console. Reads go through the
  // generated allowlist client (window.CruxApi) — no raw fetches (M2 gate).
  function fetchJSON(url) {
    var api = (typeof window !== 'undefined') ? window.CruxApi : null;
    if (!api || typeof api.get !== 'function') { return Promise.resolve({ ok: false, status: 0, data: null }); }
    return api.get(url)
      .then(function (r) {
        // Session gate (oauth2-proxy) bounces an unauthenticated read with a 302
        // to /oauth2/sign_in; the browser follows it, so we land on the login
        // page as a "200" HTML body (r.redirected true, r.url the gate). Flag it
        // so the shell surfaces a signed-out state instead of a null-data panel.
        var authRequired = !!(r.redirected && /\/oauth2\//.test(r.url));
        return r.json().then(
          function (data) { return { ok: r.ok, status: r.status, data: data, authRequired: authRequired }; },
          function () { return { ok: r.ok, status: r.status, data: null, authRequired: authRequired }; }
        );
      })
      .catch(function () { return { ok: false, status: 0, data: null }; });
  }

  // ---- Renderers ---------------------------------------------------------
  function buildRail() {
    var nav = document.getElementById('nav');
    nav.textContent = '';
    RAIL_MODE = 'dest';   // restored to the destination nav
    for (var i = 0; i < DESTS.length; i++) {
      var item = DESTS[i];
      if (item.railHidden) { continue; }   // reachable via search / Explore menu, not the Command rail
      var btn = el('button', {
        'class': 'nav-item', type: 'button', 'data-dest': item.id, 'aria-current': 'false',
        title: item.label   // tooltip — the only label shown when the rail is collapsed
      });
      btn.innerHTML = ICONS[item.icon] || '';   // inline SVG glyph
      btn.appendChild(el('span', { 'class': 'label', text: item.label }));
      if (item.key) { btn.appendChild(el('span', { 'class': 'kbd', text: item.key })); }
      (function (id) {
        btn.addEventListener('click', function () { location.hash = '#/' + id; });
      })(item.id);
      nav.appendChild(btn);
    }
    applyPosture(nav);
  }

  function buildThemeSwitch() {
    var wrap = document.getElementById('themeSwitch');
    wrap.textContent = '';
    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      var b = el('button', {
        'class': 'theme-btn', type: 'button', 'data-theme': t.id,
        'aria-pressed': 'false', 'aria-label': t.label + ' theme', title: t.label + ' theme',
        html: ICONS[t.icon] || ''
      });
      (function (id) {
        b.addEventListener('click', function () { applyTheme(id); });
      })(t.id);
      wrap.appendChild(b);
    }
  }

  function setHealth(kind, text) {
    var box = document.getElementById('health');
    box.className = 'health ' + kind;
    document.getElementById('healthText').textContent = text;
  }

  // Session expired: oauth2-proxy is bouncing every /v1 read to its sign-in page
  // (see fetchJSON's authRequired). Rather than a silent "Degraded" pill over
  // empty panels, show a fixed banner with a one-click return through the gate —
  // rd brings the operator back to this exact view after signing in.
  // ponytail: detected once at boot (the gate is origin-wide, so the summary read
  // is a faithful oracle); a mid-session expiry isn't caught until the next load —
  // add per-read detection only if that proves common in practice.
  function showAuthBanner() {
    if (document.getElementById('authBanner')) { return; }
    var bar = el('div', { id: 'authBanner', role: 'alert' });
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px 16px;background:var(--crit);color:#fff;font:600 14px/1.4 system-ui,-apple-system,sans-serif';
    bar.appendChild(el('span', { text: 'Your session has expired — the console is showing no live data.' }));
    var a = el('a', { href: '/oauth2/sign_in?rd=' + encodeURIComponent(location.href), text: 'Sign in' });
    a.style.cssText = 'color:#fff;font-weight:800;text-decoration:underline;white-space:nowrap';
    bar.appendChild(a);
    document.body.appendChild(bar);
  }

  // ---- Status pill (top-right) -------------------------------------------
  // No address / node-id in the text — origin + node id now live on the System
  // destination. States: Connected · Local (auth 'off') / Connected · Platform
  // (any other auth) / Degraded (reachable, no summary) / Offline (unreachable);
  // a "· read-only" suffix rides along whenever posture is customer.
  function setStatusPill() {
    var authMode = get(BOOT.summary, ['daemon', 'auth_mode']);
    var kind, text;
    if (BOOT.health === 'auth') { kind = 'down'; text = 'Signed out'; }
    else if (BOOT.health === 'down') { kind = 'down'; text = 'Offline'; }
    else if (BOOT.health === 'degraded') { kind = 'degraded'; text = 'Degraded'; }
    else { kind = 'ok'; text = 'Connected · ' + (authMode === 'off' ? 'Local' : 'Platform'); }
    if (POSTURE === 'customer') { text += ' · read-only'; }
    setHealth(kind, text);
  }

  // ---- Top-bar chips -----------------------------------------------------
  // Compact mono chips in the right cluster: the build / auth-mode / dataplane
  // facts that used to be landing tiles, plus the DEMO DATA chip when demo mode
  // is on. Every chip is real boot data; a chip is omitted when its value is
  // unknown (never fabricated).
  function iconChip(iconKey, title, on) {
    var c = el('span', { 'class': 'topchip icon-chip' + (on ? ' on' : ''), title: title, role: 'img', 'aria-label': title });
    c.innerHTML = ICONS[iconKey] || '';
    return c;
  }
  function setTopChips() {
    var host = document.getElementById('topchips');
    if (!host) { return; }
    host.textContent = '';
    // auth + dataplane as icon chips (real boot facts; value in the tooltip).
    // DEMO DATA + version chips are gone — demo shows per-tile, version is in the brand.
    var authMode = get(BOOT.summary, ['daemon', 'auth_mode']);
    var dataplane = get(BOOT.summary, ['daemon', 'dataplane_enabled']);
    if (authMode != null) { host.appendChild(iconChip('lock', 'auth: ' + authMode, authMode !== 'off')); }
    if (dataplane != null) { host.appendChild(iconChip('dataplane', 'dataplane: ' + (dataplane ? 'on' : 'off'), !!dataplane)); }
  }
  // Brand identity: "Crux Console" when hosted from a platform (auth on), "Crux
  // Daemon" when served by a local daemon (auth off). Subtitle carries the version.
  function setBrand() {
    var nameEl = document.querySelector('.brand .name');
    if (!nameEl) { return; }
    var authMode = get(BOOT.summary, ['daemon', 'auth_mode']);
    var hosted = authMode != null && authMode !== 'off';
    var version = get(BOOT.version, ['version']) || get(BOOT.summary, ['daemon', 'build', 'version']);
    var verStr = version ? ('v' + String(version).replace(/^v/, '')) : 'v2';
    nameEl.textContent = hosted ? 'Crux Console' : 'Crux Daemon';
    nameEl.appendChild(el('small', { text: 'Unified ' + verStr }));
  }

  // ---- Collapsible rail --------------------------------------------------
  // A chevron toggle collapses the rail to an icon-only ~64px column. State
  // persists in localStorage (crux.console.rail); a pre-paint script mirrors it
  // onto <html data-rail> before first paint. Phone tier (<720px) hides the
  // rail entirely, so this is desktop-only (CSS guards to min-width:721px).
  var LS_RAIL = 'crux.console.rail';
  function readRail() {
    // Default collapsed; only an explicit persisted 'open' keeps the rail open.
    try { return localStorage.getItem(LS_RAIL) === 'open' ? 'open' : 'collapsed'; }
    catch (e) { return 'collapsed'; }
  }
  function applyRail(state) {
    var collapsed = state === 'collapsed';
    document.documentElement.setAttribute('data-rail', collapsed ? 'collapsed' : 'open');
    try { localStorage.setItem(LS_RAIL, collapsed ? 'collapsed' : 'open'); } catch (e) { /* private mode */ }
    var btn = document.getElementById('railToggle');
    if (btn) {
      var lbl = collapsed ? 'Expand navigation' : 'Collapse navigation';
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      btn.setAttribute('aria-label', lbl);
      btn.setAttribute('title', lbl);
    }
  }
  function initRail() {
    var btn = document.getElementById('railToggle');
    if (btn) {
      btn.innerHTML = ICONS.chevron;
      btn.addEventListener('click', function () {
        applyRail(document.documentElement.getAttribute('data-rail') === 'collapsed' ? 'open' : 'collapsed');
      });
    }
    applyRail(readRail());
  }

  // ---- Demo mode (labelled, gated) --------------------------------------
  // ?demo=1 turns on labelled demo fixtures (persisted to localStorage); ?demo=0
  // clears. The flag lives on window.CRUX_DEMO. Fixtures themselves live in
  // CruxDemo (pages.js) and are read ONLY by render.js behind this flag; real
  // data always wins where an endpoint answers.
  var LS_DEMO = 'crux.console.demo';
  function initDemo() {
    var on = false;
    try {
      var q = location.search || '';
      if (/[?&]demo=1\b/.test(q)) { localStorage.setItem(LS_DEMO, '1'); }
      else if (/[?&]demo=0\b/.test(q)) { localStorage.removeItem(LS_DEMO); }
      on = localStorage.getItem(LS_DEMO) === '1';
    } catch (e) { on = /[?&]demo=1\b/.test(location.search || ''); }
    if (typeof window !== 'undefined') { window.CRUX_DEMO = on; }
  }

  // ---- Phone tier: bottom tab bar + "More" sheet ------------------------
  // The tab bar mirrors three destinations directly (Overwatch · Work · Trust);
  // every other destination (Memory · Meters · System) lives behind "More". The
  // set is data-driven from DESTS so a new destination is one registry edit.
  var TAB_DEST_IDS = ['overwatch', 'work', 'trust'];   // the three direct tabs; rest → "More"
  function isMoreDest(id) { return TAB_DEST_IDS.indexOf(id) < 0; }

  function buildTabbar() {
    var bar = document.getElementById('tabbar');
    if (!bar) { return; }
    bar.textContent = '';
    var tabs = [];
    for (var i = 0; i < TAB_DEST_IDS.length; i++) {
      var d = DEST_INDEX[TAB_DEST_IDS[i]];
      if (d) { tabs.push({ kind: 'dest', id: d.id, label: d.label, icon: d.icon }); }
    }
    tabs.push({ kind: 'more', id: 'more', label: 'More', icon: 'more' });   // 4th tab
    for (var j = 0; j < tabs.length; j++) {
      var t = tabs[j];
      var btn = el('button', { 'class': 'tab', type: 'button', 'data-tab': t.id, 'aria-current': 'false' });
      btn.innerHTML = ICONS[t.icon] || '';
      btn.appendChild(el('span', { 'class': 'tab-label', text: t.label }));
      (function (tab) {
        btn.addEventListener('click', function () {
          if (tab.kind === 'more') { openSheet(); }
          else { closeSheet(); location.hash = '#/' + tab.id; }
        });
      })(t);
      bar.appendChild(btn);
    }
  }

  function buildSheetNav() {
    var host = document.getElementById('sheetNav');
    if (!host) { return; }
    host.textContent = '';
    for (var i = 0; i < DESTS.length; i++) {
      var d = DESTS[i];
      if (!isMoreDest(d.id) || d.railHidden) { continue; }   // only non-tab, non-rail-hidden destinations
      var btn = el('button', { 'class': 'sheet-item', type: 'button', 'data-dest': d.id, 'aria-current': 'false' });
      btn.innerHTML = ICONS[d.icon] || '';
      btn.appendChild(el('span', { 'class': 'label', text: d.label }));
      (function (id) {
        btn.addEventListener('click', function () { closeSheet(); location.hash = '#/' + id; });
      })(d.id);
      host.appendChild(btn);
    }
  }

  function openSheet() {
    var sheet = document.getElementById('moreSheet');
    var scrim = document.getElementById('sheetScrim');
    if (sheet) { sheet.hidden = false; }
    if (scrim) { scrim.hidden = false; }
  }
  function closeSheet() {
    var sheet = document.getElementById('moreSheet');
    var scrim = document.getElementById('sheetScrim');
    if (sheet) { sheet.hidden = true; }
    if (scrim) { scrim.hidden = true; }
  }

  // Reflect the active destination in the tab bar + sheet (mirrors aria-current).
  // The "More" tab is current whenever the active destination lives in the sheet.
  function syncMobileChrome(destId) {
    var tabs = document.querySelectorAll('#tabbar .tab');
    for (var i = 0; i < tabs.length; i++) {
      var id = tabs[i].getAttribute('data-tab');
      var on = (id === 'more') ? isMoreDest(destId) : (id === destId);
      tabs[i].setAttribute('aria-current', on ? 'page' : 'false');
    }
    var items = document.querySelectorAll('#sheetNav .sheet-item');
    for (var j = 0; j < items.length; j++) {
      items[j].setAttribute('aria-current', items[j].getAttribute('data-dest') === destId ? 'page' : 'false');
    }
  }

  // Relocate the SAME passport-chip + theme-switch nodes between the rail footer
  // (desktop) and the sheet (phone) — one instance, so applyTheme's #themeSwitch
  // query and passport updates keep working after the move.
  function placeMobileChrome(isPhone) {
    var acct = document.getElementById('acctWrap');
    var slot = document.getElementById('sheetChromeSlot');
    var footer = document.querySelector('.rail-footer');
    if (!acct) { return; }
    if (isPhone && slot) { slot.appendChild(acct); }
    else if (footer) { footer.appendChild(acct); }
  }

  // ---- Sub-nav (pill row) + page render ----------------------------------
  function buildSubnav(destId, activePageId) {
    var row = el('div', { 'class': 'subnav', role: 'tablist', 'aria-label': 'Pages in this destination' });
    var list = pagesForDest(destId);
    var pro = (typeof window !== 'undefined' && window.CRUX_MODE === 'professional');
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      // Standard mode: pages tagged pill:false are folded out of the pill row
      // (reachable via the landing / direct hash), and pro:true ported pages are
      // hidden entirely. Professional mode shows ALL pages of the destination as
      // pills — incl. the pill:false cx-overview and the ported Pro pages.
      if (!pro) {
        if (p.pill === false) { continue; }
        if (p.pro === true) { continue; }
      }
      var pill = el('button', {
        'class': 'pill', type: 'button', 'data-page': p.id,
        'aria-current': p.id === activePageId ? 'page' : 'false'
      }, [p.title]);
      if (p.operatorOnly) { pill.setAttribute('data-requires', 'operator'); }   // hidden for customers
      (function (dest, pid) {
        pill.addEventListener('click', function () { location.hash = '#/' + dest + '/' + pid; });
      })(destId, p.id);
      row.appendChild(pill);
    }
    applyPosture(row);
    return row;
  }

  function renderDestination(destId, pageId) {
    // Leaving Documents mode: restore the destination nav into the rail (it was
    // swapped to the document tree by renderDocumentsRoute).
    if (RAIL_MODE === 'docs') { buildRail(); }
    var dest = DEST_INDEX[destId] || DESTS[0];
    destId = dest.id;
    var page = PAGES[pageId];
    if (!page || page.dest !== destId) { pageId = firstPageId(destId); page = PAGES[pageId]; }
    // A Pro-only page directly routed in Standard mode redirects to the
    // destination's default page (presentation gate — never a posture gate).
    if (page && page.pro === true && !(typeof window !== 'undefined' && window.CRUX_MODE === 'professional')) {
      pageId = firstPageId(destId); page = PAGES[pageId];
    }

    // Rail active state.
    var btns = document.querySelectorAll('#nav .nav-item');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-current', btns[i].getAttribute('data-dest') === destId ? 'page' : 'false');
    }
    syncMobileChrome(destId);   // mirror active dest into the phone tab bar + sheet

    var content = document.getElementById('content');
    content.textContent = '';

    // Canvas (M9): no sub-pills — Canvas IS the page. Parse view + focus from the
    // live hash and hand off to render.js renderCanvas (Board | Graph).
    if (destId === 'canvas') {
      var cr = parseCanvasHash(location.hash);
      document.getElementById('destTitle').textContent = dest.label;
      document.getElementById('destSub').textContent = cr.view === 'graph'
        ? 'Relation graph — real edges only (projects ⋈ work ⋈ gates ⋈ passports ⋈ sessions)'
        : 'Tile canvas — drag, pan, expand in place; composes to your viewport (4K+ = the full board)';
      var canvasHost = el('div', { 'class': 'canvas-region-host', id: 'canvasHost' });
      content.appendChild(canvasHost);
      if (window.CruxRender && window.CruxRender.renderCanvas) {
        window.CruxRender.renderCanvas(canvasHost, { summary: BOOT.summary, view: cr.view, focus: cr.focus });
      } else {
        canvasHost.appendChild(el('p', { 'class': 'v2card-sub', text: 'Renderer module unavailable.' }));
      }
      applyPosture(content);
      if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
      return;
    }

    // Explorer (M11): no sub-pills — Explorer IS the page. A search box + a
    // Local | WikiCrux backend toggle + a budget control; results render as
    // cards. Reads only, so it shows in every posture. Delegates to render.js
    // renderExplorer (search runs through render.js's curated read-POST client).
    if (destId === 'explorer') {
      document.getElementById('destTitle').textContent = dest.label;
      document.getElementById('destSub').textContent = dest.sub || '';
      var explorerHost = el('div', { 'class': 'explorer-region-host', id: 'explorerHost' });
      content.appendChild(explorerHost);
      if (window.CruxRender && window.CruxRender.renderExplorer) {
        window.CruxRender.renderExplorer(explorerHost, { summary: BOOT.summary });
      } else {
        explorerHost.appendChild(el('p', { 'class': 'v2card-sub', text: 'Renderer module unavailable.' }));
      }
      applyPosture(content);
      if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
      return;
    }

    // Site map — no sub-pills: it IS a static reference page (the flat rail
    // rearranged into 5 destinations + System). Reads nothing; every posture.
    if (destId === 'sitemap') {
      document.getElementById('destTitle').textContent = dest.label;
      document.getElementById('destSub').textContent = dest.sub || '';
      var mapHost = el('div', { 'class': 'sitemap-region-host', id: 'sitemapHost' });
      content.appendChild(mapHost);
      if (window.CruxRender && window.CruxRender.renderSiteMap) {
        window.CruxRender.renderSiteMap(mapHost, { summary: BOOT.summary });
      } else {
        mapHost.appendChild(el('p', { 'class': 'v2card-sub', text: 'Renderer module unavailable.' }));
      }
      applyPosture(content);
      if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
      return;
    }

    // Rings (prototype) — no sub-pills: it IS the page. The self-contained
    // rings-clock landing mock is rendered in an isolated iframe. The payload
    // ships base64 (CruxPages.RINGS_HTML_B64, escaping-proof) but is injected
    // via `srcdoc` rather than a data: URL: srcdoc documents INHERIT the
    // console's origin, so the mock's same-origin fetches (/v1/work,
    // /v1/console/summary) reach the daemon and swap its embedded snapshot
    // for live data. A data: URL is an opaque origin and cannot do that.
    if (destId === 'rings') {
      document.getElementById('destTitle').textContent = dest.label;
      document.getElementById('destSub').textContent = dest.sub || '';
      var ringsHost = el('div', { 'class': 'rings-region-host', id: 'ringsHost' });
      var ringsB64 = CP.RINGS_HTML_B64 || '';
      if (ringsB64) {
        var frame = el('iframe', {
          'class': 'rings-frame', id: 'ringsFrame', title: 'Rings-clock landing prototype',
          loading: 'lazy'
        });
        try {
          frame.srcdoc = new TextDecoder().decode(
            Uint8Array.from(atob(ringsB64), function (c) { return c.charCodeAt(0); }));
        } catch (e) {
          frame.src = 'data:text/html;charset=utf-8;base64,' + ringsB64; // fallback: snapshot-only
        }
        ringsHost.appendChild(frame);
      } else {
        ringsHost.appendChild(el('p', { 'class': 'v2card-sub', text: 'Rings prototype asset unavailable.' }));
      }
      content.appendChild(ringsHost);
      applyPosture(content);
      if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
      return;
    }

    document.getElementById('destTitle').textContent = page ? page.title : dest.label;
    document.getElementById('destSub').textContent = page ? (page.sub || '') : (dest.sub || '');
    // Overwatch is the real landing: Daemon-at-a-glance tiles → Needs-you + Fleet
    // (left) → the destination page nav (right). The page nav lives IN the landing
    // (owPageNav), so the top sub-nav pill row is suppressed for overwatch only —
    // every other destination keeps its pills. cx-overview etc. still render below.
    if (destId === 'overwatch' && window.CruxRender && window.CruxRender.renderOverwatchLanding) {
      var landing = el('div', { 'class': 'ow-landing-region', id: 'owLanding' });
      content.appendChild(landing);
      window.CruxRender.renderOverwatchLanding(landing, { summary: BOOT.summary });
    }
    if (destId !== 'overwatch') { content.appendChild(buildSubnav(destId, pageId)); }
    // Settings owns the Command-density switch (moved off the top-level toggle).
    if (destId === 'system' && page && page.id === 'cx-settings') { content.appendChild(buildDensityCard()); content.appendChild(buildThemeCard()); }
    // Overwatch IS its landing (tiles + view tabs) — don't also render the resolved
    // page below it (that duplicated the Activity page's Live-activity card).
    if (destId !== 'overwatch') {
      var host = el('div', { 'class': 'page-host', id: 'pageHost' });
      content.appendChild(host);
      if (window.CruxRender && page) { window.CruxRender.renderPage(page, host); }
      else if (page) { host.appendChild(el('p', { 'class': 'v2card-sub', text: 'Renderer module unavailable.' })); }
    }
    applyPosture(content);
    if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
  }

  function currentRoute() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var qi = h.indexOf('?');
    if (qi >= 0) { h = h.slice(0, qi); }   // strip a query (Canvas graph carries ?focus=)
    var parts = h.split('/').filter(Boolean);
    var destId = DEST_INDEX[parts[0]] ? parts[0] : (DESTS[0] && DESTS[0].id);
    var pageId = (parts[1] && PAGES[parts[1]] && PAGES[parts[1]].dest === destId) ? parts[1] : firstPageId(destId);
    return { dest: destId, page: pageId };
  }

  // Canvas (M9) parses its own hash: #/canvas/<view>?focus=<type>:<id>. The view
  // is the nav-family Board|Graph switch; the focus (graph only) is parsed by the
  // pure render.js parseFocus so board/graph share one deep-link grammar.
  function parseCanvasHash(hash) {
    var h = (hash || '').replace(/^#\/?/, '');
    var q = '';
    var qi = h.indexOf('?');
    if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
    var parts = h.split('/').filter(Boolean);
    var view = (parts[1] === 'graph') ? 'graph' : (parts[1] === 'tree') ? 'tree' : 'board';
    var focus = null;
    var m = q.match(/(?:^|&)focus=([^&]+)/);
    if (m) {
      var raw;
      try { raw = decodeURIComponent(m[1]); } catch (e) { raw = m[1]; }
      focus = (window.CruxRender && window.CruxRender.parseFocus) ? window.CruxRender.parseFocus(raw) : null;
    }
    return { view: view, focus: focus };
  }

  // Route. Documents mode (M10) is presentation: it renders the reader instead of
  // a destination surface, entered via the mode segment (#/documents) or by being
  // in documents mode. A deep link to any real #/<destination> while in Documents
  // mode AUTO-SWITCHES the mode back to standard (destinations win over the reader
  // — mode is presentation, not a route). #/documents[/<docId>] keeps the reader.
  function route() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var qi = h.indexOf('?'); if (qi >= 0) { h = h.slice(0, qi); }
    var parts = h.split('/').filter(Boolean);
    var first = parts[0];
    var inDocsMode = (typeof window !== 'undefined' && window.CRUX_MODE === 'documents');
    var docsHash = first === 'documents';
    if (docsHash || inDocsMode) {
      if (first && !docsHash && DEST_INDEX[first]) {
        if (inDocsMode) { setModeSilently('standard'); }   // deep-link-out auto-switch
        // fall through to the normal destination render below
      } else {
        if (!inDocsMode) { setModeSilently('documents'); }
        renderDocumentsRoute(parts[1]);
        return;
      }
    }
    var r = currentRoute();
    renderDestination(r.dest, r.page);
  }

  // Documents-mode render: swap the rail to the document tree (render.js builds
  // it into #nav) and render the reader into #content. Presentation only.
  function renderDocumentsRoute(docId) {
    RAIL_MODE = 'docs';
    var isExplorer = (docId === 'explorer');
    document.getElementById('destTitle').textContent = isExplorer ? 'Explorer' : 'Documents';
    document.getElementById('destSub').textContent = isExplorer
      ? 'search facts, living objects and articles across the corpus'
      : 'Reader — real corpora + bundled reference docs';
    var content = document.getElementById('content');
    content.textContent = '';
    var host = el('div', { 'class': 'doc-region-host', id: 'docHost' });
    content.appendChild(host);
    var nav = document.getElementById('nav');
    if (window.CruxRender && window.CruxRender.renderDocuments) {
      window.CruxRender.renderDocuments(host, {
        summary: BOOT.summary,
        docId: docId ? decodeURIComponent(docId) : null,
        railHost: nav
      });
    } else {
      host.appendChild(el('p', { 'class': 'v2card-sub', text: 'Renderer module unavailable.' }));
    }
    syncMobileChrome(null);   // no destination is active in the phone tab bar
    if (typeof content.scrollTo === 'function') { content.scrollTo(0, 0); }
  }

  // ---- Keyboard shortcuts 1..5 ------------------------------------------
  function onKey(ev) {
    if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (ev.target && ev.target.isContentEditable)) return;
    var dest = KEY_TO_DEST[ev.key];
    if (dest) { location.hash = '#/' + dest; ev.preventDefault(); }
  }

  // ---- Boot --------------------------------------------------------------
  function boot() {
    return Promise.all([fetchJSON('/v1/version'), fetchJSON('/v1/console/summary')])
      .then(function (res) {
        var ver = res[0], sum = res[1];
        if (ver && ver.data) { BOOT.version = ver.data; }
        window.CRUX_RUNTIME_CAPABILITIES = get(BOOT.version, ['product', 'runtime_capabilities']) || null;
        if (sum && sum.ok && sum.data) { BOOT.summary = sum.data; }
        var reachable = (ver && ver.status !== 0) || (sum && sum.status !== 0);
        // Origin-wide session gate: if the summary read was bounced to sign-in
        // (or hard 401/403), the operator is signed out — every /v1 read is dead,
        // so surface it as an actionable signed-out state, not a silent Degraded.
        var signedOut = !!(sum && (sum.authRequired || sum.status === 401 || sum.status === 403));
        if (signedOut) {
          BOOT.health = 'auth';
          showAuthBanner();
        } else if (!reachable) {
          BOOT.health = 'down';
        } else if (BOOT.summary) {
          BOOT.health = 'ok';
          var pv = get(BOOT.version, ['version']) || get(BOOT.summary, ['daemon', 'build', 'version']);
          if (pv) { document.getElementById('passportSub').textContent = 'node build ' + pv; }
        } else {
          BOOT.health = 'degraded';
        }
        setStatusPill();
        setTopChips();
        setBrand();
        route();
        // Derive posture from the server, then re-render with it (nav + pills +
        // landing + mutating controls all follow). Never blocks the first paint.
        return derivePostureFromServer().then(applyDerivedPosture);
      });
  }

  // operator ⟺ auth_mode 'off' (unauthenticated local instance) OR the admin-scoped capability probe
  // (GET /v1/admin/version) resolves 200. The derivation logic itself lives in
  // render.js (derivePosture, unit-tested); this only feeds it the probe.
  function derivePostureFromServer() {
    var authMode = get(BOOT.summary, ['daemon', 'auth_mode']);
    var derive = (window.CruxRender && window.CruxRender.derivePosture)
      || function (p) { return (p && (p.authMode === 'off' || p.adminProbeStatus === 200)) ? 'operator' : 'customer'; };
    if (authMode === 'off') {
      return Promise.resolve(derive({ authMode: authMode }));
    }
    return fetchJSON('/v1/admin/version').then(function (r) {
      return derive({ authMode: authMode, adminProbeStatus: r.status });
    });
  }

  function applyDerivedPosture(p) {
    setPosture(p);
    var authMode = get(BOOT.summary, ['daemon', 'auth_mode']);
    var name = (p === 'operator') ? 'Operator' : 'Customer';
    var sub = (p === 'operator') ? (authMode === 'off' ? 'operator · local' : 'operator · admin') : 'customer view';
    var nameEl = document.getElementById('passportName');
    var subEl = document.getElementById('passportSub');
    if (nameEl) { nameEl.textContent = name; }
    if (subEl) { subEl.textContent = sub; }
    setStatusPill();   // posture drives the "· read-only" suffix
    applyPosture(document);
    route();   // re-render nav/pills/landing under the derived posture
  }

  // ---- Init --------------------------------------------------------------
  function init() {
    initDemo();   // set window.CRUX_DEMO before any module render reads it
    initMode();   // set window.CRUX_MODE + build the mode segmented control before first render
    document.querySelector('.brand .mark').innerHTML = ICONS.logo;
    document.querySelector('.passport-chip .avatar').innerHTML = ICONS.passport;
    initSearchStub();   // wire the top-right search stub → Explorer
    wireTopbarScroll(); // transparent top bar → glass on scroll
    buildRail();
    initThemeCycle();          // rail theme-cycle icon (theme picker lives in Settings)
    applyTheme(readTheme());
    initAcctMenu();            // bottom account roll-up (Settings · Language · Log out)
    initRail();       // collapsible rail (persisted, desktop-only)
    setTopChips();    // paint the DEMO chip (+ any cached facts) immediately
    // Phone tier: build the tab bar + sheet, place the passport/theme chrome for
    // the current breakpoint, and keep it in sync as the viewport crosses 720px.
    buildTabbar();
    buildSheetNav();
    var mqPhone = window.matchMedia ? window.matchMedia('(max-width: 720px)') : null;
    placeMobileChrome(!!(mqPhone && mqPhone.matches));
    if (mqPhone) {
      var onMq = function (e) { placeMobileChrome(e.matches); if (!e.matches) { closeSheet(); } };
      if (mqPhone.addEventListener) { mqPhone.addEventListener('change', onMq); }
      else if (mqPhone.addListener) { mqPhone.addListener(onMq); }   // Safari < 14
    }
    var scrim = document.getElementById('sheetScrim');
    if (scrim) { scrim.addEventListener('click', closeSheet); }
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', onKey);
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { closeSheet(); } });
    route();   // paint the shell immediately; boot() fills in live data
    boot();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<!-- PWA service-worker registration (M5). Feature-detected; secure-context only
     (https or localhost); silent on every path — a console SPA must never spam the
     console. SW_REV MUST stay byte-equal to sw.js's SW_REV (a console.rs marker
     test + smoke.cjs assert equality; bump both together — no build step injects a
     hash). We register with scope '/console' (the daemon serves sw.js with
     Service-Worker-Allowed: /console) and cache-bust the script URL with ?rev. -->
<script>
(function () {
  'use strict';
  var SW_REV = 'ushell-v2-r13';   // keep in lock-step with /console-v2/sw.js
  if (!('serviceWorker' in navigator)) { return; }
  // Dev bypass — when the daemon serves this shell from CORECRUXD_CONSOLE_DEV_PATH
  // it stamps window.__CRUX_CONSOLE_DEV__ (see console.rs inject_console_dev_flag).
  // In that mode never register a worker, and tear down any existing worker + its
  // caches, so hot-reloaded edits always show on a plain refresh. Production never
  // sets the flag, so the PWA service worker behaves exactly as before.
  if (window.__CRUX_CONSOLE_DEV__) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      for (var i = 0; i < rs.length; i++) { rs[i].unregister(); }
    }, function () {});
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        for (var j = 0; j < ks.length; j++) { caches.delete(ks[j]); }
      }, function () {});
    }
    return;
  }
  var host = location.hostname;
  var secure = location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/console-v2/sw.js?rev=' + encodeURIComponent(SW_REV), { scope: '/console' })
      .then(function () {}, function () {});   // silent on success + failure
  });
})();
</script>
</body>
</html>
