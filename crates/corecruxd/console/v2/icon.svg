<!-- Unified Shell Console v2 app icon (ExecPlan unified-shell-console-2026-07-03, M5).
     The C-with-spoke mark from the shell's ICONS.logo path, scaled into the icon
     safe zone (mark spans ~59% of the canvas, centred at 256,256) on the Glass
     theme background (#060A12) rounded square. Declared purpose "any"; the mark
     sits deep enough in the centre to stay maskable-safe if a platform crops it.
     Fully self-contained — no external references (strict-CSP posture). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crux Console">
  <defs>
    <linearGradient id="crux-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CA8FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- #060A12 rounded square (Glass theme background token). -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#060A12"/>
  <!-- The exact ICONS.logo path data, scaled from the 24-grid into the safe zone
       (circle centre 12,12 -> 256,256; radius 9 -> 150). Stroke 1.5 * 16.6667 ~ 25px. -->
  <g transform="translate(56,56) scale(16.6667)"
     fill="none" stroke="url(#crux-mark)" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a9 9 0 1 0 9 9"/>
    <path d="M12 3v9l6 3"/>
  </g>
</svg>
