[package]
name = "crux-claude-hooks"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claude Code lifecycle hooks for the Crux Daemon. Surfaces operational warnings and wires SessionStart/PreCompact to the Crux MCP tool surface."

[[bin]]
name = "crux-hook"
path = "src/main.rs"

# G17 local-LLM context-injection shim (ExecPlan
# context-mediation-injection-2026-06-11, M4). Default-OFF via CRUX_LLM_SHIM=1;
# upstream allowlist localhost/RFC1918 only. Lives in this crate (the
# agent-harness surface crate) deliberately: zero new deps, zero Cargo.lock
# delta while concurrent agents hold claims on corecruxd + the lockfile.
[[bin]]
name = "crux-llm-shim"
path = "src/bin/crux_llm_shim.rs"

[lib]
name = "crux_claude_hooks"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ureq = { workspace = true, features = ["json"] }
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std", "pkcs8"] }
# Hosted compaction-snapshot sync (ExecPlan hosted-compaction-sync-encrypted-2026-07-17):
# client-side AEAD envelope. Both are already in the workspace Cargo.lock
# (chacha20poly1305 via corecruxd/crux-mcp/crux-sync; crux-session is in-workspace
# and deps only blake3+ed25519-dalek, both already direct deps here) — zero new
# external crate. crux-session provides LocalPassportKey::derive_subkey (the
# passport-seed KDF used to derive the snapshot content key).
# features=["zeroize"] wipes the AEAD cipher's key material on drop (Finding 3).
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
# Zeroize the derived snapshot content key on drop (crypto-review follow-up).
# zeroize 1.8.x is already in the workspace Cargo.lock (pulled by chacha20poly1305
# et al.) — version-pinned direct here (not `workspace = true`, no root Cargo.toml
# entry) to add only a single lock dep-edge and avoid root/lockfile churn during
# concurrent agent work, matching this crate's zero-lock-delta convention.
zeroize = "1.8"
crux-session = { path = "../crux-session" }
fs2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# code-intelligence M5: encode `code:<repo>:<path>` entities into the facts URL.
# Already in the workspace lockfile (corecruxctl) — no new network fetch.
urlencoding = { workspace = true }
sha2 = { workspace = true }
# B4 file-modification ledger: content-address Edit/Write before/after for the
# observe lane. Pinned to the workspace version already in Cargo.lock (corecruxd,
# corecrux-storage, …) so this adds zero new network fetch / lockfile delta.
blake3 = { workspace = true }
crux-config-wizard = { path = "../crux-config-wizard" }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
