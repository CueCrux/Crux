[package]
name = "crux-claude-hooks"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claude Code lifecycle hooks for the Crux Daemon. Surfaces operational warnings and wires SessionStart/PreCompact to the Crux MCP tool surface."

[[bin]]
name = "crux-hook"
path = "src/main.rs"

# G17 local-LLM context-injection shim (ExecPlan
# context-mediation-injection-2026-06-11, M4). Default-OFF via CRUX_LLM_SHIM=1;
# upstream allowlist localhost/RFC1918 only. Lives in this crate (the
# agent-harness surface crate) deliberately: zero new deps, zero Cargo.lock
# delta while concurrent agents hold claims on corecruxd + the lockfile.
[[bin]]
name = "crux-llm-shim"
path = "src/bin/crux_llm_shim.rs"

[lib]
name = "crux_claude_hooks"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.3.0", features = ["json"] }
# code-intelligence M5: encode `code:<repo>:<path>` entities into the facts URL.
# Already in the workspace lockfile (corecruxctl) — no new network fetch.
urlencoding = "2.1"
sha2 = "0.11"
# B4 file-modification ledger: content-address Edit/Write before/after for the
# observe lane. Pinned to the workspace version already in Cargo.lock (corecruxd,
# corecrux-storage, …) so this adds zero new network fetch / lockfile delta.
blake3 = "1.8.5"
crux-config-wizard = { path = "../crux-config-wizard" }

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
