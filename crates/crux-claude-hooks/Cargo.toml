[package]
name = "crux-claude-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claude Code lifecycle hooks for the Crux Daemon. Surfaces operational warnings and wires SessionStart/PreCompact to the Crux MCP tool surface."

[[bin]]
name = "crux-hook"
path = "src/main.rs"

[lib]
name = "crux_claude_hooks"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
ureq = { version = "3.3.0", features = ["json"] }
crux-config-wizard = { path = "../crux-config-wizard" }

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
