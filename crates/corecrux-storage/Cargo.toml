[package]
name = "corecrux-storage"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fuzzing = []

[dependencies]
blake3 = "1.8.5"
crc32c = "0.6.8"
fs2 = "0.4.3"
lz4_flex = "0.13.1"
thiserror = "2.0.12"
tracing = "0.1.41"

xxhash-rust = { version = "0.8.12", features = ["xxh64"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-index = { path = "../corecrux-index" }
corecrux-segment = { path = "../corecrux-segment" }

[dev-dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.16.0"

[lints]
workspace = true
