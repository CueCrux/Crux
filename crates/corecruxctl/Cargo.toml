[package]
name = "corecruxctl"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
base64 = "0.22.1"
blake3 = "1.5.1"
clap = { version = "4.5.30", features = ["derive"] }
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
ciborium = "0.2.2"
crc32c = "0.6.8"
ed25519-dalek = { version = "2.2.0", features = ["std"] }
fs2 = "0.4.3"
postgres = "0.19.10"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tempfile = "3.16.0"
tokio = { version = "1.44.0", features = ["net", "rt", "time"] }
tonic = { version = "0.12.3", features = ["transport"] }
ureq = { version = "2.10.1", features = ["json"] }
url = "2.5.7"
urlencoding = "2.1"
uuid = { version = "1.16.0", features = ["v4"] }
xxhash-rust = { version = "0.8.10", features = ["xxh64"] }
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-index = { path = "../corecrux-index" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-proto = { path = "../corecrux-proto" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }
corecrux-types = { path = "../corecrux-types" }

[features]
default = []

[build-dependencies]
anyhow = "1.0.97"

[dev-dependencies]
serial_test = "3"

[lints]
workspace = true
