[package]
name = "corecruxctl"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
# Owns the client-side hook + banner-stack install (assets, settings.json merge).
# corecruxctl is the front door; the wizard crate holds the logic so `crux-hook`,
# which already depends on it, carries the assets to client machines too.
crux-config-wizard = { path = "../crux-config-wizard" }
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true, default-features = false, features = ["clock"] }
ciborium = { workspace = true }
crc32c = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
fs2 = { workspace = true }
postgres = "0.19.10"
serde = { workspace = true, features = ["derive"] }
# Code-intelligence chain extractor (code-health trace, M4). Already in the
# workspace lockfile as a transitive dep — no new network fetch.
syn = { workspace = true, features = ["full", "visit"] }
thiserror = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }
tonic = { workspace = true, features = ["transport"] }
ureq = { workspace = true, features = ["json"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }
zip = { workspace = true, default-features = false, features = ["deflate-flate2"] }
rand = { workspace = true }
sha2 = { workspace = true }

# C2PA X.509 verifier surface (corecruxctl c2pa-verify, c2pa-cert-status,
# c2pa-rotate-leaf — agent-ux-07 M6). Matches the versions in corecrux-receipts.
p256 = { workspace = true, default-features = false, features = ["std", "ecdsa", "pem"] }
x509-cert = { workspace = true, default-features = false, features = ["std", "pem"] }

corecrux-frame = { path = "../corecrux-frame" }
corecrux-index = { path = "../corecrux-index" }
corecrux-memory = { path = "../corecrux-memory" }
corecrux-projections = { path = "../corecrux-projections" }
corecrux-proto = { path = "../corecrux-proto" }
corecrux-receipts = { path = "../corecrux-receipts" }
corecrux-segment = { path = "../corecrux-segment" }
corecrux-storage = { path = "../corecrux-storage" }
corecrux-types = { path = "../corecrux-types" }
crux-cost = { path = "../crux-cost" }
crux-integrations = { path = "../crux-integrations" }
crux-session = { path = "../crux-session" }

[features]
default = []

[build-dependencies]
anyhow = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }

[lints]
workspace = true
