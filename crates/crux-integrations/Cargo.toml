[package]
name = "crux-integrations"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
# c2pa_signer_selector reuses the existing CROWN signer + Vault PKI
# X.509 signer that already live in corecrux-receipts (PR #123).
corecrux-receipts = { path = "../corecrux-receipts" }
# `rand_core` lets the signing helper generate keypairs deterministically
# from caller-supplied RNG (also enables pack-time signing in tools).
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# tracing::warn! breadcrumb when an operator typoes CORECRUX_C2PA_SIGNER.
tracing = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
# The M4 Vault integration test (tests/vault_c2pa_m4_integration.rs,
# #[ignore]-gated) re-verifies the emitted signature against the leaf
# certificate's own public key (parsed from the envelope x5chain via
# x509-cert) as true ES256 (ECDSA-P256 over SHA-256) — without trusting
# the on-disk private key.
p256 = { workspace = true, features = ["std", "ecdsa", "pem"] }
x509-cert = { workspace = true, features = ["std", "pem"] }
# Env-mutation tests in c2pa_signer_selector are serialised so they
# don't race the dual-flag tests in crux-mcp::tools::output_attest.
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
