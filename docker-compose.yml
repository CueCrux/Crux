services:
  crux:
    image: cuecrux/crux-community:latest
    build: .
    ports:
      - "127.0.0.1:14800:14800"
      - "127.0.0.1:14801:14801"
    volumes:
      - crux-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14800/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      - CORECRUXD_DATA_DIR=/data
      - CORECRUXD_AUTH_MODE=dev_scopes
      - CORECRUXD_ALLOW_INSECURE_DEV_AUTH_BIND=1
      - CORECRUXD_HTTP_HOST=0.0.0.0
      - CORECRUXD_GRPC_HOST=0.0.0.0
      - CORECRUXD_MCP_HOST=0.0.0.0
      - CORECRUXD_MCP_PORT=14801
      - CORECRUXD_BUILD_CCXI=1
      - CORECRUX_LOG_FORMAT=json
      # Optional: point at an Ollama instance for dense vector retrieval.
      # - CORECRUXD_EMBEDDING_URL=http://ollama:11434
      # - CORECRUXD_EMBEDDING_MODEL=nomic-embed-text

  # ── Optional: local Ollama for embeddings ──────────────────────
  # Start with:  docker compose --profile embeddings up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Pull the embedding model on first start.
    # Remove or change this if you use a different model.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull nomic-embed-text && wait"]

volumes:
  crux-data:
  ollama-models:
