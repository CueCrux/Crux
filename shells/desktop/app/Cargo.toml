# Crux desktop shell — Tauri v2 wrapper.
#
# Own [workspace] table: this crate is EXCLUDED from the root daemon workspace
# (root Cargo.toml `[workspace].exclude`) and pulls the webkit2gtk / tauri stack,
# which cannot build on a headless WSL dev box. It compiles in CI only
# (.github/workflows/desktop-shell.yml). Validate locally with
# `cargo metadata --no-deps`, not `cargo build`.
[package]
name = "crux-desktop-shell"
version = "0.5.34"
edition = "2021"
rust-version = "1.88.0"
license = "LicenseRef-CCL-1.0"
publish = false
description = "Crux desktop shell — native manager for bundled and attached corecruxd profiles."

[workspace]

[[bin]]
name = "crux-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
crux-shell-lifecycle = { path = "../lifecycle" }
crux-shell-connection = { path = "../connection" }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

[features]
# Enabled by the bundler (`cargo tauri build`) for production asset embedding.
custom-protocol = ["tauri/custom-protocol"]
