<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crux</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0b0f14; color: #c9d4e2;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; text-align: center;
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #6ea8fe; animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .muted { color: #6e7e96; font-size: 13px; }
    </style>
  </head>
  <body>
    <!--
      Placeholder frontend. Tauri requires a `frontendDist` to exist for the
      build, but the real UI is the corecruxd console served over the sidecar's
      loopback port; the shell replaces this window's contents with that origin
      once the daemon is healthy (see src/main.rs). This screen is only ever
      seen briefly (or as a fallback if window replacement is deferred).
    -->
    <div class="wrap">
      <div class="dot"></div>
      <div>Starting the Crux local daemon…</div>
      <div class="muted">This window will open the console once the daemon is ready.</div>
    </div>
  </body>
</html>
