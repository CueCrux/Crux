<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crux</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0b0f14; color: #c9d4e2;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; text-align: center;
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #6ea8fe; animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .muted { color: #6e7e96; font-size: 13px; }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <!--
      Trusted local fallback only. Runtime loading and error states are served
      by the shell-owned loopback proxy so they can include the active profile's
      sanitized reason without granting the webview any native IPC capability.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <div role="status">Preparing the active Crux connection…</div>
      <div class="muted">Connection details and recovery actions are available from the Crux tray menu.</div>
    </div>
  </body>
</html>
