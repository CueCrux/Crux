# Crux Daemon — default values

replicaCount: 1

image:
  repository: ghcr.io/cuecrux/crux-daemon
  # -- Overrides the image tag; defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 14800

persistence:
  enabled: true
  size: 10Gi
  # -- Leave empty to use the cluster default StorageClass
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi

# -- Authentication mode: off | dev_scopes | jwt_hs256 | jwt_jwks
auth:
  mode: "off"

config:
  logFormat: "json"
  buildCcxi: "1"
  routeAuthMode: "enforce"

# -- Extra environment variables injected into the container
# Example:
#   env:
#     - name: CORECRUXD_SOME_SETTING
#       value: "true"
env: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: corecrux.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: corecrux-tls
  #    hosts:
  #      - corecrux.local

serviceMonitor:
  enabled: false
  interval: 30s
  # -- Additional labels for Prometheus Operator discovery
  additionalLabels: {}

# Prometheus alerting rules for the G7 coverage-attestation gauges
# (corecrux_coverage_* metrics, set by `corecruxctl receipts
# coverage-window-attest`). Mirrors crux_mcp::ledger::coverage_alert_rules_yaml.
prometheusRule:
  enabled: false
  # -- Additional labels for Prometheus Operator rule discovery
  additionalLabels: {}
  # Gap-total threshold above which CruxCoverageGapsHigh pages.
  gapsHighThreshold: 10

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true

nodeSelector: {}

tolerations: []

affinity: {}
